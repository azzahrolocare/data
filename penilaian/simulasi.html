<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Tampilan Situs - Az-Zahro</title>
    
    <!-- Tailwind CSS Framework -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 backdrop-blur-[3px] overflow-x-hidden select-none">

    <!-- Panel Kontrol Navigasi Terpadu (Glassmorphism Style) -->
    <header class="bg-white/80 border border-white/20 backdrop-blur-md p-2 px-4 rounded-full shadow-2xl flex items-center gap-4 mb-6 z-50 transition-all">
        <!-- Pemilih Halaman (Dropdown Menu) -->
        <div class="flex items-center">
            <select id="pageSelect" class="bg-white/90 text-gray-800 text-sm font-medium py-2 px-4 pr-8 rounded-full border border-gray-300 shadow-xs focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23555%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:10px_10px] bg-[right_14px_center] bg-no-repeat" onchange="updateIframeSource()">
                <option value="https://azzahro.web.id/data/penilaian/">📊 Data Penilaian</option>
                <option value="https://azzahro.web.id/data/penilaian/leger.html">📜 Data Leger</option>
            </select>
        </div>

        <!-- Garis Pembatas Vertikal -->
        <div class="h-6 w-px bg-gray-300/60"></div>

        <!-- Tombol Icon Perangkat -->
        <div class="flex gap-1.5">
            <!-- Icon Laptop -->
            <button id="btnDesktop" class="p-2.5 rounded-full border border-transparent bg-transparent text-gray-700 cursor-pointer transition-all duration-200 hover:text-blue-600" onclick="switchView('desktop')" title="Tampilan Laptop">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
                </svg>
            </button>
            <!-- Icon HP -->
            <button id="btnMobile" class="p-2.5 rounded-full border border-transparent bg-transparent text-gray-700 cursor-pointer transition-all duration-200 hover:text-blue-600" onclick="switchView('mobile')" title="Tampilan HP">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3M12 18.75h.008v.008H12v-.008Z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Judul Penanda Perangkat & Halaman -->
    <div class="text-center mb-6">
        <h2 id="deviceTitle" class="text-white font-semibold text-xl tracking-wide drop-shadow-md">Tampilan Laptop</h2>
    </div>

    <!-- Container Utama Perangkat -->
    <div class="w-full max-w-5xl flex-grow flex items-center justify-center">
        
        <!-- Tampilan Laptop (Premium Ultra-Thin Bezel) -->
        <div id="wrapperDesktop" class="w-full flex flex-col items-center transition-all duration-300">
            <!-- Layar & Bezel Tipis Laptop -->
            <div class="w-full bg-[#161617] rounded-t-xl p-1.5 pb-3 border border-[#2c2c2e] shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative">
                <!-- Kamera Web Kecil -->
                <div class="absolute top-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#050505] rounded-full ring-1 ring-white/5"></div>
                <!-- Layar Dalam Laptop -->
                <div class="w-full h-[520px] bg-white rounded-sm overflow-hidden relative shadow-inner">
                    <iframe id="iframeDesktop" src="https://azzahro.web.id/data/penilaian/" title="Tampilan Laptop" class="w-full h-full border-none bg-white"></iframe>
                </div>
            </div>
            <!-- Bodi Bawah Laptop -->
            <div class="w-[104%] h-4 bg-gradient-to-b from-[#d1d5db] to-[#9ca3af] rounded-b-lg border-t border-white/20 relative shadow-[0_15px_30px_rgba(0,0,0,0.4)]">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-1.5 bg-[#4b5563] rounded-b-md"></div>
            </div>
            <!-- Bayangan Dasar Laptop -->
            <div class="w-[98%] h-2 bg-black/30 blur-md rounded-full mt-1"></div>
        </div>

        <!-- Tampilan HP (Ultra-Thin Bezel Premium) -->
        <div id="wrapperMobile" class="hidden w-[360px] flex flex-col items-center transition-all duration-300">
            <div class="w-full h-[720px] bg-[#161617] rounded-[48px] shadow-[0_25px_60px_rgba(0,0,0,0.6)] p-2 border border-[#2c2c2e] relative">
                <!-- Kamera Web Bezel Atas -->
                <div class="absolute top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#050505] rounded-full ring-1 ring-white/5"></div>
                <!-- Layar Bezel-less HP -->
                <div class="w-full h-full bg-white rounded-[40px] overflow-hidden shadow-inner">
                    <iframe id="iframeMobile" src="https://azzahro.web.id/data/penilaian/" title="Tampilan Mobile" class="w-full h-full border-none bg-white"></iframe>
                </div>
            </div>
            <!-- Bayangan Dasar HP -->
            <div class="w-[90%] h-3 bg-black/40 blur-md rounded-full mt-3"></div>
        </div>

    </div>

    <!-- Script Pengendali Integrasi Halaman & Switch View -->
    <script>
        const activeClasses = ['bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md'];
        let currentView = 'desktop';

        // Set default aktif
        document.getElementById('btnDesktop').classList.add(...activeClasses);

        // Fungsi untuk mengubah halaman dalam iframe berdasarkan dropdown
        function updateIframeSource() {
            const selectedUrl = document.getElementById('pageSelect').value;
            document.getElementById('iframeDesktop').src = selectedUrl;
            document.getElementById('iframeMobile').src = selectedUrl;
        }

        // Fungsi mengubah layout orientasi perangkat
        function switchView(viewType) {
            const btnMobile = document.getElementById('btnMobile');
            const btnDesktop = document.getElementById('btnDesktop');
            const wrapperMobile = document.getElementById('wrapperMobile');
            const wrapperDesktop = document.getElementById('wrapperDesktop');
            const deviceTitle = document.getElementById('deviceTitle');
            
            currentView = viewType;

            if (viewType === 'mobile') {
                btnMobile.classList.add(...activeClasses);
                btnDesktop.classList.remove(...activeClasses);
                wrapperMobile.classList.remove('hidden');
                wrapperDesktop.classList.add('hidden');
                deviceTitle.innerText = "Tampilan HP";
            } else {
                btnDesktop.classList.add(...activeClasses);
                btnMobile.classList.remove(...activeClasses);
                wrapperDesktop.classList.remove('hidden');
                wrapperMobile.classList.add('hidden');
                deviceTitle.innerText = "Tampilan Laptop";
            }
        }
    </script>
</body>
</html>
