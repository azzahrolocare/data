<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Nilai Semester 2 - SMP Islam Az-Zahro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            deep: '#0F5132',
                            medium: '#146c43',
                            light: '#d1e7dd',
                            soft: '#f0fdf4'
                        },
                        gold: {
                            accent: '#D4AF37',
                            muted: '#c5a059',
                            light: '#fbf7eb'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .font-serif-custom {
            font-family: 'Playfair Display', Georgia, serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-16 text-gray-800">

    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm hidden flex-col justify-center items-center z-50">
        <div class="text-center p-6 max-w-sm">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-deep border-t-transparent mb-4"></div>
            <div class="font-bold text-emerald-deep flex items-center justify-center gap-2">
                <i data-lucide="database" class="w-5 h-5 animate-bounce text-gold-accent"></i>
                Menyimpan Data Ke Database...
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-40 bg-emerald-deep/95 backdrop-blur-md shadow-lg border-b border-emerald-medium/50 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-medium rounded-xl border border-emerald-light/20">
                    <i data-lucide="trending-up" class="w-6 h-6 text-gold-accent"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold tracking-widest text-gold-accent block uppercase">SMP Islam Az-Zahro</span>
                    <h1 class="text-lg md:text-xl font-serif-custom font-bold tracking-wide">Sistem Input Nilai Smt 2</h1>
                </div>
            </div>
            <a href="https://smpi-azzahro.github.io/data/penilaian/monitoring.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-gold-accent hover:bg-yellow-400 text-emerald-deep font-bold text-sm rounded-xl transition-all duration-300 shadow-md hover:shadow-lg active:scale-95">
                <i data-lucide="monitor" class="w-4 h-4"></i> Monitoring Nilai
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100">
            <div class="flex items-center gap-2.5 mb-6 border-b border-gray-100 pb-4">
                <i data-lucide="sliders-horizontal" class="w-5 h-5 text-emerald-deep"></i>
                <h5 class="text-lg font-bold text-gray-900 font-serif-custom">Pilih Kelas & Mata Pelajaran</h5>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
                <div class="md:col-span-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-1.5">
                        <i data-lucide="presentation" class="w-4 h-4 text-gray-400"></i> Pilih Kelas
                    </label>
                    <select id="selectKelas" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:bg-white focus:ring-2 focus:ring-emerald-medium/20 focus:border-emerald-deep transition-all outline-none appearance-none">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="KELAS 7">Kelas 7</option>
                        <option value="KELAS 8">Kelas 8</option>
                        <option value="KELAS 9">Kelas 9</option>
                        <option value="KELAS 10">Kelas 10</option>
                        <option value="KELAS 11">Kelas 11</option>
                        <option value="KELAS 12">Kelas 12</option>
                    </select>
                </div>
                
                <div class="md:col-span-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-1.5">
                        <i data-lucide="book-open" class="w-4 h-4 text-gray-400"></i> Pilih Mata Pelajaran / Program
                    </label>
                    <select id="selectMapel" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:bg-white focus:ring-2 focus:ring-emerald-medium/20 focus:border-emerald-deep transition-all outline-none">
                        <option value="">-- Pilih Mapel --</option>
                        <optgroup label="KELOMPOK A (WAJIB)" class="font-semibold text-emerald-deep bg-emerald-soft/50">
                            <option value="PA_BP" class="font-normal text-gray-900 bg-white">PA dan BP</option>
                            <option value="PPKN" class="font-normal text-gray-900 bg-white">PPKn</option>
                            <option value="B_INDO" class="font-normal text-gray-900 bg-white">B. Indonesia</option>
                            <option value="MATEMATIKA" class="font-normal text-gray-900 bg-white">Matematika</option>
                            <option value="IPS" class="font-normal text-gray-900 bg-white">IPS</option>
                            <option value="B_INGGRIS" class="font-normal text-gray-900 bg-white">B. Inggris</option>
                        </optgroup>
                        <optgroup label="KELOMPOK B (WAJIB)" class="font-semibold text-emerald-deep bg-emerald-soft/50">
                            <option value="SENI_BUD" class="font-normal text-gray-900 bg-white">Seni Budaya</option>
                            <option value="PENJAS" class="font-normal text-gray-900 bg-white">Penjas</option>
                            <option value="IPA" class="font-normal text-gray-900 bg-white">IPA</option>
                        </optgroup>
                        <optgroup label="KELOMPOK C & PROGRAM" class="font-semibold text-emerald-deep bg-emerald-soft/50">
                            <option value="TIK" class="font-normal text-gray-900 bg-white">TIK</option>
                            <option value="BTQ" class="font-normal text-gray-900 bg-white">BTQ</option>
                            <option value="PRAKARYA" class="font-normal text-gray-900 bg-white">Prakarya</option>
                            <option value="B_MADURA" class="font-normal text-gray-900 bg-white">B. Madura</option>
                            <option value="TAHFIDZ" class="font-normal text-gray-900 bg-white">Program Tahfidz</option>
                        </optgroup>
                        <optgroup label="REKAP KEHADIRAN" class="font-semibold text-emerald-deep bg-emerald-soft/50">
                            <option value="KEHADIRAN" class="font-normal text-gray-900 bg-white">Alpha, Sakit, Izin</option>
                        </optgroup>
                    </select>
                </div>
                
                <div class="md:col-span-3">
                    <button id="btnMuat" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 bg-emerald-deep hover:bg-emerald-medium text-white font-bold rounded-xl transition-all duration-300 shadow-md hover:shadow-lg active:scale-[0.98]">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Muat Daftar Siswa
                    </button>
                </div>
            </div>
        </div>

        <div id="alertBox" class="hidden p-4 rounded-2xl shadow-sm border mt-5 transition-all duration-300 text-sm font-medium flex items-center gap-3"></div>

        <div id="containerTabel" class="hidden bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 mt-6 transition-all duration-500">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-100 pb-5 mb-6">
                <div>
                    <h4 id="judulTabel" class="text-xl font-serif-custom font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="table-2" class="w-5 h-5 text-emerald-deep"></i> Daftar Siswa
                    </h4>
                    <div id="infoKkm" class="inline-flex items-center gap-1 mt-2 text-xs font-semibold bg-emerald-soft text-emerald-deep border border-emerald-light px-3 py-1.5 rounded-xl"></div>
                </div>
                <button id="btnSimpanAtas" class="inline-flex items-center justify-center gap-2 px-5 py-3 bg-emerald-deep hover:bg-emerald-medium text-white font-bold text-sm rounded-xl transition-all duration-300 shadow-md hover:shadow-lg">
                    <i data-lucide="save" class="w-4 h-4 text-gold-accent"></i> Simpan Semua Nilai
                </button>
            </div>

            <div id="mobileCardsWrapper" class="md:hidden space-y-4 mb-6"></div>

            <div class="overflow-x-auto rounded-2xl border border-gray-100 hidden md:block">
                <table class="w-full text-left border-collapse">
                    <thead id="headTabel" class="bg-emerald-deep text-white text-xs font-semibold uppercase tracking-wider">
                        </thead>
                    <tbody id="bodyTabel" class="divide-y divide-gray-100 text-sm">
                        </tbody>
                </table>
            </div>

            <div class="flex justify-end mt-6">
                <button id="btnSimpanBawah" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-emerald-deep hover:bg-emerald-medium text-white font-bold text-sm rounded-xl transition-all duration-300 shadow-md hover:shadow-lg">
                    <i data-lucide="save" class="w-4 h-4 text-gold-accent"></i> Simpan Semua Nilai
                </button>
            </div>
        </div>
    </main>

    <script>
        const CONFIG_GAS_URL = "https://script.google.com/macros/s/AKfycbz3vYiQLbsJFsT1JPyY7pcc2b0GZp2CPoefoYOmthQ0rr5j3sjFQsg50CDxlAyapz3j/exec";

        const MAPEL_MAPPING = {
            "PA_BP":       { nama: "PA dan BP",        kkm: 75, p: 4,  k: 5 },  
            "PPKN":        { nama: "PPKn",             kkm: 70, p: 6,  k: 7 },  
            "B_INDO":      { nama: "B. INDONESIA",     kkm: 72, p: 8,  k: 9 },  
            "MATEMATIKA":  { nama: "MATEMATIKA",       kkm: 70, p: 10, k: 11 }, 
            "IPS":         { nama: "IPS",              kkm: 72, p: 12, k: 13 }, 
            "B_INGGRIS":   { nama: "B. INGGRIS",       kkm: 60, p: 14, k: 15 }, 
            "SENI_BUD":    { nama: "SENI BUDAYA",      kkm: 69, p: 16, k: 17 }, 
            "PENJAS":      { nama: "PENJAS",           kkm: 75, p: 18, k: 19 }, 
            "IPA":         { nama: "IPA",              kkm: 70, p: 20, k: 21 }, 
            "TIK":         { nama: "TIK",              kkm: 70, p: 22, k: 23 }, 
            "BTQ":         { nama: "BTQ",              kkm: 70, p: 24, k: 25 }, 
            "PRAKARYA":    { nama: "PRAKARYA",         kkm: 70, p: 26, k: 27 }, 
            "B_MADURA":    { nama: "B. MADURA",        kkm: 70, p: 28, k: 29 }, 
            "TAHFIDZ":     { nama: "PROGRAM TAHFIDZ",  kkm: 68, p: 30, k: 31 }, 
            "KEHADIRAN":   { nama: "Tingkat Kehadiran", kkm: null, alpha: 34, sakit: 35 } 
        };

        const selectKelas = document.getElementById('selectKelas');
        const selectMapel = document.getElementById('selectMapel');
        const btnMuat = document.getElementById('btnMuat');
        const containerTabel = document.getElementById('containerTabel');
        const judulTabel = document.getElementById('judulTabel');
        const infoKkm = document.getElementById('infoKkm');
        const headTabel = document.getElementById('headTabel');
        const bodyTabel = document.getElementById('bodyTabel');
        const mobileCardsWrapper = document.getElementById('mobileCardsWrapper');
        const btnSimpanAtas = document.getElementById('btnSimpanAtas');
        const btnSimpanBawah = document.getElementById('btnSimpanBawah');
        const alertBox = document.getElementById('alertBox');
        const loadingOverlay = document.getElementById('loadingOverlay');

        let dataSiswaAktif = []; 

        btnMuat.addEventListener('click', async () => {
            const kelas = selectKelas.value;
            const mapelKey = selectMapel.value;

            if (!kelas || !mapelKey) {
                showAlert('danger', 'Silakan pilih Kelas dan Mata Pelajaran terlebih dahulu!');
                return;
            }

            showAlert('info', 'Memuat data siswa harian...');
            containerTabel.classList.add('hidden');
            
            const mapelInfo = MAPEL_MAPPING[mapelKey];
            let colPParam = mapelInfo.p || mapelInfo.alpha || "";
            let colKParam = mapelInfo.k || mapelInfo.sakit || "";
            
            try {
                const urlFetch = `${CONFIG_GAS_URL}?kelas=${encodeURIComponent(kelas)}&colP=${colPParam}&colK=${colKParam}`;
                const response = await fetch(urlFetch);
                const result = await response.json();

                if (result.status === "success") {
                    dataSiswaAktif = result.data;
                    if (dataSiswaAktif.length === 0) {
                        showAlert('warning', `Tidak ada data siswa ditemukan di tab ${kelas} (Baris 11+ kosong).`);
                        return;
                    }
                    
                    renderTabel(mapelKey, mapelInfo);
                    showAlert('success', `Berhasil memuat ${dataSiswaAktif.length} data siswa.`);
                } else {
                    showAlert('danger', `Gagal: ${result.message}`);
                }
            } catch (error) {
                console.error(error);
                showAlert('danger', 'Terjadi kesalahan jaringan saat mengambil data. Pastikan URL GAS benar.');
            }
        });

        function renderTabel(mapelKey, mapelInfo) {
            judulTabel.innerHTML = `<i data-lucide="table-2" class="w-5 h-5 text-emerald-deep"></i> Input Nilai: ${mapelInfo.nama}`;
            if (mapelInfo.kkm) {
                infoKkm.classList.remove('hidden');
                infoKkm.innerHTML = `<i data-lucide="target" class="w-3.5 h-3.5 text-gold-accent"></i> Standar KKM: ${mapelInfo.kkm}`;
            } else {
                infoKkm.classList.add('hidden');
            }

            // Set Judul Kolom Desktop View
            if (mapelKey === "KEHADIRAN") {
                headTabel.innerHTML = `
                    <tr class="divide-x divide-emerald-medium text-center">
                        <th class="py-4 px-3 w-[8%]">No</th>
                        <th class="py-4 px-3 w-[15%]">NIS</th>
                        <th class="py-4 px-4 text-left">Nama Lengkap Siswa</th>
                        <th class="py-4 px-3 w-[15%]">Alpha (α)</th>
                        <th class="py-4 px-3 w-[15%]">Sakit (S)</th>
                    </tr>
                `;
            } else {
                headTabel.innerHTML = `
                    <tr class="divide-x divide-emerald-medium text-center">
                        <th class="py-4 px-3 w-[8%]">No</th>
                        <th class="py-4 px-3 w-[15%]">NIS</th>
                        <th class="py-4 px-4 text-left">Nama Lengkap Siswa</th>
                        <th class="py-4 px-3 w-[15%]">Pengetahuan</th>
                        <th class="py-4 px-3 w-[15%]">Keterampilan</th>
                    </tr>
                `;
            }

            bodyTabel.innerHTML = "";
            mobileCardsWrapper.innerHTML = "";

            const labelP = mapelKey === "KEHADIRAN" ? "Alpha (α)" : "Pengetahuan";
            const labelK = mapelKey === "KEHADIRAN" ? "Sakit (S)" : "Keterampilan";

            dataSiswaAktif.forEach((siswa) => {
                const valP = siswa.valP !== undefined && siswa.valP !== null ? siswa.valP : "";
                const valK = siswa.valK !== undefined && siswa.valK !== null ? siswa.valK : "";

                // 1. BANGUN HTML KARTU (MOBILE VIEW)
                const cardHTML = `
                    <div class="bg-gray-50 rounded-2xl p-4 border border-gray-200/70 shadow-sm space-y-3">
                        <div class="flex items-center justify-between border-b border-gray-200/60 pb-2">
                            <div>
                                <span class="text-[10px] font-mono font-bold text-gray-400 block tracking-wider">NIS: ${siswa.nis || '-'}</span>
                                <h5 class="font-bold text-gray-900 text-sm">${siswa.no}. ${siswa.nama}</h5>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-bold text-gray-500 mb-1">${labelP}</label>
                                <input type="number" class="w-full text-center bg-white border border-gray-200 focus:ring-4 focus:ring-emerald-medium/10 focus:border-emerald-deep font-bold px-2 py-2 text-sm rounded-xl outline-none transition-all input-p-mobile" 
                                       data-row="${siswa.row}" value="${valP}" min="0" max="100">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-500 mb-1">${labelK}</label>
                                <input type="number" class="w-full text-center bg-white border border-gray-200 focus:ring-4 focus:ring-emerald-medium/10 focus:border-emerald-deep font-bold px-2 py-2 text-sm rounded-xl outline-none transition-all input-k-mobile" 
                                       data-row="${siswa.row}" value="${valK}" min="0" max="100">
                            </div>
                        </div>
                    </div>
                `;
                mobileCardsWrapper.insertAdjacentHTML('beforeend', cardHTML);

                // 2. BANGUN HTML TR (DESKTOP VIEW)
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition-colors divide-x divide-gray-100 text-gray-700 font-medium";
                tr.innerHTML = `
                    <td class="text-center py-3.5 font-bold text-gray-400">${siswa.no || '-'}</td>
                    <td class="text-center py-3.5 text-xs font-mono tracking-wider text-gray-500">${siswa.nis || '-'}</td>
                    <td class="py-3.5 px-4 font-semibold text-gray-900">${siswa.nama}</td>
                    <td class="py-3.5 px-3">
                        <input type="number" class="w-full max-w-[100px] mx-auto block text-center bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-emerald-medium/10 focus:border-emerald-deep font-semibold px-2 py-1.5 rounded-lg outline-none transition-all input-p-desktop" 
                               data-row="${siswa.row}" value="${valP}" min="0" max="100">
                    </td>
                    <td class="py-3.5 px-3">
                        <input type="number" class="w-full max-w-[100px] mx-auto block text-center bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-emerald-medium/10 focus:border-emerald-deep font-semibold px-2 py-1.5 rounded-lg outline-none transition-all input-k-desktop" 
                               data-row="${siswa.row}" value="${valK}" min="0" max="100">
                    </td>
                `;
                bodyTabel.appendChild(tr);
            });

            // Sinkronisasi Pengisian Otomatis Antara Input Kartu HP & Tabel Desktop
            hubungkanInputLayar();

            containerTabel.classList.remove('hidden');
            lucide.createIcons();
        }

        // Fungsi Penjaga: Jika Guru Mengetik Di HP/Desktop, Kedua Sisi Data Otomatis Selaras
        function hubungkanInputLayar() {
            const pMobile = document.querySelectorAll('.input-p-mobile');
            const pDesktop = document.querySelectorAll('.input-p-desktop');
            const kMobile = document.querySelectorAll('.input-k-mobile');
            const kDesktop = document.querySelectorAll('.input-k-desktop');

            for(let i=0; i < pMobile.length; i++) {
                pMobile[i].addEventListener('input', (e) => pDesktop[i].value = e.target.value);
                pDesktop[i].addEventListener('input', (e) => pMobile[i].value = e.target.value);
                kMobile[i].addEventListener('input', (e) => kDesktop[i].value = e.target.value);
                kDesktop[i].addEventListener('input', (e) => kMobile[i].value = e.target.value);
            }
        }

        btnSimpanAtas.addEventListener('click', simpanSemuaNilai);
        btnSimpanBawah.addEventListener('click', simpanSemuaNilai);

        async function simpanSemuaNilai() {
            const kelas = selectKelas.value;
            const mapelKey = selectMapel.value;
            const mapelInfo = MAPEL_MAPPING[mapelKey];

            if (!kelas || !mapelKey) return;

            // Membaca Melalui Elemen Desktop (Karena Nilainya Dipastikan Selalu Sama Berkat Sinkronisasi Di Atas)
            const inputsP = document.querySelectorAll('.input-p-desktop');
            const inputsK = document.querySelectorAll('.input-k-desktop');
            const scoresPayload = [];
            
            for (let i = 0; i < inputsP.length; i++) {
                const row = inputsP[i].getAttribute('data-row');
                const pValue = inputsP[i].value.trim();
                const kValue = inputsK[i].value.trim();

                scoresPayload.push({
                    row: row,
                    p: pValue === "" ? "" : Number(pValue),
                    k: kValue === "" ? "" : Number(kValue)
                });
            }

            const payload = {
                kelas: kelas,
                colP: mapelInfo.p || mapelInfo.alpha,
                colK: mapelInfo.k || mapelInfo.sakit,
                scores: scoresPayload
            };

            loadingOverlay.classList.remove('hidden');
            showAlert('info', 'Sedang mengunggah rangkuman data ke Google Sheets...');

            try {
                const response = await fetch(CONFIG_GAS_URL, {
                    method: 'POST',
                    mode: 'cors',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                loadingOverlay.classList.add('hidden');

                if (result.status === "success") {
                    showAlert('success', `🎉 Sukses! Seluruh data penilaian ${mapelInfo.nama} untuk ${kelas} telah diperbarui di server.`);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showAlert('danger', `Gagal menyimpan data: ${result.message}`);
                }

            } catch (error) {
                loadingOverlay.classList.add('hidden');
                console.error(error);
                showAlert('danger', 'Kesalahan jaringan / CORS Blocked. Pastikan setelan Web App GAS Anda valid.');
            }
        }

        function showAlert(type, message) {
            alertBox.classList.remove('hidden', 'bg-emerald-soft', 'text-emerald-deep', 'border-emerald-light', 'bg-red-50', 'text-red-700', 'border-red-100', 'bg-blue-50', 'text-blue-700', 'border-blue-100', 'bg-amber-50', 'text-amber-700', 'border-amber-100');
            
            let iconMarkup = "";
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-soft', 'text-emerald-deep', 'border-emerald-light');
                iconMarkup = `<i data-lucide="check-circle-2" class="w-5 h-5 flex-shrink-0 text-emerald-deep"></i>`;
            } else if (type === 'danger') {
                alertBox.classList.add('bg-red-50', 'text-red-700', 'border-red-100');
                iconMarkup = `<i data-lucide="alert-octagon" class="w-5 h-5 flex-shrink-0 text-red-600"></i>`;
            } else if (type === 'warning') {
                alertBox.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-100');
                iconMarkup = `<i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0 text-amber-600"></i>`;
            } else {
                alertBox.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-100');
                iconMarkup = `<i data-lucide="info" class="w-5 h-5 flex-shrink-0 text-blue-600"></i>`;
            }

            alertBox.innerHTML = `${iconMarkup} <div>${message}</div>`;
            lucide.createIcons();
        }

        lucide.createIcons();
    </script>
</body>
</html>
