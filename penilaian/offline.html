<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - Az-Zahro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #09331f, #146c43);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white p-4">

    <div class="glass-panel rounded-3xl max-w-sm w-full p-8 text-center shadow-2xl">
        <div class="w-20 h-20 bg-amber-500/10 text-amber-400 rounded-full flex justify-center items-center mx-auto mb-6 border border-amber-500/20 animate-pulse">
            <i data-lucide="wifi-off" class="w-10 h-10"></i>
        </div>
        
        <h3 class="text-xl font-bold tracking-wide">Mode Offline Aktif</h3>
        <p class="text-xs text-white/70 mt-3 leading-relaxed">
            Perangkat Anda sedang tidak terhubung ke internet. Halaman ini ditampilkan secara lokal.
        </p>

        <div class="mt-6">
            <button onclick="window.location.reload()" class="w-full py-3 bg-gradient-to-r #146c43 to #0F5132 hover:scale-105 transition-all text-xs font-bold rounded-xl border border-white/10 shadow-lg flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Coba Hubungkan Kembali
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
