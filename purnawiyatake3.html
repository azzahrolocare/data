<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        /* Background Luxury Black Gold Gradient */
        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        /* Efek Kilau Emas pada Teks */
        .gold-text {
            background: linear-gradient(to right, #ffe066 0%, #f5af19 50%, #e65c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Border Emas Bercahaya */
        .gold-border {
            border: 3px solid transparent;
            background-image: linear-gradient(#111, #111), linear-gradient(to right, #ffe066, #f5af19, #e65c00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between items-center text-white p-6 relative">

    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/black-thread.png')] opacity-30 pointer-events-none"></div>

    <div class="w-full flex justify-between items-center z-10 max-w-6xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-emerald-700 rounded-full flex items-center justify-center font-bold text-xs border border-yellow-500">LOGO</div>
            <div class="text-xs tracking-wider text-gray-400">SMP ISLAM AZ-ZAHRO</div>
        </div>
        <div class="text-right">
            <span class="text-sm font-bold tracking-widest text-yellow-500">SELAMAT & SUKSES</span>
        </div>
    </div>

    <div id="card-container" class="w-full max-w-5xl bg-neutral-900/80 backdrop-blur-md rounded-2xl shadow-2xl p-8 gold-border grid grid-cols-1 md:grid-cols-12 gap-8 items-center my-auto z-10 min-h-[450px]">
        
        <div class="md:col-span-4 flex justify-center">
            <div class="relative w-64 h-80 rounded-xl overflow-hidden border-4 border-yellow-500/50 shadow-xl bg-neutral-800 flex items-center justify-center">
                <img id="siswa-foto" src="" alt="Foto Siswa" class="w-full h-full object-cover object-top opacity-0 transition-opacity duration-500">
                <div id="loading-foto" class="absolute text-sm text-gray-500">Memuat Foto...</div>
            </div>
        </div>

        <div class="md:col-span-8 space-y-6 text-center md:text-left flex flex-col justify-center">
            <div>
                <h1 id="siswa-nama" class="text-4xl md:text-5xl font-black tracking-wide uppercase text-white drop-shadow-md">
                    -
                </h1>
                <p id="siswa-ttl" class="text-xl md:text-2xl font-semibold text-yellow-400 mt-2 tracking-wide">
                    -, -
                </p>
            </div>

            <div class="h-[2px] bg-gradient-to-right from-yellow-500 via-yellow-200 to-transparent w-full"></div>

            <p id="siswa-ortu" class="text-2xl md:text-3xl font-medium italic text-gray-200">
                -
            </p>

            <div class="pt-4">
                <p class="text-lg tracking-widest font-bold text-yellow-600 uppercase">PURNAWIYATA KE-III</p>
                <p class="text-2xl md:text-3xl font-black tracking-wider text-white">SMP ISLAM AZ-ZAHRO</p>
            </div>
        </div>

    </div>

    <div class="w-full max-w-md flex flex-col items-center gap-4 z-10 pb-4">
        <div class="flex gap-4 w-full">
            <button id="btn-prev" class="flex-1 bg-neutral-800 hover:bg-neutral-700 text-yellow-500 font-bold py-3 px-6 rounded-lg transition border border-yellow-600/30 active:scale-95 cursor-pointer">
                ⬅️ Sebelumnya
            </button>
            <button id="btn-next" class="flex-1 bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-neutral-900 font-black py-3 px-6 rounded-lg transition shadow-lg active:scale-95 cursor-pointer">
                Selanjutnya ➡️
            </button>
        </div>
        
        <span id="page-info" class="text-xs tracking-widest text-gray-500 uppercase">Siswa 0 dari 0</span>
    </div>

    <audio id="bg-music" loop>
        <source src="musik_purnawiyata.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <button id="btn-music" class="absolute bottom-4 right-4 bg-neutral-800/80 p-3 rounded-full text-xl border border-yellow-500/50 cursor-pointer z-20 hover:bg-neutral-700">
        🎵
    </button>

    <script>
        let daftarSiswa = [];
        let currentIndex = 0;

        const cardContainer = document.getElementById('card-container');
        const fotoEl = document.getElementById('siswa-foto');
        const loadingFoto = document.getElementById('loading-foto');
        const namaEl = document.getElementById('siswa-nama');
        const ttlEl = document.getElementById('siswa-ttl');
        const ortuEl = document.getElementById('siswa-ortu');
        const pageInfoEl = document.getElementById('page-info');
        
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const bgMusic = document.getElementById('bg-music');
        const btnMusic = document.getElementById('btn-music');

        // Fetch data dari file JSON
        async function loadSiswaData() {
            try {
                const response = await fetch('siswa.json');
                daftarSiswa = await response.json();
                if(daftarSiswa.length > 0) {
                    tampilkanSiswa(currentIndex);
                }
            } catch (error) {
                console.error("Gagal memuat data siswa:", error);
                namaEl.innerText = "Gagal memuat data siswa.json";
            }
        }

        // Fungsi Menampilkan Data dengan Animasi
        function tampilkanSiswa(index) {
            if (daftarSiswa.length === 0) return;

            // Reset Animasi Masuk dengan Animate.css
            cardContainer.classList.remove('animate__animated', 'animate__fadeInUp');
            void cardContainer.offsetWidth; // Trigger reflow untuk merestart animasi
            cardContainer.classList.add('animate__animated', 'animate__fadeInUp');

            const siswa = daftarSiswa[index];

            // Set Teks Identitas
            namaEl.innerText = siswa.nama;
            ttlEl.innerText = `${siswa.tempat_lahir}, ${siswa.tanggal_lahir}`;
            
            // Logika Jenis Kelamin (L = Putra dari, P = Putri dari)
            if (siswa.jk.toUpperCase() === 'P') {
                ortuEl.innerText = `Putri dari Bpk. ${siswa.ortu}`;
            } else {
                ortuEl.innerText = `Putra dari Bpk. ${siswa.ortu}`;
            }

            // Handle Foto & Loading State
            fotoEl.style.opacity = '0';
            loadingFoto.style.display = 'block';
            fotoEl.src = siswa.foto;
            
            fotoEl.onload = () => {
                loadingFoto.style.display = 'none';
                fotoEl.style.opacity = '1';
            };

            // Update Info Halaman
            pageInfoEl.innerText = `Siswa ${index + 1} dari ${daftarSiswa.length}`;
        }

        // Navigasi Tombol
        btnNext.addEventListener('click', () => {
            if (daftarSiswa.length === 0) return;
            currentIndex = (currentIndex + 1) % daftarSiswa.length; // Kembali ke awal jika sudah data terakhir
            tampilkanSiswa(currentIndex);
            playAudioOnInteraction();
        });

        btnPrev.addEventListener('click', () => {
            if (daftarSiswa.length === 0) return;
            currentIndex = (currentIndex - 1 + daftarSiswa.length) % daftarSiswa.length; // Ke akhir jika mundur dari data pertama
            tampilkanSiswa(currentIndex);
            playAudioOnInteraction();
        });

        // Kontrol Musik
        btnMusic.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                btnMusic.innerText = "🔊";
            } else {
                bgMusic.pause();
                btnMusic.innerText = "🔇";
            }
        });

        function playAudioOnInteraction() {
            // Membantu memutar audio otomatis saat user mulai klik tombol selanjutnya/sebelumnya
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    btnMusic.innerText = "🔊";
                }).catch(err => console.log("Audio play diblokir oleh browser sebelum ada interaksi langsung."));
            }
        }

        // Jalankan saat halaman dibuka
        window.onload = loadSiswaData;
    </script>
</body>
</html>
