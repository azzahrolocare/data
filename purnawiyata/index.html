<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE UMUM & STRUKTUR HALAMAN (OPTIMALISASI LAYAR STABIL 4K)
       ========================================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0c08; 
      background: radial-gradient(circle at center, #261b0c 0%, #0f0c08 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #main-gallery-content {
      display: none;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      padding: 40px;
    }

    /* ==========================================================================
       STYLE OPENING
       ========================================================================== */
    #opening-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0f0c08;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #particle-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      display: none;
      pointer-events: none;
    }

    .video-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    #video-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      cursor: pointer;
    }

    .overlay-dark {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.35);
      z-index: 3;
      display: none;
      pointer-events: none;
    }

    .interface-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #fff;
    }

    .card-start {
      border: 2px solid #d4af37;
      padding: 50px 80px;
      background: rgba(26, 21, 14, 0.95);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
    }

    .card-start h1 {
      color: #d4af37;
      margin-bottom: 15px;
      letter-spacing: 3px;
      font-size: 2.8rem;
    }

    .card-start p {
      color: #e0e0e0;
      margin-bottom: 35px;
      font-size: 1.5rem;
    }

    .btn-gold {
      padding: 18px 50px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      font-size: 1.4rem;
      cursor: pointer;
      border-radius: 40px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      color: #0f0c08;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-gold:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(243, 229, 171, 0.6);
    }

    .btn-skip {
      position: fixed;
      bottom: 50px;
      right: 50px;
      background: none;
      border: none;
      color: #f3e5ab;
      cursor: pointer;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      font-size: 4.5rem;
      font-weight: bold;
      opacity: 0.4;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
      user-select: none;
    }

    .btn-skip:hover {
      opacity: 0.95;
      color: #ffffff;
      transform: scale(1.15) translateX(5px);
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
    }

    /* ==========================================================================
       STYLE PROSESI SISWA (SISTEM TATA LETAK PROPORSIONAL & ANTI-KEDIP)
       ========================================================================== */
    .particle {
      position: absolute;
      background: rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
      z-index: 1;
      transform: translateZ(0); 
      will-change: transform;
    }

    @keyframes floatParticles {
      0% { transform: translate3d(0, 105vh, 0) scale(0.3); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translate3d(0, -10vh, 0) scale(1.2); opacity: 0; }
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 2200px;
      height: 85vh; 
      z-index: 10;
      position: relative;
    }

    .purnawiyata-card {
      display: flex;
      width: 100%;
      height: 100%;
      background: #14100a;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transform: translate3d(0, 20px, 0);
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .purnawiyata-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 3px solid #d4af37;
      border-radius: 24px;
      box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.2);
      z-index: 1;
      pointer-events: none;
    }

    .card-content-wrapper {
      display: grid;
      grid-template-columns: 24% 52% 24%; 
      width: 100%;
      height: 100%;
      background: inherit;
      overflow: hidden;
      z-index: 2;
    }

    .column-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #aa7c11, #d4af37, #aa7c11);
      padding: 40px 30px;
      position: relative;
      box-shadow: 5px 0 20px rgba(0,0,0,0.4);
      z-index: 5;
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 3 / 4; 
      border: 6px solid #fff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      background: #221c13;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .absen-label {
      background: rgba(15, 12, 8, 0.95);
      color: #f3e5ab;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      width: 100%;
      text-transform: uppercase;
    }
    .absen-label span { color: #ffffff; }

    .music-control-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 12, 8, 0.9);
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      justify-content: center;
    }

    .btn-music-toggle {
      background: none;
      border: none;
      color: #f3e5ab;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .btn-music-toggle svg { width: 22px; height: 22px; }

    .audio-visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px; 
      flex: 1;
      height: 25px; 
    }

    .visualizer-bar {
      flex: 1;
      max-width: 3px; 
      background: #f3e5ab;
      height: 3px;
      border-radius: 1px 1px 0 0;
      will-change: height;
    }

    .column-center {
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      overflow: hidden;
      background: #110d08;
      position: relative;
      z-index: 4;
    }

    .spotlight-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
      z-index: 0;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .school-logo { width: 85px; height: auto; }
    .logo-ppss { width: 190px; height: auto; }

    .header-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .identity-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; 
      margin: 20px 0;
      z-index: 2;
    }

    .name-container, .ttl-container, .ortu-container, .nis-container, .wish-container {
      position: relative;
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      will-change: transform, opacity;
    }

    .fade-in-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .name-container {
      min-height: 100px;
      display: flex;
      align-items: center;
      padding-bottom: 15px;
    }

    #siswa-nama {
      font-size: 3.2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding-bottom: 8px;
      line-height: 1.2;
      width: 100%;
      position: relative;
    }

    #siswa-nama::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(to right, #a67c1e, #f3e5ab, #a67c1e);
    }

    .ttl-container { height: 40px; display: flex; align-items: center; margin-top: 15px; }
    #siswa-ttl { font-size: 1.7rem; color: #e0e0e0; font-weight: 500; }

    .ortu-container { height: 40px; display: flex; align-items: center; }
    .sub-detail { font-size: 1.8rem; font-style: italic; color: #f3e5ab; }

    .nis-container { height: 50px; display: flex; align-items: center; margin-top: 10px; }
    
    .nis-box { 
      font-size: 1.4rem; 
      color: #ffffff; 
      font-weight: 700; 
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 18px;
      border-radius: 6px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .wish-container { height: 80px; display: flex; align-items: center; margin-top: 20px; }
    
    .wish-box {
      font-size: 1.5rem;
      color: #ffffff;
      background: rgba(212, 175, 55, 0.12);
      padding: 12px 25px;
      border-left: 6px solid #d4af37;
      border-radius: 0 6px 6px 0;
    }
    .wish-box span { color: #f3e5ab; font-weight: bold; }

    .footer-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1.3;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 15px;
      z-index: 2;
    }
    .footer-title span { color: #d4af37; font-size: 1.8rem; font-weight: 800; }

    .column-right {
      position: relative;
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0c08;
      border-left: 1px solid rgba(212, 175, 55, 0.15);
      z-index: 3;
    }

    .column-right::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 30%;
      background: linear-gradient(to top, #110d08 10%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .image-reveal-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .img-base-bw {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.5);
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      z-index: 2;
    }

    .img-reveal-color {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }

    .reveal-active .img-reveal-color { opacity: 1; }

    .cc-particle {
      position: absolute;
      background: radial-gradient(circle, #f3e5ab 20%, #d4af37 60%, transparent 100%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      filter: blur(1px);
      animation: ccFloatUp linear infinite;
      will-change: transform, opacity;
    }

    @keyframes ccFloatUp {
      0% {
        transform: translate3d(0, 0, 0) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translate3d(0, -120vh, 0) scale(1.5);
        opacity: 0;
      }
    }

    /* NAVIGASI TOMBOL - DIPERBARUI */
    .btn-nav-arrow {
      position: fixed;
      bottom: 20px; /* Di ujung bawah */
      background: none; /* Tanpa latar belakang */
      border: none; /* Tanpa bingkai */
      color: #d4af37;
      font-size: 5rem; /* Ukuran panah besar */
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      user-select: none;
      z-index: 100;
      opacity: 0.15; /* Sangat samar dan pudar */
      padding: 10px;
    }

    .btn-nav-arrow[aria-label="Siswa Sebelumnya"] { 
      left: 20px; /* Di ujung kiri bawah */
    }
    
    .btn-nav-arrow[aria-label="Siswa Selanjutnya"] { 
      right: 20px; /* Di ujung kanan bawah */
    }

    .btn-nav-arrow:hover {
      color: #f3e5ab;
      opacity: 0.6; /* Sedikit lebih terlihat saat hover */
      transform: scale(1.1);
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    .purnawiyata-card.active {
      animation: cardEntrance 0.5s ease-out forwards;
    }
    @keyframes cardEntrance {
      0% { opacity: 0; transform: translate3d(0, 15px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* RESPONSIVE LAYOUT HP / TABLET */
    @media (max-width: 1200px) {
      body { overflow-y: auto; }
      #main-gallery-content { padding: 20px; height: auto; }
      .main-container { height: auto; padding-bottom: 100px; }
      .purnawiyata-card { height: auto; }
      .card-content-wrapper { grid-template-columns: 100%; }
      .column-left { width: 100%; padding: 30px; }
      .photo-frame { height: 350px; max-width: 280px; }
      .column-center { padding: 30px 20px; text-align: center; align-items: center; }
      .logo-wrapper { justify-content: center; }
      #siswa-nama { font-size: 2.2rem; }
      #siswa-ttl { font-size: 1.3rem; }
      .sub-detail { font-size: 1.4rem; }
      .nis-box { font-size: 1.1rem; }
      .wish-box { font-size: 1.2rem; }
      .footer-title { font-size: 1.2rem; }
      .footer-title span { font-size: 1.5rem; }
      .column-right { height: 350px; width: 100%; border-left: none; border-top: 1px solid rgba(212, 175, 55, 0.2); }
      
      /* Tombol navigasi di mobile tetap di bawah, tapi mungkin sedikit disesuaikan ukurannya */
      .btn-nav-arrow { font-size: 3.5rem; bottom: 10px; }
      .btn-nav-arrow[aria-label="Siswa Sebelumnya"] { left: 10px; }
      .btn-nav-arrow[aria-label="Siswa Selanjutnya"] { right: 10px; }
    }
  </style>
</head>
<body>

  <div id="opening-container">
    <canvas id="particle-canvas"></canvas>

    <div class="video-wrapper">
      <video id="video-bg" playsinline loop onclick="togglePlayPause()">
        <source src="https://azzahrolocare.github.io/data/purnawiyata/files/opening3.mp4" type="video/mp4">
        Browser tidak mendukung video HTML5.
      </video>
    </div>

    <div class="overlay-dark" id="overlay-dark"></div>

    <div class="interface-container" id="start-interface">
      <div class="card-start">
        <h1>SELAMAT & SUKSES</h1>
        <p>Purnawiyata Ke-III SMP Islam Az-Zahro</p>
        <button class="btn-gold" onclick="mulaiVideoSinematik()">Putar Video Pembuka</button>
      </div>
    </div>

    <button class="btn-skip" id="btn-skip" onclick="menujuGaleriUtama()">❯</button>
  </div>

  <audio id="bg-music" loop preload="auto" crossorigin="anonymous">
    <source src="https://azzahrolocare.github.io/data/purnawiyata/graduation-anthem.mp3" type="audio/mpeg">
  </audio>

  <div id="main-gallery-content">
    <main class="main-container">
      <div class="purnawiyata-card" id="student-card">
        
        <div class="card-content-wrapper">
          
          <div class="column-left">
            <div class="photo-frame">
              <img id="siswa-foto" src="" alt="Foto Profil Siswa">

            <div class="absen-label" id="siswa-absen-box">

              <button class="btn-music-toggle" onclick="toggleMusic()" id="music-btn" aria-label="Pause Musik">

                <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
              </div>
            </div>
          </div>

          <div class="column-center">
            <div class="spotlight-container"></div>
            
            <div class="brand-header">
              <div class="logo-wrapper">
                <img class="school-logo" src="https://github.com/masrahmat-id/absensi-barcode-online-smp-smk-azzahro/raw/main/logo-smp-azzahro.png" alt="Logo SMP Islam Az-Zahro">
                <img class="logo-ppss" src="https://azzahrolocare.github.io/media/logo/PPSS-Az-Zahro.png" alt="Logo PPSS Az-Zahro">
              </div>
              <header class="header-title">SELAMAT & SUKSES</header>
            </div>
            
            <div class="identity-box">
              <div class="name-container" id="cont-nama">
                <h1 id="siswa-nama">-</h1>

              <div class="ttl-container" id="cont-ttl">

              <div class="ortu-container" id="cont-ortu">
                <div class="sub-detail" id="siswa-ortu"></div>

              <div class="nis-container" id="cont-nis">
                <div class="nis-box" id="siswa-nis-box"></div>
              </div>

              <div class="wish-container" id="cont-wish">

            <footer class="footer-title">
              PURNAWIYATA KE-III<br>
              <span>SMP ISLAM AZ-ZAHRO</span><br>
              <small style="font-size: 1.1rem; letter-spacing: 1px; color: #e0e0e0; font-weight: 500; display: inline-block; margin-top: 4px;">Tahun Pelajaran 2025/2026</small>
            </footer>
          </div>

          <div class="column-right" id="column-cc">

            <div class="image-reveal-wrapper">
              <img id="foto-citacita-bw" class="img-base-bw" src="" alt="Cita-cita Hitam Putih">

          </div>

        </div>
      </div>

      <div class="nav-container">
        <button class="btn-nav-arrow" onclick="prevStudent()" aria-label="Siswa Sebelumnya">❮</button>
        <button class="btn-nav-arrow" onclick="nextStudent()" aria-label="Siswa Selanjutnya">❯</button>
      </div>
    </main>
  </div>

  <script>
    const video = document.getElementById('video-bg');
    const startInterface = document.getElementById('start-interface');
    const overlayDark = document.getElementById('overlay-dark');
    const btnSkip = document.getElementById('btn-skip');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const openingContainer = document.getElementById('opening-container');
    const mainGalleryContent = document.getElementById('main-gallery-content');

    let studentsData = [];
    let currentIndex = 0;
    let fadeTimeouts = []; 
    const bgMusic = document.getElementById('bg-music');
    
    let audioCtx, analyser, bufferLength, dataArray;
    let visualizerAnimationId;

    let particlesArray = [];
    let ccParticlesInterval;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * -0.8 - 0.2; 
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37';
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      resizeCanvas();
      particlesArray = [];
      for (let i = 0; i < 25; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    function mulaiVideoSinematik() {
      startInterface.style.display = 'none';
      video.style.display = 'block';
      overlayDark.style.display = 'block';
      btnSkip.style.display = 'flex'; 
      canvas.style.display = 'block';
      
      initParticles();
      animateParticles();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      }

      video.muted = false; 
      video.play().catch(error => {
        console.log("Gagal memutar video: ", error);
        menujuGaleriUtama();
      });

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      } catch(e) { console.log(e); }
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function menujuGaleriUtama() {
      video.pause();
      openingContainer.style.display = 'none';
      mainGalleryContent.style.display = 'flex';

      createGlobalParticles();
      loadStudentsData();
      initVisualizer();

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      bgMusic.play().catch(error => {
        console.log("Musik ditahan browser policy.", error);
      });
    }

    function padZero(num) {
      return num < 10 ? '0' + num : num;
    }

    function sequentialFadeIn(containers) {
      containers.forEach((item) => {
        let timer = setTimeout(() => {
          item.el.classList.add('fade-in-visible');
          if (item.callback) item.callback();
        }, item.delay);
        fadeTimeouts.push(timer);
      });
    }

    function createGlobalParticles() {
      const particleCount = 8; 
      for (let i = 0; i < particleCount; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        let size = Math.random() * 4 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + 'vw';
        let duration = Math.random() * 8 + 8;
        particle.style.animationDuration = duration + 's';
        let delay = Math.random() * 4;
        particle.style.animationDelay = delay + 's';
        document.body.appendChild(particle);
      }
    }

    function startCcParticles() {
      const container = document.getElementById('cc-particles-container');
      
      if (ccParticlesInterval) clearInterval(ccParticlesInterval);
      
      ccParticlesInterval = setInterval(() => {
        const particle = document.createElement('div');
        particle.className = 'cc-particle';
        const size = Math.random() * 5 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = '100%';
        const duration = Math.random() * 3 + 2;
        particle.style.animationDuration = duration + 's';
        container.appendChild(particle);
        setTimeout(() => {
          particle.remove();
        }, duration * 1000);
        
      }, 150);
    }

    function stopCcParticles() {
      if (ccParticlesInterval) clearInterval(ccParticlesInterval);
      const container = document.getElementById('cc-particles-container');
      container.innerHTML = '';
    }

    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);
        }
      } catch (error) {
        console.error("Gagal memuat berkas data-siswa.json:", error);
      }
    }

    function renderStudent(index) {
      fadeTimeouts.forEach(clearTimeout);
      fadeTimeouts = [];
      
      stopCcParticles();

      const card = document.getElementById('student-card');
      const student = studentsData[index];
      
      const cNama = document.getElementById('cont-nama');
      const cTtl = document.getElementById('cont-ttl');
      const cOrtu = document.getElementById('cont-ortu');
      const cNis = document.getElementById('cont-nis');
      const cWish = document.getElementById('cont-wish');

      const elNama = document.getElementById('siswa-nama');
      const elTtl = document.getElementById('siswa-ttl');
      const elOrtu = document.getElementById('siswa-ortu');
      const elNisBox = document.getElementById('siswa-nis-box');
      const elCitaCita = document.getElementById('siswa-citacita');
      
      const elNumAbsen = document.getElementById('num-absen');
      const elTotalAbsen = document.getElementById('total-absen');

      const fotoElement = document.getElementById('siswa-foto');
      const fotoBw = document.getElementById('foto-citacita-bw');
      const fotoColor = document.getElementById('foto-citacita-color');
      const ccContainer = document.getElementById('column-cc');

      card.classList.remove('active');
      ccContainer.classList.remove('reveal-active');
      
      cNama.classList.remove('fade-in-visible');
      cTtl.classList.remove('fade-in-visible');
      cOrtu.classList.remove('fade-in-visible');
      cNis.classList.remove('fade-in-visible');
      cWish.classList.remove('fade-in-visible');

      void card.offsetWidth; 
      card.classList.add('active');

      elNumAbsen.innerText = padZero(index + 1);
      elTotalAbsen.innerText = padZero(studentsData.length);

      elNama.textContent = student.nama;
      elTtl.textContent = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      elOrtu.textContent = `${hubunganOrtu} ${student.orang_tua}`;
      elNisBox.textContent = `NIS: ${student.nis} | NISN: ${student.nisn}`;
      elCitaCita.innerText = student.cita_cita || "-";

      fotoElement.style.opacity = '0';
      fotoElement.src = student.foto_profil_url;
      fotoElement.onload = () => fotoElement.style.opacity = '1';

      fotoBw.style.opacity = '0';
      const finalCCUrl = student.foto_cita_cita_url || student.foto_profil_url;
      
      fotoBw.src = finalCCUrl;
      fotoColor.src = finalCCUrl;
      fotoBw.onload = () => { fotoBw.style.opacity = '1'; };

      sequentialFadeIn([
        { el: cNama, delay: 100 },
        { el: cTtl, delay: 250 },
        { el: cOrtu, delay: 400 },
        { el: cNis, delay: 550 },
        { 
          el: cWish, 
          delay: 700, 
          callback: () => {
            ccContainer.classList.add('reveal-active');
            startCcParticles();
          }
        }
      ]);
    }

    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      if (!bgMusic.paused) { bgMusic.currentTime = 0; }
      renderStudent(currentIndex);
    }

    function prevStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex - 1 + studentsData.length) % studentsData.length;
      if (!bgMusic.paused) { bgMusic.currentTime = 0; }
      renderStudent(currentIndex);
    }

    function initVisualizer() {
      if (audioCtx && analyser) return; 
      if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      analyser = audioCtx.createAnalyser();
      
      const source = audioCtx.createMediaElementSource(bgMusic);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      
      analyser.fftSize = 64; 
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      
      animateVisualizer();
    }

    function animateVisualizer() {
      visualizerAnimationId = requestAnimationFrame(animateVisualizer);
      const bars = document.querySelectorAll('.visualizer-bar');
      
      if (bgMusic.paused) {
        bars.forEach(bar => { bar.style.height = '3px'; });
        return;
      }
      
      analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < bars.length; i++) {
        let dataIndex = Math.floor(i * (bufferLength / bars.length));
        let value = dataArray[dataIndex];
        let percent = value / 255;
        let height = (percent * 20) + 3; 
        bars[i].style.height = height + 'px';
      }
    }

    function toggleMusic() {
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const musicBtn = document.getElementById('music-btn');
      
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          musicBtn.setAttribute('aria-label', 'Pause Musik');
        }).catch(error => console.log("Gagal memutar musik:", error));
      } else {
        bgMusic.pause();
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        musicBtn.setAttribute('aria-label', 'Putar Musik');
      }
    }

    window.addEventListener('keydown', (event) => {
      if (openingContainer.style.display !== 'none') {
        if (startInterface.style.display === 'none') {
          switch(event.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case 'PageDown':
            case 'Enter': 
              menujuGaleriUtama();
              break;
          }
        }
      } 
      else if (mainGalleryContent.style.display === 'flex') {
        switch(event.key) {
          case 'ArrowRight':
          case 'PageDown':
            nextStudent();
            break;
          case 'ArrowLeft':
          case 'PageUp':
            prevStudent();
            break;
        }
      }
    });
  </script>
</body>
</html>
