    /* ==========================================================================
       STYLE / CSS (Tema Luxury Gold, 3-Column Layout & Ukuran Super Jumbo)
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c08; 
      background: linear-gradient(to right, #2b1f0d, #0f0c08, #2b1f0d);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 15px;
    }

    /* Efek Partikel Latar Belakang Utama */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212,175,55,0.8) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
      z-index: 1;
    }

    @keyframes floatParticles {
      0% {
        transform: translateY(100vh) translateX(0) scale(0.5);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-10vh) translateX(100px) scale(1.2);
        opacity: 0;
      }
    }

    /* Bingkai Utama Aplikasi (Super Jumbo & Megah) */
    .presentation-container {
      width: 100%;
      max-width: 1500px;
      height: 850px;
      background: rgba(25, 20, 15, 0.85);
      border: 3px solid #d4af37;
      border-radius: 30px;
      box-shadow: 0 0 80px rgba(212, 175, 55, 0.25), inset 0 0 40px rgba(0,0,0,0.9);
      display: flex;
      flex-col: row;
      position: relative;
      z-index: 5;
      overflow: hidden;
      backdrop-filter: blur(15px);
      padding: 35px;
    }

    /* Ornamen Sudut Klasik Khas Piagam Kemegahan */
    .corner-ornament {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 4px solid #d4af37;
      z-index: 10;
      pointer-events: none;
    }
    .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
    .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
    .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
    .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

    /* Layout 3 Kolom Utama */
    .left-column {
      width: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .center-column {
      width: 40%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      border-left: 1px dashed rgba(212, 175, 55, 0.2);
      border-right: 1px dashed rgba(212, 175, 55, 0.2);
    }

    .right-column {
      width: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ==========================================================================
       KOMPONEN FOTO KIRI (FOTO PROFIL / UTAMA)
       ========================================================================== */
    .photo-frame-container {
      position: relative;
      width: 360px;
      height: 480px;
      perspective: 1000px;
    }

    .photo-frame {
      width: 100%;
      height: 100%;
      background: #15110b;
      border: 6px double #d4af37;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      transition: all 0.5s ease;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-cover: cover;
      border-radius: 10px;
      filter: grayscale(100%) contrast(110%);
      transition: filter 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Saat pengetikan selesai (.reveal-active), foto profil menjadi berwarna secara instan */
    .reveal-active .photo-frame img {
      filter: grayscale(0%) contrast(100%);
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.7));
      pointer-events: none;
    }

    /* Badge Label di Bawah Frame Foto */
    .photo-label {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #b8860b, #e6ca65, #996515);
      color: #000;
      padding: 8px 30px;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      white-space: nowrap;
      border: 1px solid #fff;
    }

    /* ==========================================================================
       KOMPONEN TENGAH (IDENTITAS DATA TEKS)
       ========================================================================== */
    .school-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .school-header h3 {
      color: #e6ca65;
      font-size: 16px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 5px;
      font-weight: 400;
    }

    .school-header h2 {
      color: #fff;
      font-size: 26px;
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .school-header .divider {
      width: 180px;
      height: 2px;
      background: linear-gradient(to right, transparent, #d4af37, transparent);
      margin: 12px auto 0 auto;
    }

    /* Wadah Penulisan Teks Otomatis */
    .data-display-box {
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      margin: 30px 0;
    }

    .data-row {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .data-label {
      color: #8c8273;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .data-value {
      color: #fff;
      font-size: 22px;
      font-weight: 500;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    /* Mode Ketik Khusus Nama Siswa */
    .data-value.student-name {
      color: #e6ca65;
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(22a,202,101,0.2);
      line-height: 1.2;
    }

    /* Tampilan Label Kecil untuk Data Angka Terbawah */
    .nis-nisn-box {
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.15);
      padding: 10px 20px;
      border-radius: 12px;
      color: #d4af37;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      min-height: 46px;
    }

    /* Kursor Ketik Berkedip */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 24px;
      background-color: #d4af37;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    .student-name .cursor {
      height: 34px;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Tombol Navigasi Footer Kontrol */
    .control-panel {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(0,0,0,0.4);
      padding: 8px 25px;
      border-radius: 40px;
      border: 1px solid rgba(212,175,55,0.2);
    }

    .nav-btn {
      background: none;
      border: none;
      color: #8c8273;
      font-size: 20px;
      cursor: pointer;
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      transition: all 0.3s;
    }

    .nav-btn:hover {
      background: #d4af37;
      color: #000;
      box-shadow: 0 0 15px rgba(212,175,55,0.5);
    }

    .counter-display {
      color: #e6ca65;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      min-width: 80px;
      text-align: center;
    }

    /* ==========================================================================
       KOMPONEN FOTO KANAN (FOTO IMPRESI CITA-CITA)
       ========================================================================== */
    .wish-container {
      width: 360px;
      height: 480px;
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Ketika Teks Selesai Diketik, Bagian Kanan Memudar Masuk Secara Halus */
    .wish-container.fade-in-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .wish-frame {
      width: 100%;
      height: 100%;
      background: #15110b;
      border: 6px double #d4af37;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .wish-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Efek Berkilau Mewah Terkunci pada Frame Cita-Cita */
    .wish-frame::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      animation: sweepGlance 4s infinite linear;
    }

    @keyframes sweepGlance {
      0% { transform: translate(-30%, -30%) rotate(45deg); }
      100% { transform: translate(30%, 30%) rotate(45deg); }
    }

    /* Wadah Efek Ledakan Partkel Magis Internal */
    .magical-particles-spark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
      border-radius: 20px;
    }

    .sparkle-dot {
      position: absolute;
      background: radial-gradient(circle, #fff 0%, rgba(230,202,101,0.8) 40%, transparent 100%);
      border-radius: 50%;
      opacity: 0;
    }

    .show-particles .sparkle-dot {
      animation: sparkUpward 2.5s infinite ease-out;
    }

    @keyframes sparkUpward {
      0% { transform: translateY(110%) translateX(0) scale(0.3); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10%) translateX(var(--custom-x, 40px)) scale(0); opacity: 0; }
    }

    /* ==========================================================================
       LAYAR OVERLAY PEMBUKA (START PRESENTATION)
       ========================================================================== */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: #090705;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .intro-title {

      font-family: 'Georgia', serif;
      font-size: 40px;
      text-align: center;
      letter-spacing: 3px;
      line-height: 1.5;
      text-shadow: 0 0 20px rgba(212,175,55,0.3);
    }

    .start-btn {

      color: #000;
      padding: 15px 50px;
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
      border: 2px solid #fff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(212,175,55,0.3);
      transition: all 0.3s;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 40px rgba(212,175,55,0.5);
    }

    // 3. Efek Pengetikan Mesin Tik (Typewriter Effect Engine)
    function clearAllTimers() {
      typingTimers.forEach(t => clearTimeout(t));
      typingTimers = [];
    }

    function typeEffect(element, text, speed, callback) {
      let i = 0;
      element.innerHTML = '';
      
      let cursorSpan = document.createElement('span');
      cursorSpan.classList.add('cursor');
      element.appendChild(cursorSpan);

      function typing() {
        if (i < text.length) {
          cursorSpan.insertAdjacentText('beforebegin', text.charAt(i));
          i++;
          let timer = setTimeout(typing, speed);
          typingTimers.push(timer);
        } else {
          cursorSpan.remove();
          if (callback) callback();
        }
      }
      typing();
    }

    // 4. Render Utama Identitas Siswa Berdasarkan Index Aktif
    function renderStudent(index) {
      clearAllTimers();
      createSparkles();

      // Reset Animasi Kontainer Visual Samping
      ccContainer.classList.remove('reveal-active');
      elWishBox.classList.remove('fade-in-visible');
      ccContainer.classList.remove('show-particles');

      const data = studentsData[index];

      // Update Teks Counter Halaman bawah
      textCounter.innerText = `${index + 1} / ${studentsData.length}`;

      // Memuat Media Foto Terkait Dari Properti JSON (foto_profil_url & foto_cita_cita_url)
      imgProfil.src = data.foto_profil_url || "";
      imgCitaCita.src = data.foto_cita_cita_url || "";
      
      // Bersihkan Nilai Box Teks Lama
      elNama.innerHTML = '';
      elTtl.innerHTML = '';
      elOrtu.innerHTML = '';
      elNisBox.innerHTML = '';
      elCitaCita.innerText = data.cita_cita || "Cita-Cita";

      // Komponen String Data
      let textNama = data.nama || "";
      let textTtl = `${data.tempat_lahir || ""}, ${data.tanggal_lahir || ""}`;
      let textOrtu = data.orang_tua || "";
      let textNisNisn = `NIS: ${data.nis || "-"}  |  NISN: ${data.nisn || "-"}`;

      // Memulai Sekuensial Pengetikan Berantai Elemen
      // 1. Ketik Nama Lengkap
      typeEffect(elNama, textNama, 40, () => {
        
        // 2. Ketik TTL
        typeEffect(elTtl, textTtl, 30, () => {
          
          // 3. Ketik Hubungan Orang Tua
          typeEffect(elOrtu, textOrtu, 30, () => {
            
            // 4. Ketik Label NIS & NISN
            let nisSpan = document.createElement('span');
            elNisBox.appendChild(nisSpan);
            
            typeEffect(nisSpan, textNisNisn, 25, () => {
              
              // 5. SELESAI KETIK: Langsung aktifkan foto berwarna & kotak cita-cita (Instan)
              ccContainer.classList.add('reveal-active');
              elWishBox.classList.add('fade-in-visible');
              ccContainer.classList.add('show-particles');
              
            });
          });
        });
      });
    }

    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      renderStudent(currentIndex);
    }

    function prevStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex - 1 + studentsData.length) % studentsData.length;
      renderStudent(currentIndex);
    }

    function startPresentation() {
      overlay.style.display = 'none';
      bgMusic.play().catch(error => console.log("Musik tertahan browser:", error));
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStudentsData();
      createBackgroundParticles();
    });
