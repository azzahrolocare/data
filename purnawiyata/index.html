<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cita-Cita Siswa Az-Zahro</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-light: #f6e05e;
      --gold-main: #d4af37;
      --gold-dark: #aa8416;
      --bg-dark: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.75);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.07) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.8) 0px, transparent 50%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .font-cinzel { font-family: 'Cinzel Decorative', serif; }
    .font-vibes { font-family: 'Great Vibes', cursive; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-main); }

    /* Efek Kaca Premium */
    .glassmorphism {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    /* Efek Teks Emas Menyala */
    .text-glow-gold {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.6), 0 0 20px rgba(212, 175, 55, 0.3);
    }

    /* Bingkai Foto Elegan */
    .photo-frame {
      position: relative;
      border: 2px solid var(--gold-main);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }
    .photo-frame::before {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      pointer-events: none;
    }

    /* Kursor Ketik Berkedip */
    .typing-cursor::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: var(--gold-main);
      margin-left: 2px;
      font-weight: bold;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Animasi Kartu Transisi Keluar Masuk */
    .student-card-animated {
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .student-card-animated.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* KUNCI UTAMA: Mekanisme Transisi Tirai Foto Berwarna (Reveal Naik dari Bawah) */
    .cc-image-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* Lapisan Dasar: Murni Hitam-Putih */
    .img-bw {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
      display: block;
    }

    /* Lapisan Atas: Tirai Berwarna yang akan digulung naik */
    .reveal-color-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%; /* Mulai dari bawah (kosong/tidak terlihat) */
      overflow: hidden;
      transition: height 3.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .img-color {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(120%) contrast(105%);
    }

    /* Aktifkan gulungan ke atas ketika pengetikan teks selesai */
    .reveal-active .reveal-color-layer {
      height: 100%;
    }

    /* Pembungkas Box Impian & Efek Pudar Ringan */
    .wish-box-animation {
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease-out;
    }
    .wish-box-animation.fade-in-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Animasi Partikel Debu Emas */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255,223,128,1) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(20px) scale(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
    }

    .show-particles .particle {
      animation: floatUp 3s infinite ease-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-100 p-4 md:p-6 select-none">

  <!-- HEADER UTAMA -->
  <header class="text-center mb-6">
    <h1 class="font-cinzel text-xl md:text-3xl tracking-widest text-glow-gold font-bold text-amber-400">
      ALBUM IMPIAN & CITA-CITA
    </h1>
    <p class="text-xs md:text-sm text-slate-400 tracking-wider mt-1 uppercase">
      Generasi Rabbani, Cerdas, dan Berintegritas — SMP/SMK Az-Zahro
    </p>
    <div class="w-24 h-[2px] bg-gradient-to-r from-transparent via-amber-500 to-transparent mx-auto mt-2"></div>
  </header>

  <!-- KONTEN UTAMA: PANGGUNG PRESENTASI -->
  <main class="flex-grow flex items-center justify-center max-w-7xl w-full mx-auto my-auto px-2">
    <div id="student-card" class="student-card-animated glassmorphism w-full rounded-2xl p-6 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative overflow-hidden">
      
      <!-- KOLOM KIRI: FOTO UTAMA SISWA (BIASA) -->
      <div class="lg:col-span-3 flex flex-col items-center justify-center">
        <div class="photo-frame w-48 h-64 md:w-56 md:h-72 rounded-lg overflow-hidden bg-slate-900 flex items-center justify-center">
          <img id="siswa-foto" src="" alt="Foto Resmi" class="w-full h-full object-cover transition-opacity duration-300">
        </div>
        <span class="text-[11px] text-amber-500/70 uppercase tracking-widest mt-3 font-semibold">
          <i class="fa-solid class-icon fa-user-graduation mr-1"></i> Data Profil Resmi
        </span>
      </div>

      <!-- KOLOM TENGAH: BIODATA PENGETIKAN OTOMATIS -->
      <div class="lg:col-span-5 flex flex-col justify-center space-y-4 min-h-[220px] lg:border-l lg:border-r border-slate-700/40 lg:px-8">
        <div>
          <h2 id="siswa-nama" class="text-2xl md:text-3xl font-bold text-amber-400 tracking-wide min-h-[40px]"></h2>
          <div id="siswa-nis-box" class="text-xs font-mono text-slate-400 mt-1 min-h-[18px]"></div>
        </div>

        <div class="w-full h-[1px] bg-gradient-to-r from-amber-500/30 via-transparent to-transparent"></div>

        <div class="space-y-2">
          <div class="flex items-start space-x-3 text-sm">
            <span class="text-amber-500 mt-1 w-4 text-center"><i class="fa-solid fa-cake-candles"></i></span>
            <div class="flex-1">
              <span class="text-slate-500 block text-[11px] uppercase tracking-wider">Tempat, Tanggal Lahir</span>
              <p id="siswa-ttl" class="text-slate-200 font-medium min-h-[20px]"></p>
            </div>
          </div>

          <div class="flex items-start space-x-3 text-sm">
            <span class="text-amber-500 mt-1 w-4 text-center"><i class="fa-solid fa-hands-holding-child"></i></span>
            <div class="flex-1">
              <span class="text-slate-500 block text-[11px] uppercase tracking-wider">Hubungan Keluarga</span>
              <p id="siswa-ortu" class="text-slate-200 font-medium min-h-[20px]"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- KOLOM KANAN: VISUALISASI CITA-CITA DENGAN REVEAL BERWARNA -->
      <div id="column-cc" class="lg:col-span-4 flex flex-col items-center justify-center relative">
        
        <!-- Wadah Partikel Debu Emas -->
        <div class="particle" style="left:15%; bottom:10%; animation-delay:0s; width:6px; height:6px;"></div>
        <div class="particle" style="left:45%; bottom:15%; animation-delay:0.7s; width:8px; height:8px;"></div>
        <div class="particle" style="left:75%; bottom:8%; animation-delay:1.4s; width:5px; height:5px;"></div>
        <div class="particle" style="left:30%; bottom:25%; animation-delay:2.1s; width:7px; height:7px;"></div>
        
        <!-- Frame Khusus Cita-Cita -->
        <div class="photo-frame w-48 h-64 md:w-56 md:h-72 rounded-lg overflow-hidden bg-slate-900">
          <div class="cc-image-wrapper">
            <!-- Lapisan 1: Hitam Putih -->
            <img id="foto-citacita-bw" src="" alt="Cita-cita BW" class="img-bw">
            
            <!-- Lapisan 2: Menggulung Naik Berwarna -->
            <div class="reveal-color-layer">
              <img id="foto-citacita-color" src="" alt="Cita-cita Color" class="img-color">
            </div>
          </div>
        </div>

        <!-- Box Teks Impian yang Menyembul Muncul di Akhir -->
        <div id="siswa-wish-box" class="wish-box-animation w-full max-w-[240px] bg-gradient-to-b from-amber-500/10 to-amber-600/20 border border-amber-500/30 rounded-xl px-4 py-2 mt-4 text-center shadow-lg shadow-amber-950/20">
          <span class="text-[10px] text-amber-400 font-bold uppercase tracking-widest block mb-0.5">Manifestasi Impian</span>
          <p id="siswa-citacita" class="font-vibes text-2xl text-amber-200 tracking-wide"></p>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER & NAVIGASI KONTROL -->
  <footer class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 max-w-7xl w-full mx-auto border-t border-slate-800/60 pt-4 px-2">
    <!-- Informasi Indikator Angka -->
    <div class="text-xs text-slate-400 font-mono">
      <span class="text-amber-500"><i class="fa-solid fa-layer-group mr-1"></i> Data Terbuka:</span> 
      <span id="current-index-view">0</span> / <span id="total-index-view">0</span> Siswa
    </div>

    <!-- Panel Tombol Navigasi Kebanggaan -->
    <div class="flex items-center space-x-3">
      <button onclick="prevStudent()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 hover:border-amber-500/40 transition duration-300 text-sm font-medium flex items-center space-x-2">
        <i class="fa-solid fa-chevron-left text-xs text-amber-500"></i> <span>Sebelumnya</span>
      </button>
      
      <button onclick="toggleAutoPlay()" id="btn-autoplay" class="px-5 py-2 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 font-semibold transition duration-300 text-sm flex items-center space-x-2 shadow-lg shadow-amber-950/10">
        <i class="fa-solid fa-play text-xs"></i> <span>Putar Otomatis</span>
      </button>

      <button onclick="nextStudent()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 hover:border-amber-500/40 transition duration-300 text-sm font-medium flex items-center space-x-2">
        <span>Selanjutnya</span> <i class="fa-solid fa-chevron-right text-xs text-amber-500"></i>
      </button>
    </div>
  </footer>

  <!-- SISTEM ENGINE LOGIC & DATA INTAKE -->
  <script>
    // 1. DATA MASTER INDUK SISWA (Integrasi Penuh Lapisan Spreadsheet)
    const studentsData = [
      {
        nama: "MUHAMMAD ALIF RIZKY",
        nis: "24250101",
        nisn: "0109283746",
        tempat_lahir: "Bondowoso",
        tanggal_lahir: "12 Januari 2011",
        jk: "L",
        orang_tua: "Ahmad Mujani",
        cita_cita: "Perwira TNI-AD",
        foto_url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80",
        foto_citacita_url: "https://images.unsplash.com/photo-1590552515252-3a5a1bce7bed?auto=format&fit=crop&w=500&q=80"
      },
      {
        nama: "SITI NUR HALIZAH",
        nis: "24250102",
        nisn: "0112345678",
        tempat_lahir: "Situbondo",
        tanggal_lahir: "24 Agustus 2011",
        jk: "P",
        orang_tua: "Abdur Rahman",
        cita_cita: "Dokter Spesialis Anak",
        foto_url: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=80",
        foto_citacita_url: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=500&q=80"
      },
      {
        nama: "FATHUR RAHMAN HAKIM",
        nis: "24250103",
        nisn: "0105566778",
        tempat_lahir: "Bondowoso",
        tanggal_lahir: "05 Mei 2010",
        jk: "L",
        orang_tua: "Imron Rosyadi",
        cita_cita: "Arsitek Rabbani",
        foto_url: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=500&q=80",
        foto_citacita_url: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=500&q=80"
      }
    ];

    // 2. STATE MANAGEMENT & TIMING CONSTANTS
    let currentIndex = 0;
    let autoPlayInterval = null;
    const playDelayDuration = 12000; // Durasi jeda tayang per siswa (12 detik)
    let typingTimeouts = []; // Koleksi ID timeout pengetikan agar bisa dibersihkan total

    // Preload Gambar agar Transisi Mulus Tanpa Menunggu Loading Internet Saat Berpindah
    function preloadImages() {
      studentsData.forEach(student => {
        if(student.foto_url) { const img1 = new Image(); img1.src = student.foto_url; }
        if(student.foto_citacita_url) { const img2 = new Image(); img2.src = student.foto_citacita_url; }
      });
    }

    // 3. FUNGSI UTAMA: ENGINE RENDERING KARTU DATA SISWA
    function renderStudent(index) {
      // Hentikan seluruh proses pengetikan siswa sebelumnya jika ada yang sedang berjalan
      typingTimeouts.forEach(clearTimeout);
      typingTimeouts = [];

      const card = document.getElementById('student-card');
      const student = studentsData[index];
      
      const elNama = document.getElementById('siswa-nama');
      const elTtl = document.getElementById('siswa-ttl');
      const elOrtu = document.getElementById('siswa-ortu');
      const elNisBox = document.getElementById('siswa-nis-box');
      const elWishBox = document.getElementById('siswa-wish-box');
      const elCitaCita = document.getElementById('siswa-citacita');
      
      const fotoElement = document.getElementById('siswa-foto');
      const fotoBw = document.getElementById('foto-citacita-bw');
      const fotoColor = document.getElementById('foto-citacita-color');
      const ccContainer = document.getElementById('column-cc');

      // RESET ANIMASI & HILANGKAN STATUS PEWARNAAN BERJALAN
      card.classList.remove('active');
      ccContainer.classList.remove('reveal-active', 'show-particles');
      elWishBox.classList.remove('fade-in-visible');
      void card.offsetWidth; // Trigger reflow browser agar animasi reset berjalan instan
      card.classList.add('active');

      // === PERBAIKAN UTAMA: Sembunyikan & Kosongkan Foto Lama Terlebih Dahulu ===
      fotoElement.src = "";
      fotoBw.src = "";
      fotoColor.src = "";
      // ========================================================================

      // Bersihkan teks kontainer agar proses ketik dimulai murni dari kosong
      elNama.innerText = "";
      elTtl.innerText = "";
      elOrtu.innerText = "";
      elNisBox.innerHTML = "";
      elCitaCita.innerText = student.cita_cita || "-";

      // Komposisi Rangkaian String Data Masukan
      const textNama = student.nama;
      const textTtl = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      const textOrtu = `${hubunganOrtu} ${student.orang_tua}`;
      const textNisNisn = `NIS: ${student.nis} | NISN: ${student.nisn}`;

      // Perbarui Indikator Counter Angka Halaman di Bagian Bawah
      document.getElementById('current-index-view').innerText = index + 1;

      // MASUKKAN URL BARU (Karena sudah di-preload, ini akan langsung muncul seketika)
      fotoElement.src = student.foto_url;

      const finalCCUrl = student.foto_citacita_url || student.foto_url;
      fotoBw.src = finalCCUrl;
      fotoColor.src = finalCCUrl;

      // ==========================================
      // ALUR EKSEKUSI PENGETIKAN BERANTAI (CHAIN)
      // ==========================================
      
      // 1. Mulai Ketik Nama Siswa
      typeEffect(elNama, textNama, 40, () => {
        
        // 2. Setelah nama selesai, Ketik Data TTL
        typeEffect(elTtl, textTtl, 30, () => {
          
          // 3. Setelah TTL selesai, Ketik Hubungan Orang Tua
          typeEffect(elOrtu, textOrtu, 30, () => {
            
            // 4. Setelah Orang Tua selesai, Buat Elemen & Ketik Label NIS & NISN
            let nisSpan = document.createElement('span');
            elNisBox.appendChild(nisSpan);
            
            typeEffect(nisSpan, textNisNisn, 25, () => {
              
              // 5. SELESAI SELURUH TEKS KETIK: Lapisan berwarna memudar naik menggantikan hitam-putih
              ccContainer.classList.add('reveal-active'); 
              
              // Munculkan box deskripsi cita-cita beserta gugusan partikel debu emas
              setTimeout(() => {
                elWishBox.classList.add('fade-in-visible');
                ccContainer.classList.add('show-particles');
              }, 300);
              
            });
          });
        });
      });
    }

    // 4. ENGINE ASINKRONUS: EFEK MESIN KETIK PREMIUM
    function typeEffect(element, text, speed, callback) {
      let i = 0;
      element.classList.add('typing-cursor');
      
      function type() {
        if (i < text.length) {
          element.innerText += text.charAt(i);
          i++;
          let timeoutId = setTimeout(type, speed);
          typingTimeouts.push(timeoutId);
        } else {
          element.classList.remove('typing-cursor');
          if (callback) callback();
        }
      }
      type();
    }

    // 5. NAVIGASI KONTROL MANUAL INTERAKTIF
    function nextStudent() {
      currentIndex = (currentIndex + 1) % studentsData.length;
      renderStudent(currentIndex);
      resetAutoPlayTimer();
    }

    function prevStudent() {
      currentIndex = (currentIndex - 1 + studentsData.length) % studentsData.length;
      renderStudent(currentIndex);
      resetAutoPlayTimer();
    }

    // 6. ENGINE OTOMATISASI PRESENTASI (AUTOPLAY)
    function toggleAutoPlay() {
      const btn = document.getElementById('btn-autoplay');
      if (autoPlayInterval) {
        // Matikan Autoplay
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        btn.innerHTML = '<i class="fa-solid fa-play text-xs"></i> <span>Putar Otomatis</span>';
        btn.classList.replace('bg-emerald-500/10', 'bg-amber-500/10');
        btn.classList.replace('text-emerald-400', 'text-amber-400');
        btn.classList.replace('border-emerald-500/30', 'border-amber-500/30');
      } else {
        // Nyalakan Autoplay
        btn.innerHTML = '<i class="fa-solid fa-pause text-xs"></i> <span>Jeda Tayang</span>';
        btn.classList.replace('bg-amber-500/10', 'bg-emerald-500/10');
        btn.classList.replace('text-amber-400', 'text-emerald-400');
        btn.classList.replace('border-amber-500/30', 'border-emerald-500/30');
        
        autoPlayInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % studentsData.length;
          renderStudent(currentIndex);
        }, playDelayDuration);
      }
    }

    function resetAutoPlayTimer() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % studentsData.length;
          renderStudent(currentIndex);
        }, playDelayDuration);
      }
    }

    // 7. INISIALISASI AWAL SAAT HALAMAN DIBUKA
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('total-index-view').innerText = studentsData.length;
      preloadImages();
      renderStudent(currentIndex);
    });
  </script>

</body>
</html>
