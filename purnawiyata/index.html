<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purnawiyata III SMP Islam Az-Zahro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            overflow-x: hidden;
        }
        .font-header {
            font-family: 'Montserrat', sans-serif;
        }
        /* Efek Kilau Emas (Gold Glitter Accent) */
        .gold-gradient-bg {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
        }
        .gold-text {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Animasi Masuk Konten */
        .animate-fade-in {
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-slide-right {
            animation: slideRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-slide-left {
            animation: slideLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-white p-4 md:p-8">

    <audio id="bgMusic" loop>
        <source src="musik-purnawiyata.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <button id="musicBtn" onclick="toggleMusic()" class="fixed top-4 right-4 z-50 bg-black/50 border border-yellow-500/50 p-3 rounded-full text-yellow-500 hover:bg-yellow-500 hover:text-black transition duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="musicIcon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
    </button>

    <header class="text-center md:text-left mb-6 max-w-7xl mx-auto w-full opacity-80 flex items-center justify-center md:justify-start gap-3">
        <div class="h-12 w-12 rounded-full gold-gradient-bg p-0.5">
            <div class="bg-black w-full h-full rounded-full flex items-center justify-center font-bold text-xs text-yellow-500">AZ</div>
        </div>
        <div>
            <h2 class="font-header font-bold text-sm tracking-wider gold-text">LEMBAGA PENDIDIKAN AZ-ZAHRO</h2>
            <p class="text-xs text-gray-400">Purnawiyata Digital System</p>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto bg-neutral-900/40 border border-neutral-800 rounded-2xl p-6 md:p-12 shadow-2xl backdrop-blur-md relative overflow-hidden my-auto">
        
        <div class="absolute -top-10 -left-10 w-40 h-40 gold-gradient-bg opacity-10 blur-2xl rounded-full"></div>
        <div class="absolute -bottom-10 -right-10 w-60 h-60 gold-gradient-bg opacity-10 blur-3xl rounded-full"></div>

        <div id="purnawiyata-container" class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            
            <div class="md:col-span-5 flex justify-center animate-slide-right">
                <div class="relative group">
                    <div class="absolute inset-0 gold-gradient-bg rounded-2xl rotate-3 scale-105 opacity-70 blur-sm group-hover:rotate-0 transition duration-500"></div>
                    <div class="relative bg-neutral-950 p-3 rounded-2xl border border-yellow-500/30">
                        <img id="siswa-foto" src="" alt="Foto Siswa" class="w-64 h-80 md:w-72 md:h-96 object-cover rounded-xl bg-neutral-800">
                    </div>
                </div>
            </div>

            <div class="md:col-span-7 text-center md:text-left space-y-6 id-card animate-slide-left">
                <div>
                    <h4 class="font-header font-extrabold text-2xl md:text-3xl tracking-widest text-white uppercase mb-1">SELAMAT & SUKSES</h4>
                    <div class="h-1 w-20 gold-gradient-bg mx-auto md:mx-0 rounded"></div>
                </div>

                <div class="space-y-2 py-4 border-y border-neutral-800/80">
                    <h1 id="siswa-nama" class="font-header font-black text-3xl md:text-5xl tracking-wide gold-text uppercase leading-tight">Mencari Data...</h1>
                    <p id="siswa-ttl" class="text-lg md:text-xl font-medium text-gray-300"></p>
                    <p id="siswa-ortu" class="text-base md:text-lg text-yellow-400 italic font-light"></p>
                </div>

                <div class="flex flex-wrap justify-center md:justify-start gap-4 text-xs font-mono text-gray-400">
                    <span class="bg-neutral-950/80 px-3 py-1.5 rounded-md border border-neutral-800">NIS: <span id="siswa-nis" class="text-white"></span></span>
                    <span class="bg-neutral-950/80 px-3 py-1.5 rounded-md border border-neutral-800">NISN: <span id="siswa-nisn" class="text-white"></span></span>
                </div>

                <div class="pt-2">
                    <p class="font-header font-bold text-sm tracking-widest text-gray-400 uppercase">PURNAWIYATA KE-III</p>
                    <p class="font-header font-black text-xl md:text-2xl tracking-wider text-white">SMP ISLAM AZ-ZAHRO</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full max-w-5xl mx-auto mt-6 flex justify-between items-center gap-4">
        <button onclick="prevSiswa()" class="px-6 py-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-sm font-semibold hover:bg-neutral-800 hover:border-yellow-500/50 transition duration-300 flex items-center gap-2">
            &larr; Sebelumnya
        </button>
        <span class="text-xs font-mono text-gray-500 bg-neutral-950 px-3 py-1 rounded-full border border-neutral-900">
            Siswa <span id="current-index" class="text-yellow-500 font-bold">0</span> dari <span id="total-siswa">0</span>
        </span>
        <button onclick="nextSiswa()" class="px-6 py-2.5 rounded-xl gold-gradient-bg text-black font-bold text-sm hover:opacity-90 shadow-lg shadow-yellow-600/10 transition duration-300 flex items-center gap-2">
            Selanjutnya &rarr;
        </button>
    </footer>

    <script>
        // Simulasi atau Target Data JSON Anda
        // Anda bisa meletakkan file ini secara eksternal dengan fetch('data.json')
        const dataSiswa = [
            {
                "nama": "DIANATUN HOLIDAH",
                "tempat_lahir": "Bondowoso",
                "tanggal_lahir": "09 Juni 2010",
                "nis": "23456",
                "nisn": "0102030405",
                "jk": "P",
                "orang_tua": "Yudi",
                "foto_url": "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=500" // Nanti ganti dengan URL Foto Asli / dari GitHub Anda
            },
            {
                "nama": "AHMAD SYARIFUDDIN",
                "tempat_lahir": "Bondowoso",
                "tanggal_lahir": "14 Agustus 2009",
                "nis": "23457",
                "nisn": "0098765432",
                "jk": "L",
                "orang_tua": "Sutrisno",
                "foto_url": "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=500"
            }
        ];

        let currentIndex = 0;
        const music = document.getElementById('bgMusic');
        let musicPlaying = false;

        // Fungsi Memuat Data ke Interface HTML
        function renderSiswa(index) {
            if (dataSiswa.length === 0) return;

            const siswa = dataSiswa[index];
            const container = document.getElementById('purnawiyata-container');
            
            // Trigger Reset Animasi dengan menghapus dan menambahkan class
            container.classList.remove('animate-fade-in');
            void container.offsetWidth; // Menghentikan sementara alur DOM (reflow) untuk restart animasi
            container.classList.add('animate-fade-in');

            // Set Data Teks
            document.getElementById('siswa-nama').innerText = siswa.nama;
            document.getElementById('siswa-ttl').innerText = `${siswa.tempat_lahir}, ${siswa.tanggal_lahir}`;
            document.getElementById('siswa-nis').innerText = siswa.nis;
            document.getElementById('siswa-nisn').innerText = siswa.nisn;
            document.getElementById('siswa-foto').src = siswa.foto_url;

            // Logika Jenis Kelamin (L/P)
            if (siswa.jk.toUpperCase() === 'P') {
                document.getElementById('siswa-ortu').innerText = `Putri dari Bpk. ${siswa.orang_tua}`;
            } else {
                document.getElementById('siswa-ortu').innerText = `Putra dari Bpk. ${siswa.orang_tua}`;
            }

            // Update Counter Halaman
            document.getElementById('current-index').innerText = index + 1;
            document.getElementById('total-siswa').innerText = dataSiswa.length;
        }

        // Navigasi Next & Previous
        function nextSiswa() {
            currentIndex = (currentIndex + 1) % dataSiswa.length;
            renderSiswa(currentIndex);
            autoPlayMusicOnInteraction();
        }

        function prevSiswa() {
            currentIndex = (currentIndex - 1 + dataSiswa.length) % dataSiswa.length;
            renderSiswa(currentIndex);
            autoPlayMusicOnInteraction();
        }

        // Logika Pengaturan Musik Latar Belakang
        function toggleMusic() {
            const icon = document.getElementById('musicIcon');
            if (musicPlaying) {
                music.pause();
                musicPlaying = false;
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />`;
            } else {
                music.play().catch(e => console.log("Izin audio browser dibutuhkan"));
                musicPlaying = true;
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.063.922-2.063 2.063v4.854c0 1.141.922 2.063 2.063 2.063h1.932l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM17.78 9.22a.75.75 0 10-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 001.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 101.06-1.06L20.56 12l1.72-1.72a.75.75 0 00-1.06-1.06l-1.72 1.72-1.72-1.72z" clip-rule="evenodd" /></svg>`;
            }
        }

        // Browser memblokir auto-play tanpa interaksi user, jadi kita aktifkan saat user klik tombol navigasi pertama kali
        function autoPlayMusicOnInteraction() {
            if (!musicPlaying) {
                toggleMusic();
            }
        }

        // Inisialisasi Pertama Kali Halaman Dibuka
        document.addEventListener("DOMContentLoaded", () => {
            renderSiswa(currentIndex);
        });
    </script>
</body>
</html>
