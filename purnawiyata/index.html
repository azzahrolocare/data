<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE / CSS (Tema Luxury Gold & Animasi Modern)
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c08; 
      background: linear-gradient(to right, #2b1f0d, #0f0c08, #2b1f0d);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Efek Partikel Latar Belakang */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212,175,55,0.8) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
    }

    @keyframes floatParticles {
      0% {
        transform: translateY(100vh) scale(0.3);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Overlay Interaksi Awal untuk Mengaktifkan Musik */
    #music-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .overlay-card {
      text-align: center;
      color: #fff;
      border: 2px solid #d4af37;
      padding: 40px;
      background: #1a150e;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .overlay-card h2 {
      color: #d4af37;
      margin-bottom: 10px;
    }
    .btn-start {
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.2s;
    }
    .btn-start:hover { transform: scale(1.05); }

    /* Kontainer Utama & Kartu Purnawiyata */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      z-index: 10;
    }

    /* KARTU UTAMA: Menggunakan pseudo-element untuk efek garis emas bergerak */
    .purnawiyata-card {
      display: flex;
      width: 100%;
      background: linear-gradient(135deg, #16120b 0%, #282012 50%, #16120b 100%);
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transform: translateY(30px);
    }

    /* Efek Garis Bercahaya & Bergerak Mengelilingi Kartu */
    .purnawiyata-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #d4af37, #f3e5ab, #d4af37);
      animation: borderRotate 6s linear infinite;
      z-index: 1;
    }

    /* Lapisan dalam agar konten tidak tertutup garis bergerak */
    .card-content-wrapper {
      display: flex;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
      margin: 3px;
      background: inherit;
      border-radius: 12px;
      overflow: hidden;
      z-index: 2;
      width: 100%;
    }

    @keyframes borderRotate {
      100% { transform: rotate(360deg); }
    }

    /* Bagian Kiri (Tempat Foto Profil) */
    .left-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #d4af37, #aa7c11, #f3e5ab);
      padding: 40px;
      position: relative;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
      z-index: 5;
    }

    .photo-frame {
      width: 100%;
      max-width: 250px;
      height: 350px;
      border: 5px solid #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
      background: #333;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    /* Efek Shadow Hitam & Emas Statis Menutupi Bagian Bawah Foto */
    .photo-frame::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 40%;
      background: linear-gradient(to top, rgba(15, 12, 8, 1) 0%, rgba(212, 175, 55, 0.4) 30%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    /* Bagian Kanan (Tempat Identitas & Foto Cita-cita Besar) */
    .right-side {
      flex: 1.5;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      position: relative; /* Diperlukan untuk penempatan absolute foto cita-cita */
      overflow: hidden;
    }

    /* TAG BARU: Foto Cita-Cita Besar Latar Belakang (Samar-samar) */
    #foto-citacita {
      position: absolute;
      top: 5%;
      right: -5%;
      width: 85%;
      height: 90%;
      object-fit: contain;
      opacity: 0; /* Diatur lewat JS dengan transisi halus */
      mix-blend-mode: screen; /* Membuat bagian gelap gambar menyatu dengan background kartu */
      filter: grayscale(30%) brightness(80%);
      pointer-events: none; /* Supaya tidak bisa diklik/mengganggu interaksi */
      z-index: 1; /* Di bawah teks, di atas background */
      transition: opacity 0.5s ease-in-out;
    }

    /* Memastikan teks berada di atas foto cita-cita besar */
    .header-title, .identity-box, .footer-title {
      position: relative;
      z-index: 2; 
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .identity-box {
      margin: 20px 0;
    }

    #siswa-nama {
      font-size: 2.3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 5px;
      display: inline-block;
    }

    #siswa-ttl {
      font-size: 1.2rem;
      color: #e0e0e0;
      font-weight: 500;
    }

    .sub-detail {
      font-size: 1.3rem;
      margin-top: 10px;
      font-style: italic;
      color: #f3e5ab;
    }

    .nis-box {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #b3b3b3;
    }
    .nis-box strong {
      color: #d4af37;
    }

    /* Styling Cita-cita */
    .wish-box {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #ffffff;
      background: rgba(212, 175, 55, 0.1);
      padding: 8px 15px;
      border-left: 3px solid #d4af37;
      display: inline-block;
      border-radius: 0 5px 5px 0;
    }
    .wish-box span {
      color: #f3e5ab;
      font-weight: bold;
    }

    .footer-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1.3;
    }
    .footer-title span {
      color: #d4af37;
      font-size: 1.6rem;
      font-weight: 800;
    }

    /* Tombol Navigasi */
    .navigation-box {
      margin-top: 25px;
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .btn-nav {
      padding: 12px 35px;
      background: #1a150e;
      color: #d4af37;
      border: 2px solid #d4af37;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .btn-nav:hover {
      background: linear-gradient(45deg, #a67c1e, #d4af37);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* Animasi Masuk Utama */
    .purnawiyata-card.active {
      animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Modifikasi Animasi: Teks masuk bergerak samar dari KIRI */
    .purnawiyata-card.active .animate-text {
      animation: textEntranceLeft 0.7s cubic-bezier(0.25, 1, 0.5, 1) 0.4s both;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: scale(0.95) translateY(40px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Keyframes Baru untuk Efek Gerak Samar dari Kiri */
    @keyframes textEntranceLeft {
      0% {
        opacity: 0;
        transform: translateX(-40px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Responsif Ponsel / Mobile */
    @media (max-width: 768px) {
      .card-content-wrapper {
        flex-direction: column;
      }
      .left-side {
        clip-path: none;
        padding: 30px;
      }
      .right-side {
        text-align: center;
        padding: 30px 20px;
      }
      #foto-citacita {
        width: 100%;
        height: 60%;
        top: 35%;
        right: 0;
        opacity: 0.1 !important; /* Kurangi opasitas di HP agar teks tetap terbaca jelas */
      }
      #siswa-nama {
        font-size: 1.8rem;
      }
      .navigation-box {
        justify-content: center;
      }
      .wish-box {
        border-left: none;
        border-top: 2px solid #d4af37;
        border-radius: 5px;
      }
    }
  </style>
</head>
<body>

  <!-- Musik Latar Belakang -->
  <audio id="bg-music" loop>
    <source src="musik-purnawiyata.mp3" type="audio/mpeg">
  </audio>

  <!-- Overlay Start Presentasi -->
  <div id="music-overlay" onclick="startPresentation()">
    <div class="overlay-card">
      <h2>Selamat & Sukses</h2>
      <p>Persiapan Purnawiyata Ke-III SMP Islam Az-Zahro</p>
      <button class="btn-start">Mulai Presentasi</button>
    </div>
  </div>

  <main class="main-container">
    <div class="purnawiyata-card" id="student-card">
      
      <!-- Wrapper Konten Utama agar terpisah dari Border Glow -->
      <div class="card-content-wrapper">
        
        <!-- Sisi Kiri: Kotak / Tempat Foto Profil -->
        <div class="left-side">
          <div class="photo-frame">
            <img id="siswa-foto" src="" alt="Foto Siswa">
          </div>
        </div>

        <!-- Sisi Kanan: Tempat Identitas & Foto Cita-cita Besar -->
        <div class="right-side">
          
          <!-- TAG BARU: Foto Cita-cita Besar yang hampir memenuhi layar sisi kanan -->
          <img id="foto-citacita" src="" alt="Foto Cita-cita">

          <header class="header-title">SELAMAT & SUKSES</header>
          
          <div class="identity-box">
            <h1 id="siswa-nama" class="animate-text">-</h1>
            <p id="siswa-ttl" class="animate-text">-</p>
            
            <div class="sub-detail animate-text">
              <span id="siswa-ortu">-</span>
            </div>
            
            <div class="nis-box animate-text">
              <span>NIS: <strong id="siswa-nis">-</strong></span> | 
              <span>NISN: <strong id="siswa-nisn">-</strong></span>
            </div>

            <div class="wish-box animate-text">
              Cita-cita: <span id="siswa-citacita">-</span>
            </div>
          </div>

          <footer class="footer-title">
            PURNAWIYATA KE-III<br>
            <span>SMP ISLAM AZ-ZAHRO</span>
          </footer>
        </div>
      </div>

    </div>

    <div class="navigation-box">
      <button class="btn-nav" onclick="nextStudent()">Selanjutnya ❯</button>
    </div>
  </main>

  <script>
    let studentsData = [];
    let currentIndex = 0;
    const bgMusic = document.getElementById('bg-music');
    const overlay = document.getElementById('music-overlay');

    // Fungsi membuat partikel emas melayang di background secara acak
    function createParticles() {
      const particleCount = 30; // Jumlah partikel yang melayang
      for (let i = 0; i < particleCount; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        
        // Atur posisi, ukuran, kecepatan acak
        let size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + 'vw';
        
        let duration = Math.random() * 8 + 5;
        particle.style.animationDuration = duration + 's';
        
        let delay = Math.random() * 5;
        particle.style.animationDelay = delay + 's';
        
        document.body.appendChild(particle);
      }
    }

    // Mengambil data eksternal JSON
    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);
        }
      } catch (error) {
        console.error("Gagal memuat file data-siswa.json:", error);
      }
    }

    // Mengisi data ke HTML & mereset animasi masuk dengan perbaikan pemuatan foto
    function renderStudent(index) {
      const card = document.getElementById('student-card');
      const student = studentsData[index];
      const fotoElement = document.getElementById('siswa-foto');
      const fotoCitaCitaElement = document.getElementById('foto-citacita');

      // 1. Reset Animasi CSS Kartu dan Teks
      card.classList.remove('active');
      void card.offsetWidth; // Trigger reflow agar CSS animasi terulang dari awal
      card.classList.add('active');

      // 2. Terapkan Data Teks Siswa
      document.getElementById('siswa-nama').innerText = student.nama;
      document.getElementById('siswa-ttl').innerText = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      document.getElementById('siswa-nis').innerText = student.nis;
      document.getElementById('siswa-nisn').innerText = student.nisn;
      document.getElementById('siswa-citacita').innerText = student.cita_cita || "-";

      // Logika Jenis Kelamin (L/P) untuk nama orang tua
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      document.getElementById('siswa-ortu').innerText = `${hubunganOrtu} ${student.orang_tua}`;

      // 3. Solusi Foto Macet & Load Gambar (Foto Profil & Foto Cita-Cita)
      fotoElement.style.opacity = '0';
      fotoCitaCitaElement.style.opacity = '0';
      
      // Ambil pemisah URL unik bypass cache
      const separator = student.foto_url.includes('?') ? '&' : '?';
      const timestamp = 't=' + new Date().getTime();
      const urlFotoProfil = student.foto_url + separator + timestamp;
      
      // Menentukan URL Foto Cita-cita (Menggunakan key 'foto_citacita_url' dari JSON jika ada, jika tidak, gunakan foto_url sebagai fallback)
      const urlFotoCitaCitaRaw = student.foto_citacita_url || student.foto_url;
      const separatorCC = urlFotoCitaCitaRaw.includes('?') ? '&' : '?';
      const urlFotoCitaCita = urlFotoCitaCitaRaw + separatorCC + timestamp;
      
      // Set sumber gambar baru
      fotoElement.src = urlFotoProfil;
      fotoCitaCitaElement.src = urlFotoCitaCita;

      // Munculkan kembali foto profil setelah selesai dimuat
      fotoElement.onload = function() {
        fotoElement.style.opacity = '1';
      };

      // Munculkan kembali foto cita-cita besar dengan kesamaran tingkat tinggi (opacity 0.15)
      fotoCitaCitaElement.onload = function() {
        fotoCitaCitaElement.style.opacity = '0.15';
      };
    }

    // Logika tombol selanjutnya
    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      renderStudent(currentIndex);
    }

    // Fungsi klik awal untuk menyalakan musik & menyembunyikan overlay
    function startPresentation() {
      overlay.style.display = 'none';
      bgMusic.play().catch(error => console.log("Musik tertahan sistem browser:", error));
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStudentsData();
      createParticles(); // Jalankan efek partikel saat web siap
    });
  </script>
</body>
</html>
