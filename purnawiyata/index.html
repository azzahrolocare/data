<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f0c08">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE UMUM & STRUKTUR HALAMAN (OPTIMALISASI LAYAR STABIL 4K)
       ========================================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0c08; 
      background: radial-gradient(circle at center, #261b0c 0%, #0f0c08 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #main-gallery-content {
      display: none;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      padding: 40px;
    }

    /* ==========================================================================
       STYLE OPENING
       ========================================================================== */
    #opening-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #0f0c08;
      overflow: hidden;
    }

    .video-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #video-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; 
    }

    /* Style Khusus Panel Video Countdown */
    #countdown-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0c08;
      z-index: 50;
      display: none; /* Muncul hanya setelah scan sukses */
    }

    #video-countdown {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: none; 
    }

    #overlay-dark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1;
      display: none; 
    }

    /* Antarmuka Pemindaian (Default Terbuka di Awal) */
    #start-interface {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(38,27,12,0.85) 0%, rgba(15,12,8,0.95) 100%);
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .scanner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #scanner-area {
      position: relative;
      width: 200px;
      height: 200px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.03);
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    #scanner-area:active {
      transform: scale(0.95);
    }

    #scanner-area svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #progress-bar {
      stroke-dasharray: 528;
      stroke-dashoffset: 528;
      transition: stroke-dashoffset 0.03s linear, stroke 0.3s ease;
    }

    .hand-icon {
      width: 75px;
      height: 75px;
      fill: #d4af37;
      transition: fill 0.3s ease, filter 0.3s ease, transform 0.3s ease;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
      50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.35); }
      100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
    }
    #scanner-area {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    #scanner-area.scanning {
      background: rgba(212, 175, 55, 0.08);
      animation: none;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
    }

    #scanner-area.scanning .hand-icon {
      fill: #fff;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
      transform: scale(1.05);
    }

    #scanner-text {
      margin-top: 30px;
      color: #e5c158;
      font-size: 1.15rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      transition: color 0.3s ease;
      max-width: 80%;
      line-height: 1.5;
    }

    #scanner-area.scanning + #scanner-text {
      color: #fff;
    }

    #btn-skip {
      position: absolute;
      bottom: 40px;
      right: 40px;
      z-index: 100;
      background: rgba(15, 12, 8, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      display: none; 
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #btn-skip:hover {
      background: #d4af37;
      color: #0f0c08;
      border-color: #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    /* ==========================================================================
       STYLE UTAMA: STUDENT CARD & LAYOUT 4K STABIL
       ========================================================================== */
    .card-container {
      width: 100%;
      max-width: 1550px; 
      height: 820px;     
      background: rgba(15, 12, 8, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      display: flex;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0,0,0,0.8), 
                  inset 0 0 60px rgba(212,175,55,0.03);
      backdrop-filter: blur(15px);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .card-container.active {
      opacity: 1;
      transform: translateY(0);
    }

    .card-container::before, .card-container::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #d4af37;
      z-index: 10;
      pointer-events: none;
    }
    .card-container::before { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .card-container::after { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    .column-left {
      width: 32%;
      height: 100%;
      border-right: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: linear-gradient(to bottom, rgba(212,175,55,0.02) 0%, rgba(0,0,0,0) 100%);
    }

    .column-center {
      width: 40%;
      height: 100%;
      padding: 60px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .column-right {
      width: 28%;
      height: 100%;
      border-left: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    /* ==========================================================================
       KOMPONEN DETIL DATA SISWA
       ========================================================================== */
    .photo-wrapper {
      width: 360px;
      height: 480px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 10px;
      background: rgba(15, 12, 8, 0.8);
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      position: relative;
    }

    .photo-wrapper::before {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      pointer-events: none;
    }

    .photo-box {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14110c;
      position: relative;
    }

    #siswa-foto {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    .fade-in-item {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .fade-in-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .meta-title {
      color: #8c8273;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .name-container {
      margin-bottom: 35px;
      min-height: 95px; 
      display: flex;
      align-items: center;
    }

    #siswa-nama {
      color: #f3e5ab;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .info-block {
      margin-bottom: 30px;
    }

    #siswa-ttl, #siswa-ortu {
      color: #e5ded4;
      font-size: 1.35rem;
      font-weight: 400;
      line-height: 1.4;
    }

    .nis-box {
      display: inline-block;
      padding: 8px 18px;
      background: rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: #d4af37;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      border-radius: 4px;
    }

    /* ==========================================================================
       KOMPONEN CITA-CITA & ANGAN (REVEAL ANIMATION)
       ========================================================================== */
    .wish-container {
      margin-top: 15px;
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      padding-top: 30px;
    }

    #siswa-citacita {
      color: #d4af37;
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .reveal-box {
      width: 280px;
      height: 380px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.2);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      background: #14110c;
    }

    .reveal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reveal-img.color {
      z-index: 2;
      clip-path: inset(100% 0 0 0); 
      transition: clip-path 3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reveal-active .reveal-img.color {
      clip-path: inset(0 0 0 0);
    }

    .reveal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: linear-gradient(to top, rgba(15,12,8,0.9) 0%, rgba(0,0,0,0) 40%);
      pointer-events: none;
    }

    .cc-label {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 4;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease 1.5s, transform 1s ease 1.5s;
    }

    .reveal-active .cc-label {
      opacity: 1;
      transform: translateY(0);
    }

    #cc-particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .cc-particle {
      position: absolute;
      background: #d4af37;
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-400px) scale(0.5); opacity: 0; }
    }

    /* ==========================================================================
       NAVIGASI INDIKATOR ABSEN & AUDIO VISUALIZER
       ========================================================================== */
    .absen-badge {
      position: absolute;
      top: -1px;
      right: 50px;
      background: linear-gradient(135deg, #2a2012 0%, #141009 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-top: none;
      padding: 12px 25px;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    #num-absen { color: #f3e5ab; font-size: 1.8rem; font-weight: 700; }
    #total-absen { color: #7c705d; font-size: 1rem; font-weight: 500; }
    #total-absen::before { content: '/ '; }

    .visualizer-container {
      position: absolute;
      bottom: 25px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 25px;
    }

    .visualizer-bar {
      width: 3px;
      height: 3px;
      background: linear-gradient(to top, #8c6f2d, #d4af37);
      border-radius: 1px;
      transition: height 0.1s ease;
    }

    #music-btn {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      background: rgba(15, 12, 8, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2000;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    #music-btn:hover {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    #music-btn svg {
      width: 20px;
      height: 20px;
      fill: #d4af37;
    }

    .particle {
      position: fixed;
      background: #d4af37;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: globalFloat linear infinite;
    }

    @keyframes globalFloat {
      0% { transform: translateY(105vh) translateX(0); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-5vh) translateX(50px); opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="scan-sound" src="https://azzahrolocare.github.io/data/purnawiyata/files/scan.mp3" preload="auto"></audio>
  <audio id="bg-music" src="https://azzahrolocare.github.io/data/purnawiyata/files/instrumen.mp4" loop preload="auto"></audio>

  <button id="music-btn" onclick="toggleMusic()" aria-label="Pause Musik">
    <svg id="icon-play" viewBox="0 0 24 24" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <div id="opening-container">
    <canvas id="particle-canvas"></canvas>

    <div id="countdown-wrapper">
      <video id="video-countdown" playsinline muted>
        <source src="https://azzahrolocare.github.io/data/purnawiyata/files/5_Seconds_Countdown_Timer.mp4" type="video/mp4">
        Browser tidak mendukung video HTML5.
      </video>
    </div>

    <div class="video-wrapper">
      <video id="video-bg" playsinline loop onclick="togglePlayPause()">
        <source src="https://azzahrolocare.github.io/data/purnawiyata/files/opening3.mp4" type="video/mp4">
        Browser tidak mendukung video HTML5.
      </video>
    </div>

    <div id="overlay-dark"></div>

    <div id="start-interface">
      <div class="scanner-container">
        <div id="scanner-area">
          <svg viewBox="0 0 180 180">
            <circle cx="90" cy="90" r="84" stroke="rgba(212, 175, 55, 0.15)" stroke-width="3" fill="none" />
            <circle id="progress-bar" cx="90" cy="90" r="84" stroke="#d4af37" stroke-width="4" fill="none" stroke-linecap="round" />
          </svg>
          <svg class="hand-icon" viewBox="0 0 24 24">
            <path d="M12 2c-.83 0-1.5.67-1.5 1.5v7.21l-2.44-.61c-.08-.02-.17-.03-.25-.03-.54 0-1 .41-1.07.95l-.23 1.83c0 .12.02.24.08.34l3.5 6.07c.41.71 1.17 1.15 1.99 1.15h5.58c1.15 0 2.12-.85 2.29-2l.74-5.22c.12-.86-.4-1.67-1.23-1.89l-2.69-.73V7.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v2.85l-1.5-.41V3.5c0-.83-.67-1.5-1.5-1.5z"/>
          </svg>
        </div>
        <div id="scanner-text">Letakkan Telapak Tangan untuk Autentikasi</div>
      </div>
    </div>

    <button id="btn-skip" onclick="menujuGaleriUtama()">
      Lanjutkan
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/></svg>
    </button>
  </div>

  <main id="main-gallery-content">
    <div class="card-container" id="student-card">
      
      <div class="absen-badge">
        <span id="num-absen">00</span>
        <span id="total-absen">00</span>
      </div>

      <section class="column-left">
        <div class="photo-wrapper">
          <div class="photo-box">
            <img id="siswa-foto" src="" alt="Foto Profil Siswa">
          </div>
        </div>
      </section>

      <section class="column-center">
        <div class="info-block name-container" id="cont-nama">
          <h1 id="siswa-nama">-</h1>
        </div>

        <div class="info-block fade-in-item" id="cont-ttl">
          <p class="meta-title">Tempat, Tanggal Lahir</p>
          <p id="siswa-ttl">-</p>
        </div>

        <div class="info-block fade-in-item" id="cont-ortu">
          <p class="meta-title">Hubungan Keluarga</p>
          <p id="siswa-ortu">-</p>
        </div>

        <div class="info-block fade-in-item" id="cont-nis">
          <div class="nis-box" id="siswa-nis-box">NIS: - | NISN: -</div>
        </div>

        <div class="info-block wish-container fade-in-item" id="cont-wish">
          <p class="meta-title">Cita-Cita & Harapan Masa Depan</p>
          <h2 id="siswa-citacita">-</h2>
        </div>
      </section>

      <section class="column-right" id="column-cc">
        <div id="cc-particles-container"></div>
        <div class="reveal-box">
          <img class="reveal-img bw" id="foto-citacita-bw" src="" alt="Foto Kreatif Standby">
          <img class="reveal-img color" id="foto-citacita-color" src="" alt="Foto Kreatif Terbuka">

          <div class="cc-label">Masa Depan</div>
        </div>

        <div class="visualizer-container">
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
        </div>
      </section>

    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker berhasil didaftarkan.', reg.scope))
          .catch(err => console.error('Gagal mendaftarkan Service Worker:', err));
      });
    }

    // Ambil referensi elemen Countdown baru
    const videoCountdown = document.getElementById('video-countdown');
    const countdownWrapper = document.getElementById('countdown-wrapper');

    const video = document.getElementById('video-bg');
    const startInterface = document.getElementById('start-interface');
    const overlayDark = document.getElementById('overlay-dark');
    const btnSkip = document.getElementById('btn-skip');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const openingContainer = document.getElementById('opening-container');
    const mainGalleryContent = document.getElementById('main-gallery-content');

    const scannerArea = document.getElementById('scanner-area');
    const progressBar = document.getElementById('progress-bar');
    const scannerText = document.getElementById('scanner-text');
    
    const scanSound = document.getElementById('scan-sound');

    let scanProgress = 0;
    let scanInterval = null;
    const scanDuration = 10000; 
    const scanStep = 30; 
    const maxOffset = 528; 

    let studentsData = [];
    let preloadedImages = []; 
    let currentIndex = 0;
    let fadeTimeouts = []; 
    const bgMusic = document.getElementById('bg-music');
    
    let audioCtx, analyser, bufferLength, dataArray;
    let visualizerAnimationId;

    let particlesArray = [];
    let ccParticlesInterval;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * -0.8 - 0.2; 
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37';
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      resizeCanvas();
      particlesArray = [];
      for (let i = 0; i < 25; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      visualizerAnimationId = requestAnimationFrame(animateParticles);
    }

    function startScanning(e) {
      e.preventDefault();
      if (scanInterval) return;

      scannerArea.classList.add('scanning');
      scannerText.textContent = "Memindai...";

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch(err) { console.log(err); }

      scanSound.currentTime = 0;
      scanSound.play().catch(err => console.log("Gagal memutar audio scan:", err));

      scanInterval = setInterval(() => {
        scanProgress += (scanStep / scanDuration) * 100;
        
        if (scanProgress >= 100) {
          scanProgress = 100;
          clearInterval(scanInterval);
          scanInterval = null;
          progressBar.style.strokeDashoffset = 0;
          
          scanSound.pause();
          scanSound.currentTime = 0;
          
          // PINDAH KE PROSES COUNTDOWN BERIKUTNYA SEBELUM OPENING UTAMA
          jalankanVideoCountdown();
        } else {
          let currentOffset = maxOffset - (maxOffset * (scanProgress / 100));
          progressBar.style.strokeDashoffset = currentOffset;
        }
      }, scanStep);
    }

    function stopScanning() {
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      scannerArea.classList.remove('scanning');
      scannerText.textContent = "Letakkan Telapak Tangan untuk Autentikasi";
      
      scanSound.pause();
      scanSound.currentTime = 0;
      
      let resetInterval = setInterval(() => {
        if (scanProgress > 0) {
          scanProgress -= 8; 
          if (scanProgress < 0) scanProgress = 0;
          let currentOffset = maxOffset - (maxOffset * (scanProgress / 100));
          progressBar.style.strokeDashoffset = currentOffset;
        } else {
          clearInterval(resetInterval);
        }
      }, 20);
    }

    scannerArea.addEventListener('mousedown', startScanning);
    scannerArea.addEventListener('mouseup', stopScanning);
    scannerArea.addEventListener('mouseleave', stopScanning);
    
    scannerArea.addEventListener('touchstart', startScanning, { passive: false });
    scannerArea.addEventListener('touchend', stopScanning);
    scannerArea.addEventListener('touchcancel', stopScanning);

    // FUNGSI BARU: MEMUTAR COUNTDOWN 5 DETIK SETELAH SCAN BERHASIL
    function jalankanVideoCountdown() {
      // Sembunyikan panel scanner
      startInterface.style.display = 'none';
      
      // Tampilkan dan mainkan video countdown
      countdownWrapper.style.display = 'block';
      
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      }

      videoCountdown.play().catch(err => {
        console.log("Gagal memutar video countdown otomatis:", err);
        mulaiVideoSinematik(); // Langsung lompat ke video opening jika terblokir
      });

      // Begitu video countdown selesai 1x putaran, picu video opening utama
      videoCountdown.addEventListener('ended', function countdownSelesai() {
        videoCountdown.removeEventListener('ended', countdownSelesai); // Clear event listener
        countdownWrapper.style.display = 'none';
        mulaiVideoSinematik();
      });
    }

    // LOGIKA ASLI: MEMUTAR VIDEO OPENING UTAMA
    function mulaiVideoSinematik() {
      video.style.display = 'block';
      overlayDark.style.display = 'block';
      btnSkip.style.display = 'flex'; 
      canvas.style.display = 'block';
      
      initParticles();
      animateParticles();

      video.muted = false; 
      video.play().catch(error => {
        console.log("Gagal memutar video: ", error);
        menujuGaleriUtama();
      });
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function menujuGaleriUtama() {
      video.pause();
      openingContainer.style.display = 'none';
      mainGalleryContent.style.display = 'flex';

      createGlobalParticles();
      loadStudentsData();
      initVisualizer();

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      bgMusic.play().catch(error => {
        console.log("Musik ditahan browser policy.", error);
      });
    }

    function padZero(num) {
      return num < 10 ? '0' + num : num;
    }

    function sequentialFadeIn(containers) {
      containers.forEach((item) => {
        let timer = setTimeout(() => {
          item.el.classList.add('fade-in-visible');
          if (item.callback) item.callback();
        }, item.delay);
        fadeTimeouts.push(timer);
      });
    }

    function createGlobalParticles() {
      const particleCount = 8; 
      for (let i = 0; i < particleCount; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        let size = Math.random() * 4 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + 'vw';
        let duration = Math.random() * 8 + 8;
        particle.style.animationDuration = duration + 's';
        let delay = Math.random() * 4;
        particle.style.animationDelay = delay + 's';
        document.body.appendChild(particle);
      }
    }

    function startCcParticles() {
      const container = document.getElementById('cc-particles-container');
      if (ccParticlesInterval) clearInterval(ccParticlesInterval);
      
      ccParticlesInterval = setInterval(() => {
        const particle = document.createElement('div');
        particle.className = 'cc-particle';
        const size = Math.random() * 5 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = '100%';
        const duration = Math.random() * 3 + 2;
        particle.style.animationDuration = duration + 's';
        container.appendChild(particle);
        setTimeout(() => {
          particle.remove();
        }, duration * 1000);
      }, 150);
    }

    function stopCcParticles() {
      if (ccParticlesInterval) clearInterval(ccParticlesInterval);
      const container = document.getElementById('cc-particles-container');
      container.innerHTML = '';
    }

    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);

          studentsData.forEach(student => {
            const imgProfil = new Image();
            imgProfil.src = student.foto_profil_url;
            preloadedImages.push(imgProfil);

            const finalCCUrl = student.foto_cita_cita_url || student.foto_profil_url;
            const imgCc = new Image();
            imgCc.src = finalCCUrl;
            preloadedImages.push(imgCc);
          });
          console.log("Aset foto berhasil diamankan ke RAM.");
        }
      } catch (error) {
        console.error("Gagal memuat berkas data-siswa.json:", error);
      }
    }

    function sesuaikanUkuranNamaSiswa() {
      const elNama = document.getElementById('siswa-nama');
      const containerNama = document.getElementById('cont-nama');
      
      if (window.innerWidth > 1200) {
        elNama.style.fontSize = '3.2rem';
        elNama.style.whiteSpace = 'nowrap';
        
        let currentSize = 3.2;
        const minSize = 1.6; 
        
        while (elNama.scrollWidth > containerNama.clientWidth && currentSize > minSize) {
          currentSize -= 0.1;
          elNama.style.fontSize = currentSize + 'rem';
        }

        if (elNama.scrollWidth > containerNama.clientWidth) {
          elNama.style.whiteSpace = 'normal';
        }
      }
    }

    function renderStudent(index) {
      fadeTimeouts.forEach(clearTimeout);
      fadeTimeouts = [];
      stopCcParticles();

      const card = document.getElementById('student-card');
      const student = studentsData[index];
      
      const cNama = document.getElementById('cont-nama');
      const cTtl = document.getElementById('cont-ttl');
      const cOrtu = document.getElementById('cont-ortu');
      const cNis = document.getElementById('cont-nis');
      const cWish = document.getElementById('cont-wish');

      const elNama = document.getElementById('siswa-nama');
      const elTtl = document.getElementById('siswa-ttl');
      const elOrtu = document.getElementById('siswa-ortu');
      const elNisBox = document.getElementById('siswa-nis-box');
      const elCitaCita = document.getElementById('siswa-citacita');
      
      const elNumAbsen = document.getElementById('num-absen');
      const elTotalAbsen = document.getElementById('total-absen');

      const fotoElement = document.getElementById('siswa-foto');
      const fotoBw = document.getElementById('foto-citacita-bw');
      const fotoColor = document.getElementById('foto-citacita-color');
      const ccContainer = document.getElementById('column-cc');

      card.classList.remove('active');
      cNama.classList.remove('fade-in-visible');
      cTtl.classList.remove('fade-in-visible');
      cOrtu.classList.remove('fade-in-visible');
      cNis.classList.remove('fade-in-visible');
      cWish.classList.remove('fade-in-visible');

      void card.offsetWidth; 
      card.classList.add('active');

      elNumAbsen.innerText = padZero(index + 1);
      elTotalAbsen.innerText = padZero(studentsData.length);

      elNama.textContent = student.nama;
      elTtl.textContent = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      elOrtu.textContent = `${hubunganOrtu} ${student.orang_tua}`;
      elNisBox.textContent = `NIS: ${student.nis} | NISN: ${student.nisn}`;
      elCitaCita.innerText = student.cita_cita || "-";

      fotoElement.style.opacity = '0.3';
      fotoElement.src = student.foto_profil_url;
      fotoElement.style.opacity = '1';

      const finalCCUrl = student.foto_cita_cita_url || student.foto_profil_url;
      ccContainer.classList.remove('reveal-active');
      fotoBw.src = finalCCUrl;
      fotoColor.src = finalCCUrl;
      
      setTimeout(() => {
        ccContainer.classList.add('reveal-active');
      }, 50);

      sesuaikanUkuranNamaSiswa();

      sequentialFadeIn([
        { el: cNama, delay: 100 },
        { el: cTtl, delay: 250 },
        { el: cOrtu, delay: 400 },
        { el: cNis, delay: 550 },
        { 
          el: cWish, 
          delay: 700, 
          callback: () => {
            startCcParticles();
          }
        }
      ]);
    }

    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      if (!bgMusic.paused) { bgMusic.currentTime = 0; }
      renderStudent(currentIndex);
    }

    function prevStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex - 1 + studentsData.length) % studentsData.length;
      if (!bgMusic.paused) { bgMusic.currentTime = 0; }
      renderStudent(currentIndex);
    }

    function initVisualizer() {
      if (audioCtx && analyser) return; 
      if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      analyser = audioCtx.createAnalyser();
      
      const source = audioCtx.createMediaElementSource(bgMusic);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      
      analyser.fftSize = 64; 
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      
      animateVisualizer();
    }

    function animateVisualizer() {
      requestAnimationFrame(animateVisualizer);
      const bars = document.querySelectorAll('.visualizer-bar');
      
      if (bgMusic.paused) {
        bars.forEach(bar => { bar.style.height = '3px'; });
        return;
      }
      
      analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < bars.length; i++) {
        let dataIndex = Math.floor(i * (bufferLength / bars.length));
        let value = dataArray[dataIndex];
        let percent = value / 255;
        let height = (percent * 20) + 3; 
        bars[i].style.height = height + 'px';
      }
    }

    function toggleMusic() {
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const musicBtn = document.getElementById('music-btn');
      
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          musicBtn.setAttribute('aria-label', 'Pause Musik');
        }).catch(error => console.log("Gagal memutar musik:", error));
      } else {
        bgMusic.pause();
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        musicBtn.setAttribute('aria-label', 'Putar Musik');
      }
    }

    window.addEventListener('keydown', (event) => {
      if (openingContainer.style.display !== 'none') {
        if (startInterface.style.display === 'none') {
          switch(event.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case 'PageDown':
            case 'Enter': 
              menujuGaleriUtama();
              break;
          }
        }
      } 
      else if (mainGalleryContent.style.display === 'flex') {
        switch(event.key) {
          case 'ArrowRight':
          case 'PageDown':
            nextStudent();
            break;
          case 'ArrowLeft':
          case 'PageUp':
            prevStudent();
            break;
        }
      }
    });

    window.addEventListener('resize', () => {
      if (studentsData.length > 0 && mainGalleryContent.style.display === 'flex') {
        sesuaikanUkuranNamaSiswa();
      }
    });
  </script>
</body>
</html>
