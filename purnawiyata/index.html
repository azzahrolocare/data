<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE / CSS (Tema Luxury Gold, 3-Column Layout & Ukuran Jumbo)
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c08; 
      background: linear-gradient(to right, #2b1f0d, #0f0c08, #2b1f0d);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Efek Partikel Latar Belakang */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212,175,55,0.8) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
    }

    @keyframes floatParticles {
      0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Overlay Interaksi Awal untuk Mengaktifkan Musik */
    #music-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .overlay-card {
      text-align: center;
      color: #fff;
      border: 2px solid #d4af37;
      padding: 40px;
      background: #1a150e;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .overlay-card h2 { color: #d4af37; margin-bottom: 10px; }
    .btn-start {
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.2s;
    }
    .btn-start:hover { transform: scale(1.05); }

    /* Kontainer Utama & Kartu Diperbesar Jauh Lebih Luas */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1250px; /* Diperbesar agar memanfaatkan space kosong */
      z-index: 10;
    }

    /* KARTU JUMBO: Efek garis emas bergerak */
    .purnawiyata-card {
      display: flex;
      width: 100%;
      min-height: 520px; /* Ditambah tingginya agar lebih megah */
      background: linear-gradient(135deg, #16120b 0%, #282012 50%, #16120b 100%);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transform: translateY(30px);
    }

    .purnawiyata-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #d4af37, #f3e5ab, #d4af37);
      animation: borderRotate 6s linear infinite;
      z-index: 1;
    }

    /* Lapisan dalam pembungkus struktur 3 KOLOM */
    .card-content-wrapper {
      display: flex;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
      margin: 3px;
      background: inherit;
      border-radius: 17px;
      overflow: hidden;
      z-index: 2;
    }

    @keyframes borderRotate { 100% { transform: rotate(360deg); } }

    /* ==========================================================================
       STRUKTUR 3 KOLOM (KIRI - TENGAH - KANAN)
       ========================================================================== */

    /* KOLOM 1: Sisi Kiri (Tempat Foto Profil Siswa) */
    .column-left {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #d4af37, #aa7c11, #f3e5ab);
      padding: 40px;
      position: relative;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
    }

    .photo-frame {
      width: 100%;
      max-width: 260px;
      height: 370px;
      border: 5px solid #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
      background: #333;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    /* Efek bayangan hitam lembut di bagian bawah foto utama */
    .photo-frame::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 35%;
      background: linear-gradient(to top, rgba(15, 12, 8, 0.9) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    /* KOLOM 2: Sisi Tengah (Khusus Teks Biodata - Bersih & Lega) */
    .column-center {
      flex: 1.4;
      padding: 50px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .identity-box {
      margin: 25px 0;
    }

    #siswa-nama {
      font-size: 2.5rem; /* Ukuran nama diperbesar biar tegas */
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 5px;
      display: inline-block;
    }

    #siswa-ttl {
      font-size: 1.25rem;
      color: #e0e0e0;
      font-weight: 500;
    }

    .sub-detail {
      font-size: 1.35rem;
      margin-top: 12px;
      font-style: italic;
      color: #f3e5ab;
    }

    .nis-box {
      margin-top: 12px;
      font-size: 1rem;
      color: #b3b3b3;
    }
    .nis-box strong { color: #d4af37; }

    .wish-box {
      margin-top: 20px;
      font-size: 1.15rem;
      color: #ffffff;
      background: rgba(212, 175, 55, 0.15);
      padding: 10px 18px;
      border-left: 4px solid #d4af37;
      display: inline-block;
      border-radius: 0 5px 5px 0;
    }
    .wish-box span { color: #f3e5ab; font-weight: bold; }

    .footer-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1.3;
    }
    .footer-title span { color: #d4af37; font-size: 1.6rem; font-weight: 800; }

    /* KOLOM 3: Sisi Kanan (Khusus Foto Cita-cita Besar dengan Efek Edge Fading) */
    .column-right {
      flex: 1.1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    #foto-citacita {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0; /* Dikontrol via JS */
      mix-blend-mode: lighten;
      filter: grayscale(10%) brightness(75%) contrast(105%);
      pointer-events: none;
      
      /* GRADIENT MASKING: Menyamarkan pinggiran kiri gambar agar menyatu mulus ke warna background tengah */
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
      
      transition: opacity 0.6s ease-in-out;
    }

    /* Tombol Navigasi */
    .navigation-box {
      margin-top: 30px;
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .btn-nav {
      padding: 12px 40px;
      background: #1a150e;
      color: #d4af37;
      border: 2px solid #d4af37;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .btn-nav:hover {
      background: linear-gradient(45deg, #a67c1e, #d4af37);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* ==========================================================================
       ANIMASI MASUK
       ========================================================================== */
    .purnawiyata-card.active {
      animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .purnawiyata-card.active .animate-text {
      animation: textEntranceLeft 0.7s cubic-bezier(0.25, 1, 0.5, 1) 0.3s both;
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.97) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes textEntranceLeft {
      0% { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* Responsif Layar Hp / Mobile */
    @media (max-width: 900px) {
      .card-content-wrapper { flex-direction: column; }
      .column-left { clip-path: none; padding: 30px; }
      .column-center { text-align: center; padding: 30px 20px; }
      .column-right { height: 300px; width: 100%; }
      #foto-citacita {
        -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
      }
      #siswa-nama { font-size: 2rem; }
      .navigation-box { justify-content: center; }
      .wish-box { border-left: none; border-top: 3px solid #d4af37; border-radius: 5px; }
    }
  </style>
</head>
<body>

  <!-- Musik Latar Belakang -->
  <audio id="bg-music" loop>
    <source src="musik-purnawiyata.mp3" type="audio/mpeg">
  </audio>

  <!-- Overlay Start Presentasi -->
  <div id="music-overlay" onclick="startPresentation()">
    <div class="overlay-card">
      <h2>Selamat & Sukses</h2>
      <p>Persiapan Purnawiyata Ke-III SMP Islam Az-Zahro</p>
      <button class="btn-start">Mulai Presentasi</button>
    </div>
  </div>

  <main class="main-container">
    <div class="purnawiyata-card" id="student-card">
      
      <div class="card-content-wrapper">
        
        <!-- KOLOM 1: Sisi Kiri (Foto Profil Utama) -->
        <div class="column-left">
          <div class="photo-frame">
            <img id="siswa-foto" src="" alt="Foto Profil Siswa">
          </div>
        </div>

        <!-- KOLOM 2: Sisi Tengah (Biodata Teks Lengkap) -->
        <div class="column-center">
          <header class="header-title">SELAMAT & SUKSES</header>
          
          <div class="identity-box">
            <h1 id="siswa-nama" class="animate-text">-</h1>
            <p id="siswa-ttl" class="animate-text">-</p>
            
            <div class="sub-detail animate-text">
              <span id="siswa-ortu">-</span>
            </div>
            
            <div class="nis-box animate-text">
              <span>NIS: <strong id="siswa-nis">-</strong></span> | 
              <span>NISN: <strong id="siswa-nisn">-</strong></span>
            </div>

            <div class="wish-box animate-text">
              Cita-cita: <span id="siswa-citacita">-</span>
            </div>
          </div>

          <footer class="footer-title">
            PURNAWIYATA KE-III<br>
            <span>SMP ISLAM AZ-ZAHRO</span>
          </footer>
        </div>

        <!-- KOLOM 3: Sisi Kanan (Foto Cita-cita Besar Mandiri) -->
        <div class="column-right">
          <img id="foto-citacita" src="" alt="Foto Visual Cita-cita">
        </div>

      </div>

    </div>

    <!-- Tombol Navigasi -->
    <div class="navigation-box">
      <button class="btn-nav" onclick="nextStudent()">Selanjutnya ❯</button>
    </div>
  </main>

  <script>
    let studentsData = [];
    let currentIndex = 0;
    const bgMusic = document.getElementById('bg-music');
    const overlay = document.getElementById('music-overlay');

    function createParticles() {
      const particleCount = 35;
      for (let i = 0; i < particleCount; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        let size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + 'vw';
        let duration = Math.random() * 8 + 5;
        particle.style.animationDuration = duration + 's';
        let delay = Math.random() * 5;
        particle.style.animationDelay = delay + 's';
        document.body.appendChild(particle);
      }
    }

    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);
        }
      } catch (error) {
        console.error("Gagal memuat file data-siswa.json:", error);
      }
    }

    function renderStudent(index) {
      const card = document.getElementById('student-card');
      const student = studentsData[index];
      const fotoElement = document.getElementById('siswa-foto');
      const fotoCitaCitaElement = document.getElementById('foto-citacita');

      card.classList.remove('active');
      void card.offsetWidth; 
      card.classList.add('active');

      document.getElementById('siswa-nama').innerText = student.nama;
      document.getElementById('siswa-ttl').innerText = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      document.getElementById('siswa-nis').innerText = student.nis;
      document.getElementById('siswa-nisn').innerText = student.nisn;
      document.getElementById('siswa-citacita').innerText = student.cita_cita || "-";

      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      document.getElementById('siswa-ortu').innerText = `${hubunganOrtu} ${student.orang_tua}`;

      fotoElement.style.opacity = '0';
      fotoCitaCitaElement.style.opacity = '0';
      
      const separator = student.foto_url.includes('?') ? '&' : '?';
      const timestamp = 't=' + new Date().getTime();
      const urlFotoProfil = student.foto_url + separator + timestamp;
      
      const urlFotoCitaCitaRaw = student.foto_citacita_url || student.foto_url;
      const separatorCC = urlFotoCitaCitaRaw.includes('?') ? '&' : '?';
      const urlFotoCitaCita = urlFotoCitaCitaRaw + separatorCC + timestamp;
      
      fotoElement.src = urlFotoProfil;
      fotoCitaCitaElement.src = urlFotoCitaCita;

      fotoElement.onload = function() {
        fotoElement.style.opacity = '1';
      };

      fotoCitaCitaElement.onload = function() {
        fotoCitaCitaElement.style.opacity = '0.55'; /* Opacity dinaikkan ke 0.55 agar gambar terlihat jelas dan hidup di kolom kanan */
      };
    }

    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      renderStudent(currentIndex);
    }

    function startPresentation() {
      overlay.style.display = 'none';
      bgMusic.play().catch(error => console.log("Musik tertahan sistem browser:", error));
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStudentsData();
      createParticles();
    });
  </script>
</body>
</html>
