<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE / CSS (Tema Luxury Gold, 3-Column Layout & Ukuran Super Jumbo)
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c08; 
      background: linear-gradient(to right, #2b1f0d, #0f0c08, #2b1f0d);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 15px;
    }

    /* Efek Partikel Latar Belakang Utama */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212,175,55,0.8) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
      z-index: 1;
    }

    @keyframes floatParticles {
      0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Overlay Interaksi Awal untuk Mengaktifkan Musik */
    #music-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .overlay-card {
      text-align: center;
      color: #fff;
      border: 2px solid #d4af37;
      padding: 40px;
      background: #1a150e;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .overlay-card h2 { color: #d4af37; margin-bottom: 10px; }
    .btn-start {
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.2s;
    }
    .btn-start:hover { transform: scale(1.05); }

    /* KONTANER UTAMA */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1380px; 
      height: 92vh; 
      z-index: 10;
    }

    /* KARTU SUPER JUMBO FULL BAWAH */
    .purnawiyata-card {
      display: flex;
      width: 100%;
      height: 100%; 
      min-height: 620px;
      background: linear-gradient(135deg, #16120b 0%, #282012 50%, #16120b 100%);
      border-radius: 25px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transform: translateY(30px);
    }

    .purnawiyata-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #d4af37, #f3e5ab, #d4af37);
      animation: borderRotate 6s linear infinite;
      z-index: 1;
    }

    /* Lapisan dalam pembungkus struktur kartu */
    .card-content-wrapper {
      display: flex;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
      margin: 3px;
      background: inherit;
      border-radius: 22px;
      overflow: hidden;
      z-index: 2;
    }

    @keyframes borderRotate { 100% { transform: rotate(360deg); } }

    /* ==========================================================================
       STRUKTUR 3 KOLOM 
       ========================================================================== */

    /* KOLOM 1: Sisi Kiri (Foto Profil Utama & Tombol Kembali) */
    .column-left {
      flex: 0.85;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #d4af37, #aa7c11, #f3e5ab);
      padding: 40px;
      position: relative;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
    }

    .photo-frame {
      width: 100%;
      max-width: 300px;
      height: 440px; 
      border: 6px solid #fff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
      background: #333;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 35%;
      background: linear-gradient(to top, rgba(15, 12, 8, 0.9) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    /* KOLOM 2: Sisi Tengah (Logo Sekolah & Biodata Teks) */
    .column-center {
      flex: 1.4;
      padding: 40px 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-around; 
      color: #ffffff;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .school-logo {
      width: 75px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.5));
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .identity-box {
      margin: 10px 0;
    }

    .name-container {
      min-height: 110px; 
      display: flex;
      align-items: center;
      position: relative;
    }

    /* Efek Animasi Glow Gold Line Berjalan di Bawah Nama */
    #siswa-nama {
      font-size: 2.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 12px;
      line-height: 1.2;
      word-wrap: break-word;
      max-width: 100%;
      position: relative;
      display: inline-block;
      width: 100%;
    }

    #siswa-nama::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, #a67c1e 0%, #f3e5ab 25%, #d4af37 50%, #f3e5ab 75%, #a67c1e 100%);
      background-size: 200% auto;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.8), 0 0 4px rgba(243, 229, 171, 0.5);
      border-radius: 2px;
      animation: goldLineFlow 3s linear infinite;
    }

    @keyframes goldLineFlow {
      0% { background-position: 0% center; }
      100% { background-position: -200% center; }
    }

    /* Kursor Ketik Berkedip Visual */
    .typing-cursor::after {
      content: '|';
      color: #d4af37;
      animation: blink 0.7s infinite;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #siswa-ttl {
      font-size: 1.3rem;
      color: #e0e0e0;
      font-weight: 500;
      margin-top: 14px;
    }

    .sub-detail {
      font-size: 1.4rem;
      margin-top: 8px;
      font-style: italic;
      color: #f3e5ab;
    }

    .nis-box {
      margin-top: 10px;
      font-size: 1.05rem;
      color: #b3b3b3;
    }
    .nis-box strong { color: #d4af37; }

    /* KOTAK CITA-CITA: Efek Memudar Halus Dikontrol via JS */
    .wish-box {
      margin-top: 18px;
      font-size: 1.2rem;
      color: #ffffff;
      background: rgba(212, 175, 55, 0.15);
      padding: 10px 20px;
      border-left: 4px solid #d4af37;
      display: inline-block;
      border-radius: 0 5px 5px 0;
      opacity: 0; /* Awalnya tidak terlihat */
      transform: translateY(10px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }
    .wish-box.fade-in-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .wish-box span { color: #f3e5ab; font-weight: bold; }

    .footer-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1.3;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 15px;
      margin-top: 15px;
    }
    .footer-title span { color: #d4af37; font-size: 1.55rem; font-weight: 800; }


    /* ==========================================================================
       KOLOM 3: Sisi Kanan (Modifikasi Efek Gradien & Partikel Tepat Pada Foto)
       ========================================================================== */
    .column-right {
      flex: 1.15;
      position: relative;
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    /* Lapisan Gradien Gelap di bagian paling bawah foto cita-cita */
    .column-right::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(to top, #16120b 10%, rgba(22, 18, 11, 0.6) 50%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    #foto-citacita {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0; /* Muncul memudar setelah pengetikan selesai */
      pointer-events: none;
      z-index: 2;
      
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 8%, rgba(0,0,0,1) 35%, rgba(0,0,0,1) 100%);
      mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 8%, rgba(0,0,0,1) 35%, rgba(0,0,0,1) 100%);
      
      transition: opacity 1.2s ease-in-out; /* Durasi memudar lebih lembut */
    }

    /* PARTIKEL KHUSUS: Hanya aktif/kelihatan ketika foto cita-cita memudar masuk */
    .cc-particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255, 232, 156, 0.95) 0%, rgba(212, 175, 55, 0.5) 40%, rgba(212, 175, 55, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 6; 
      animation: floatUpCC linear infinite;
      filter: drop-shadow(0 0 4px rgba(243, 229, 171, 0.6));
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Partikel ikut muncul saat foto cita-cita aktif */
    .show-particles .cc-particle {
      opacity: 1;
    }

    @keyframes floatUpCC {
      0% { top: 105%; transform: scale(0.3) translateX(0); opacity: 0; }
      15% { opacity: 0.8; }
      50% { transform: scale(0.7) translateX(15px); }
      85% { opacity: 0.6; }
      100% { top: -10%; transform: scale(1.2) translateX(-15px); opacity: 0; }
    }

    /* ==========================================================================
       STYLE UTK TOMBOL NAVIGASI KIRI & KANAN FIXED POSITION
       ========================================================================== */
    .btn-nav-arrow {
      position: absolute;
      bottom: 30px;
      background: none;
      border: none;
      color: #d4af37;
      font-size: 2.8rem;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.35; 
      z-index: 50; 
      transition: all 0.3s ease;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
      user-select: none;
    }

    .btn-left { right: 30px; }
    .btn-right { right: 35px; }

    .btn-nav-arrow:hover {
      opacity: 1; 
      color: #f3e5ab;
      transform: scale(1.15);
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
    }
    .btn-left:hover { transform: scale(1.15) translateX(-3px); }
    .btn-right:hover { transform: scale(1.15) translateX(3px); }

    /* ANIMASI MASUK CARD */
    .purnawiyata-card.active {
      animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.97) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Responsif Layar Hp / Mobile */
    @media (max-width: 950px) {
      .main-container { height: auto; }
      .card-content-wrapper { flex-direction: column; }
      .column-left { clip-path: none; padding: 40px; }
      .column-center { text-align: center; padding: 35px 20px; align-items: center; }
      .brand-header { align-items: center; }
      .name-container { min-height: auto; justify-content: center; }
      #siswa-nama { font-size: 2rem; }
      
      .column-right { height: 380px; width: 100%; }
      .column-right::after {
        height: 45%;
        background: linear-gradient(to top, #16120b 15%, rgba(22, 18, 11, 0.7) 60%, transparent 100%);
      }
      #foto-citacita {
        -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 100%);
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 100%);
      }
      
      .btn-nav-arrow { bottom: 20px; font-size: 2.5rem; opacity: 0.7; }
      .btn-left { left: 25px; right: auto; }
      .btn-right { right: 25px; }
    }
  </style>
</head>
<body>

  <!-- Musik Latar Belakang -->
  <audio id="bg-music" loop>
    <source src="musik-purnawiyata.mp3" type="audio/mpeg">
  </audio>

  <!-- Overlay Start Presentasi -->
  <div id="music-overlay" onclick="startPresentation()">
    <div class="overlay-card">
      <h2>Selamat & Sukses</h2>
      <p>Persiapan Purnawiyata Ke-III SMP Islam Az-Zahro</p>
      <button class="btn-start">Mulai Presentasi</button>
    </div>
  </div>

  <main class="main-container">
    <div class="purnawiyata-card" id="student-card">
      
      <div class="card-content-wrapper">
        
        <!-- KOLOM 1: Sisi Kiri -->
        <div class="column-left">
          <div class="photo-frame">
            <img id="siswa-foto" src="" alt="Foto Profil Siswa">
          </div>
          <button class="btn-nav-arrow btn-left" onclick="prevStudent()" aria-label="Siswa Sebelumnya">❮</button>
        </div>

        <!-- KOLOM 2: Sisi Tengah (Biodata dengan Efek Ketik) -->
        <div class="column-center">
          <div class="brand-header">
            <img class="school-logo" src="https://github.com/masrahmat-id/absensi-barcode-online-smp-smk-azzahro/raw/main/logo-smp-azzahro.png" alt="Logo SMP Islam Az-Zahro">
            <header class="header-title">SELAMAT & SUKSES</header>
          </div>
          
          <div class="identity-box">
            <div class="name-container">
              <h1 id="siswa-nama">-</h1>
            </div>
            
            <p id="siswa-ttl">-</p>
            
            <div class="sub-detail">
              <span id="siswa-ortu">-</span>
            </div>
            
            <div class="nis-box" id="siswa-nis-box">
              <!-- Struktur diubah sedikit agar proses ngetik label dan nilai menyatu mulus -->
            </div>

            <div class="wish-box" id="siswa-wish-box">
              Cita-cita: <span id="siswa-citacita">-</span>
            </div>
          </div>

          <footer class="footer-title">
            PURNAWIYATA KE-III<br>
            <span>SMP ISLAM AZ-ZAHRO</span>
          </footer>
        </div>

        <!-- KOLOM 3: Sisi Kanan -->
        <div class="column-right" id="column-cc">
          <img id="foto-citacita" src="" alt="Foto Visual Cita-cita">
          <button class="btn-nav-arrow btn-right" onclick="nextStudent()" aria-label="Siswa Selanjutnya">❯</button>
        </div>

      </div>

    </div>
  </main>

  <script>
    let studentsData = [];
    let currentIndex = 0;
    let typingTimeouts = []; // Menyimpan semua antrean timeout ketik agar bisa dibersihkan saat pindah siswa
    const bgMusic = document.getElementById('bg-music');
    const overlay = document.getElementById('music-overlay');

    // Fungsi Utama Efek Mengetik Berantai (Sequential Typing Effect)
    function typeEffect(element, fullText, speed, onComplete) {
      element.innerText = "";
      element.classList.add('typing-cursor');
      let i = 0;
      
      function type() {
        if (i < fullText.length) {
          element.innerText += fullText.charAt(i);
          i++;
          let timer = setTimeout(type, speed);
          typingTimeouts.push(timer);
        } else {
          element.classList.remove('typing-cursor');
          if (onComplete) onComplete();
        }
      }
      type();
    }

    // Generator partikel latar belakang luar
    function createGlobalParticles() {
      const particleCount = 35;
      for (let i = 0; i < particleCount; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        let size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + 'vw';
        let duration = Math.random() * 8 + 5;
        particle.style.animationDuration = duration + 's';
        let delay = Math.random() * 5;
        particle.style.animationDelay = delay + 's';
        document.body.appendChild(particle);
      }
    }

    // Generator mikro partikel EMAS di foto cita-cita
    function createCitaCitaParticles() {
      const ccContainer = document.getElementById('column-cc');
      const ccParticleCount = 20; 
      
      for (let i = 0; i < ccParticleCount; i++) {
        let p = document.createElement('div');
        p.className = 'cc-particle';
        let size = Math.random() * 5 + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        let duration = Math.random() * 3 + 4;
        p.style.animationDuration = duration + 's';
        let delay = Math.random() * 7;
        p.style.animationDelay = '-' + delay + 's';
        ccContainer.appendChild(p);
      }
    }

    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);
        }
      } catch (error) {
        console.error("Gagal memuat file data-siswa.json:", error);
      }
    }

    function renderStudent(index) {
      // 1. Bersihkan semua sisa antrean pengetikan siswa sebelumnya jika ada
      typingTimeouts.forEach(clearTimeout);
      typingTimeouts = [];

      const card = document.getElementById('student-card');
      const student = studentsData[index];
      
      const elNama = document.getElementById('siswa-nama');
      const elTtl = document.getElementById('siswa-ttl');
      const elOrtu = document.getElementById('siswa-ortu');
      const elNisBox = document.getElementById('siswa-nis-box');
      const elWishBox = document.getElementById('siswa-wish-box');
      const elCitaCita = document.getElementById('siswa-citacita');
      
      const fotoElement = document.getElementById('siswa-foto');
      const fotoCitaCitaElement = document.getElementById('foto-citacita');
      const ccContainer = document.getElementById('column-cc');

      // Reset tampilan awal animasi kartu
      card.classList.remove('active');
      void card.offsetWidth; 
      card.classList.add('active');

      // Sembunyikan elemen cita-cita & foto kanan terlebih dahulu sebelum ngetik kelar
      elWishBox.classList.remove('fade-in-visible');
      ccContainer.classList.remove('show-particles');
      fotoCitaCitaElement.style.opacity = '0';

      // Kosongkan wadah teks biodata sebelum efek ketik dimulai
      elNama.innerText = "";
      elTtl.innerText = "";
      elOrtu.innerText = "";
      elNisBox.innerHTML = "";
      elCitaCita.innerText = student.cita_cita || "-";

      // Siapkan string data teks lengkap
      const textNama = student.nama;
      const textTtl = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      const textOrtu = `${hubunganOrtu} ${student.orang_tua}`;
      const textNisNisn = `NIS: ${student.nis} | NISN: ${student.nisn}`;

      // Memuat berkas gambar profil & cita-cita di balik layar
      fotoElement.style.opacity = '0';
      const separator = student.foto_url.includes('?') ? '&' : '?';
      const timestamp = 't=' + new Date().getTime();
      fotoElement.src = student.foto_url + separator + timestamp;
      fotoElement.onload = () => fotoElement.style.opacity = '1';

      const urlFotoCitaCitaRaw = student.foto_citacita_url || student.foto_url;
      const separatorCC = urlFotoCitaCitaRaw.includes('?') ? '&' : '?';
      fotoCitaCitaElement.src = urlFotoCitaCitaRaw + separatorCC + timestamp;

      // ==========================================
      // ALUR EKSEKUSI MENGETIK BERUNTUN (SEQUENTIAL)
      // ==========================================
      
      // Langkah 1: Ketik Nama
      typeEffect(elNama, textNama, 40, () => {
        
        // Langkah 2: Ketik Tempat Tanggal Lahir (setelah nama selesai)
        typeEffect(elTtl, textTtl, 30, () => {
          
          // Langkah 3: Ketik Hubungan Orang Tua
          typeEffect(elOrtu, textOrtu, 30, () => {
            
            // Langkah 4: Ketik Informasi NIS & NISN
            // Membuat elemen span baru agar kursor ketik terfokus rapi
            let nisSpan = document.createElement('span');
            elNisBox.appendChild(nisSpan);
            
            typeEffect(nisSpan, textNisNisn, 25, () => {
              
              // Langkah 5: Efek Ketik Selesai! Saatnya Cita-Cita & Foto Memudar Masuk Harmonis
              elWishBox.classList.add('fade-in-visible');
              fotoCitaCitaElement.style.opacity = '0.95';
              ccContainer.classList.add('show-particles'); // Mengaktifkan semburan emas melayang
              
            });
          });
        });
      });
    }

    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      renderStudent(currentIndex);
    }

    function prevStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex - 1 + studentsData.length) % studentsData.length;
      renderStudent(currentIndex);
    }

    function startPresentation() {
      overlay.style.display = 'none';
      bgMusic.play().catch(error => console.log("Musik tertahan browser:", error));
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStudentsData();
      createGlobalParticles();
      createCitaCitaParticles(); 
    });
  </script>
</body>
</html>
