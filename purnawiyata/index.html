<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE UMUM & STRUKTUR HALAMAN
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c08; 
      background: linear-gradient(to right, #2b1f0d, #0f0c08, #2b1f0d);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Tampilan Konten Utama (Prosesi Siswa) disembunyikan di awal */
    #main-gallery-content {
      display: none;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    /* ==========================================================================
       STYLE DARI FILE: opening.html
       ========================================================================== */
    #opening-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0f0c08;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #particle-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      display: none;
      pointer-events: none;
    }

    .video-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    #video-bg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: none;
      cursor: pointer;
    }

    .overlay-dark {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.35);
      z-index: 3;
      display: none;
      pointer-events: none;
    }

    .interface-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #fff;
    }

    .card-start {
      border: 2px solid #d4af37;
      padding: 40px;
      background: rgba(26, 21, 14, 0.95);
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    }

    .card-start h1 {
      color: #d4af37;
      margin-bottom: 10px;
      letter-spacing: 2px;
      font-size: 2rem;
    }

    .card-start p {
      color: #e0e0e0;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }

    .btn-gold {
      padding: 15px 40px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      color: #0f0c08;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-gold:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(243, 229, 171, 0.6);
    }

    .btn-skip {
      position: fixed;
      bottom: 40px;
      right: 40px;
      background: rgba(15, 12, 8, 0.5);
      border-radius: 50%;
      width: 70px;
      height: 70px;
      border: none;
      color: #f3e5ab;
      cursor: pointer;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      font-size: 3rem;
      font-weight: bold;
      opacity: 0.7;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
      user-select: none;
    }

    .btn-skip:hover {
      opacity: 0.95;
      color: #ffffff;
      transform: scale(1.1) translateX(5px);
    }

    /* ==========================================================================
       STYLE DARI FILE: prosesi siswa.html
       ========================================================================== */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212,175,55,0.8) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
      z-index: 1;
      will-change: transform;
    }

    @keyframes floatParticles {
      0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .music-control-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 12, 8, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      margin-right: 25px;
      justify-content: center;
    }

    .btn-music-toggle {
      background: none;
      border: none;
      color: #f3e5ab;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .btn-music-toggle:hover {
      color: #ffffff;
      transform: scale(1.1);
    }

    .audio-visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 1px; 
      flex: 1;
      height: 24px; 
      pointer-events: none;
    }

    .visualizer-bar {
      flex: 1;
      max-width: 2px; 
      background: linear-gradient(to top, #a67c1e, #f3e5ab, #ffffff);
      height: 2px;
      border-radius: 1px 1px 0 0;
      transition: height 0.04s ease;
      opacity: 0.85;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1600px; 
      min-height: 90vh; 
      margin: auto 0;
      z-index: 10;
      position: relative;
    }

    /* FIX BINGKAI JEDUG/GLITCH: Menggunakan solid border mewah dengan efek denyut animasi */
    .purnawiyata-card {
      display: flex;
      width: 100%;
      height: 100%; 
      min-height: 650px;
      background: linear-gradient(135deg, #16120b 0%, #282012 50%, #16120b 100%);
      border-radius: 25px;
      overflow: hidden;
      position: relative;
      border: 4px solid #d4af37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25), 0 25px 60px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transform: translateY(30px);
      animation: goldGlowPulse 4s infinite alternate;
    }

    @keyframes goldGlowPulse {
      0% { border-color: #a67c1e; box-shadow: 0 0 20px rgba(166, 124, 30, 0.3), 0 25px 60px rgba(0, 0, 0, 0.8); }
      100% { border-color: #f3e5ab; box-shadow: 0 0 40px rgba(243, 229, 171, 0.5), 0 25px 60px rgba(0, 0, 0, 0.8); }
    }

    .card-content-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 22px;
      overflow: hidden;
      z-index: 2;
    }

    .column-left {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #d4af37, #aa7c11, #f3e5ab);
      padding: 40px;
      position: relative;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
      gap: 15px;
    }

    .photo-frame {
      width: 100%;
      height: 380px; 
      border: 6px solid #fff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
      background: #333;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 35%;
      background: linear-gradient(to top, rgba(15, 12, 8, 0.9) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .absen-label {
      background: rgba(15, 12, 8, 0.85);
      color: #f3e5ab;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
      width: 90%;
      margin-right: 25px; 
      text-transform: uppercase;
    }
    .absen-label span { color: #ffffff; }

    .column-center {
      flex: 1;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      overflow: hidden;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .school-logo {
      width: 75px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.5));
    }

    .logo-ppss {
      width: 175px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.5));
    }

    .header-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .identity-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; 
      margin: 20px 0;
      position: relative; 
      perspective: 1000px; 
    }

    /* FIX TEXT HILANG: Menghapus properti mask-image total agar text aman & terbaca */
    .spotlight-container {
      position: absolute;
      top: 0; left: -20px;
      width: calc(100% + 40px);
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .spotlight-container::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 50%;
      background: linear-gradient(to bottom, transparent, #1d1810);
      pointer-events: none;
      z-index: 3;
    }

    .spotlight-container::before {
      content: '';
      position: absolute;
      top: 0; left: 5%; width: 90%; height: 6px;
      background: linear-gradient(to right, #1f1a12, #554422, #a67c1e, #554422, #1f1a12);
      border-radius: 0 0 10px 10px;
      box-shadow: 0 2px 12px rgba(212, 175, 55, 0.4), 0 0 20px rgba(0, 0, 0, 0.9);
      z-index: 5;
    }

    .spotlight-source {
      position: absolute;
      top: 4px;
      width: 42px; height: 12px;
      background: linear-gradient(to bottom, #ffffff, #f3e5ab);
      border-radius: 50%;
      box-shadow: 0 0 25px 12px #f3e5ab, 0 0 50px 25px rgba(212, 175, 55, 0.4);
      z-index: 4;
      filter: blur(0.5px);
    }
    .source-1 { left: 12%; }
    .source-2 { left: 37%; }
    .source-3 { right: 37%; }
    .source-4 { right: 12%; }

    .spotlight {
      position: absolute;
      top: 6px;
      width: 350px; height: 130%;
      background: radial-gradient(ellipse at top, rgba(255, 246, 212, 0.22) 0%, rgba(212, 175, 55, 0.05) 35%, rgba(212, 175, 55, 0.01) 55%, transparent 75%);
      clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
      transform-origin: top center;
      filter: blur(12px); 
      mix-blend-mode: screen; 
    }

    .spotlight-1 { left: -8%; animation: stageSwing1 8s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite alternate; }
    .spotlight-2 { left: 22%; animation: stageSwing2 11s cubic-bezier(0.39, 0.575, 0.565, 1) infinite alternate; }
    .spotlight-3 { right: 22%; animation: stageSwing3 9s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite alternate; }
    .spotlight-4 { right: -8%; animation: stageSwing4 7s cubic-bezier(0.39, 0.575, 0.565, 1) infinite alternate; }

    @keyframes stageSwing1 {
      0% { transform: rotateX(15deg) rotateZ(-20deg) scaleX(0.85); opacity: 0.4; }
      100% { transform: rotateX(25deg) rotateZ(6deg) scaleX(1.15); opacity: 0.85; }
    }
    @keyframes stageSwing2 {
      0% { transform: rotateX(20deg) rotateZ(10deg) scaleX(1.15); opacity: 0.75; }
      100% { transform: rotateX(10deg) rotateZ(-12deg) scaleX(0.75); opacity: 0.35; }
    }
    @keyframes stageSwing3 {
      0% { transform: rotateX(10deg) rotateZ(-12deg) scaleX(0.75); opacity: 0.35; }
      100% { transform: rotateX(25deg) rotateZ(14deg) scaleX(1.15); opacity: 0.85; }
    }
    @keyframes stageSwing4 {
      0% { transform: rotateX(25deg) rotateZ(16deg) scaleX(1.05); opacity: 0.85; }
      100% { transform: rotateX(15deg) rotateZ(-8deg) scaleX(0.85); opacity: 0.4; }
    }

    .spotlight-dust {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px #fff;
      pointer-events: none;
      animation: ambientDust linear infinite;
      opacity: 0;
    }
    @keyframes ambientDust {
      0% { transform: translateY(350px) translateX(0) scale(0.2); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-30px) translateX(30px) scale(0.9); opacity: 0; }
    }

    .name-container, .ttl-container, .ortu-container, .nis-container, .wish-container {
      position: relative;
      z-index: 2;
    }

    .name-container {
      min-height: 110px;
      height: auto;
      display: flex;
      align-items: center;
      position: relative;
      padding-bottom: 15px;
    }

    #siswa-nama {
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
      word-spacing: 4px;
      text-transform: uppercase;
      padding-bottom: 8px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
      width: 100%;
      position: relative;
      display: inline-block;
    }

    #siswa-nama::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(to right, #a67c1e 0%, #f3e5ab 25%, #d4af37 50%, #f3e5ab 75%, #a67c1e 100%);
      background-size: 200% auto;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.8), 0 0 4px rgba(243, 229, 171, 0.5);
      border-radius: 2px;
      animation: goldLineFlow 3s linear infinite;
    }

    @keyframes goldLineFlow {
      0% { background-position: 0% center; }
      100% { background-position: -200% center; }
    }

    .typing-cursor::after {
      content: '|';
      color: #d4af37;
      animation: blink 0.7s infinite;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .ttl-container { height: 35px; display: flex; align-items: center; margin-top: 10px; }
    #siswa-ttl { font-size: 1.4rem; color: #e0e0e0; font-weight: 500; }

    .ortu-container { height: 35px; display: flex; align-items: center; }
    .sub-detail { font-size: 1.5rem; font-style: italic; color: #f3e5ab; }

    .nis-container { height: 40px; display: flex; align-items: center; }
    
    .nis-box { 
      font-size: 1.2rem; 
      color: #ffffff !important; 
      font-weight: 700; 
      letter-spacing: 0.5px;
      text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 14px;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .wish-container { height: 65px; display: flex; align-items: center; margin-top: 15px; }
    
    .wish-box {
      font-size: 1.3rem;
      color: #ffffff;
      background: rgba(212, 175, 55, 0.15);
      padding: 10px 22px;
      border-left: 4px solid #d4af37;
      border-radius: 0 5px 5px 0;
      opacity: 0; 
      width: auto;
    }
    .wish-box.fade-in-visible { opacity: 1; } 
    .wish-box span { color: #f3e5ab; font-weight: bold; }

    .footer-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1.3;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 15px;
      flex-shrink: 0;
    }
    .footer-title span { color: #d4af37; font-size: 1.65rem; font-weight: 800; }

    .column-right {
      width: 480px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
      background: #110d08;
    }

    .column-right::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 35%;
      background: linear-gradient(to top, #16120b 10%, rgba(22, 18, 11, 0.6) 50%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .image-reveal-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .image-reveal-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 35%; height: 100%;
      background: linear-gradient(to right, #16120b 0%, rgba(22, 18, 11, 0.4) 60%, transparent 100%);
      z-index: 5;
      pointer-events: none;
    }

    .img-base-bw {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.7) contrast(1.1);
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      z-index: 2;
    }

    .img-reveal-color {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      z-index: 3;
      opacity: 0;
    }

    .reveal-active .img-reveal-color { opacity: 1; }

    .cc-particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255, 232, 156, 0.95) 0%, rgba(212, 175, 55, 0.5) 40%, rgba(212, 175, 55, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 6; 
      animation: floatUpCC linear infinite;
      filter: drop-shadow(0 0 4px rgba(243, 229, 171, 0.6));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .show-particles .cc-particle { opacity: 1; }

    @keyframes floatUpCC {
      0% { top: 105%; transform: scale(0.3) translateX(0); opacity: 0; }
      15% { opacity: 0.8; }
      50% { transform: scale(0.7) translateX(15px); }
      85% { opacity: 0.6; }
      100% { top: -10%; transform: scale(1.2) translateX(-15px) opacity: 0; }
    }

    .nav-container { display: contents; }

    .btn-nav-arrow {
      position: fixed;
      bottom: 25px;
      background: rgba(15, 12, 8, 0.6); 
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      width: 75px;
      height: 75px;
      color: #d4af37;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      user-select: none;
      z-index: 100;
      opacity: 0.7; 
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .btn-nav-arrow[aria-label="Siswa Sebelumnya"] { left: 25px; }
    .btn-nav-arrow[aria-label="Siswa Selanjutnya"] { right: 25px; }

    .btn-nav-arrow:hover, .btn-nav-arrow:active {
      color: #f3e5ab;
      opacity: 0.95;
      background: rgba(15, 12, 8, 0.9);
      transform: scale(1.05);
    }

    .purnawiyata-card.active {
      animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.97) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Responsif Layar Hp / Mobile */
    @media (max-width: 950px) {
      body { overflow-y: auto; }
      #main-gallery-content { padding-bottom: 80px; }
      .main-container { height: auto; padding-bottom: 80px; margin: 0; }
      .purnawiyata-card { height: auto; min-height: initial; border-width: 2px; }
      .card-content-wrapper { flex-direction: column; }
      .column-left { width: 100%; clip-path: none; padding: 30px; }
      .photo-frame { height: 320px; max-width: 260px; margin: 0 auto; }
      .absen-label { margin-right: 0; width: 100%; max-width: 260px; }
      .music-control-container { margin-right: 0; width: 100%; max-width: 260px; }
      
      .column-center { 
        text-align: center; 
        padding: 30px 20px 40px 20px; 
        align-items: center; 
      }
      
      .logo-wrapper { justify-content: center; }
      .name-container, .ttl-container, .ortu-container, .nis-container, .wish-container { 
        height: auto; 
        min-height: inherit;
        justify-content: center; 
      }
      
      .name-container { min-height: 70px; margin-bottom: 10px; }
      #siswa-nama { font-size: 1.8rem; }
      
      .column-right { height: 320px; width: 100%; }
      .image-reveal-wrapper::after {
        width: 100%; height: 35%;
        background: linear-gradient(to bottom, #16120b 0%, rgba(22, 18, 11, 0.4) 60%, transparent 100%);
      }
      
      .btn-skip { bottom: 20px; right: 20px; font-size: 2.5rem; width: 60px; height: 60px; }
      .btn-nav-arrow { bottom: 15px; font-size: 2.5rem; width: 60px; height: 60px; }
      .btn-nav-arrow[aria-label="Siswa Sebelumnya"] { left: 15px; }
      .btn-nav-arrow[aria-label="Siswa Selanjutnya"] { right: 15px; }
    }
  </style>
</head>
<body>

  <div id="opening-container">
    <canvas id="particle-canvas"></canvas>
    
    <div class="video-wrapper">
      <video id="video-bg" playsinline src="assets/Opening.mp4"></video>
    </div>

    function mulaiProsesiOpening() {
      startInterface.style.display = 'none';
      
      // Mengaktifkan simulasi partikel emas halus di opening
      const openingCanvas = document.getElementById('particle-canvas');
      openingCanvas.style.display = 'block';
      inisialisasiPartikelOpening(openingCanvas);

      videoBg.style.display = 'block';
      videoOverlay.style.display = 'block';
      btnSkip.style.display = 'flex';

      videoBg.play().catch(error => {
        console.log("Autoplay video diblokir browser, dialihkan manual:", error);

      });

      // Jika video selesai berputar otomatis masuk ke panggung galeri utama
      videoBg.onended = () => { menujuGaleriUtama(); };
    }

    function inisialisasiPartikelOpening(canvas) {
      const ctx = canvas.getContext('2d');
      let partikelArray = [];
      
      function setUkuranLayar() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      setUkuranLayar();
      window.addEventListener('resize', setUkuranLayar);

      class PartikelEmas {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height + canvas.height;
          this.size = Math.random() * 3 + 1;
          this.speedY = Math.random() * 1.5 + 0.5;
          this.speedX = Math.random() * 0.6 - 0.3;
          this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.y -= this.speedY;
          this.x += this.speedX;
          if (this.y < -10) {
            this.y = canvas.height + 10;
            this.x = Math.random() * canvas.width;
          }
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = '#f3e5ab';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#d4af37';
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < 60; i++) {
        partikelArray.push(new PartikelEmas());
      }

      function animasiPartikelLoop() {
        if (openingContainer.style.display === 'none') return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < partikelArray.length; i++) {
          partikelArray[i].update();
          partikelArray[i].draw();
        }
        requestAnimationFrame(animasiPartikelLoop);
      }
      animasiPartikelLoop();
    }

    function menujuGaleriUtama() {
      // Menghentikan putaran video & menghilangkan container opening
      videoBg.pause();
      openingContainer.style.style = 'none'; // Cadangan safetynet

      // Memunculkan Panggung Utama Prosesi
      mainGalleryContent.style.display = 'flex';

      bgMusic.play().then(() => {
        membangunBarVisualizerMuzik();

      // Menyalakan generator efek atmosfer panggung utama

      mulaiPartikelDustSpotlight();
      
      // Memuat data siswa pertama (Absen 01)
      tampilkanSiswaSecaraValid(indeksSekarang);
    }

    /* ==========================================================================
       GENERATOR PARTIKEL AMBIENT (ATMOSFER PANGGUNG)
       ========================================================================== */
    function mulaiAtmosferPartikelUtama() {
      particleInterval = setInterval(() => {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        const size = Math.random() * 12 + 4;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}vw`;
        
        const duration = Math.random() * 4 + 5;
        particle.style.animationDuration = `${duration}s`;
        
        mainGalleryContent.appendChild(particle);
        setTimeout(() => { particle.remove(); }, duration * 1000);
      }, 350);
    }

    function mulaiPartikelDustSpotlight() {
      const spotlightBox = document.getElementById('spotlight-box');
      dustInterval = setInterval(() => {
        if(!spotlightBox) return;
        const dust = document.createElement('div');
        dust.classList.add('spotlight-dust');
        
        const size = Math.random() * 3 + 1.5;
        dust.style.width = `${size}px`;
        dust.style.height = `${size}px`;
        dust.style.left = `${Math.random() * 90 + 5}%`;
        
        const duration = Math.random() * 3 + 4;
        dust.style.animationDuration = `${duration}s`;
        
        spotlightBox.appendChild(dust);
        setTimeout(() => { dust.remove(); }, duration * 1000);
      }, 400);
    }

    function generateCitaCitaParticles() {
      const rightColumn = document.getElementById('right-column-reveal');
      // Bersihkan interval partikel cita-cita lama jika ada
      if (ccParticleInterval) clearInterval(ccParticleInterval);
      
      rightColumn.classList.add('show-particles');
      
      ccParticleInterval = setInterval(() => {
        const ccPart = document.createElement('div');
        ccPart.classList.add('cc-particle');
        
        const size = Math.random() * 16 + 6;
        ccPart.style.width = `${size}px`;
        ccPart.style.height = `${size}px`;
        ccPart.style.left = `${Math.random() * 80 + 10}%`;
        
        const duration = Math.random() * 3 + 3;
        ccPart.style.animationDuration = `${duration}s`;
        
        rightColumn.appendChild(ccPart);
        setTimeout(() => { ccPart.remove(); }, duration * 1000);
      }, 250);
    }

    /* ==========================================================================
       KONTROL NAVIGASI DAN RENDER DATA SISWA
       ========================================================================== */
    function tampilkanSiswaSecaraValid(indeks) {
      // Bersihkan seluruh antrean animasi/timeout sebelumnya agar tidak tumpang tindih
      clearTimeout(textTypingTimeout);
      clearTimeout(wishBoxRevealTimeout);
      clearTimeout(imageRevealTimeout);
      if (ccParticleInterval) clearInterval(ccParticleInterval);

      const data = daftarSiswa[indeks];
      const card = document.querySelector('.purnawiyata-card');
      const rightCol = document.getElementById('right-column-reveal');
      const wishBox = document.getElementById('wish-box');
      
      // Reset state animasi awal
      card.classList.remove('active');
      rightCol.classList.remove('reveal-active', 'show-particles');
      wishBox.classList.remove('fade-in-visible');
      void card.offsetWidth; // Trigger reflow CSS
      card.classList.add('active');

      // Memasukkan data tekstual statis
      document.getElementById('siswa-absen').textContent = data.absen;
      document.getElementById('siswa-ttl').textContent = data.ttl;
      document.getElementById('siswa-ortu').textContent = data.ortu;
      document.getElementById('siswa-nis').textContent = data.nis;
      document.getElementById('siswa-cita').textContent = data.cita;

      // Optimasi pre-load render gambar formal & impian
      const imgFormal = document.getElementById('siswa-foto');
      const imgCitaBw = document.getElementById('siswa-foto-cita-bw');
      const imgCitaColor = document.getElementById('siswa-foto-cita-color');

      imgFormal.style.opacity = '0';
      imgCitaBw.style.opacity = '0';
      imgCitaColor.style.opacity = '0';

      imgFormal.src = data.fotoFormal;
      imgCitaBw.src = data.fotoCita;
      imgCitaColor.src = data.fotoCita;

      imgFormal.onload = () => { imgFormal.style.opacity = '1'; };
      imgCitaBw.onload = () => { imgCitaBw.style.opacity = '1'; };

      // Efek Mengetik Otomatis (Typing Effect) Khusus Nama Siswa
      const targetNamaElement = document.getElementById('siswa-nama');
      targetNamaElement.textContent = '';
      targetNamaElement.classList.add('typing-cursor');
      
      let charIdx = 0;
      function jalankanEfekKetik() {
        if (charIdx < data.nama.length) {
          targetNamaElement.textContent += data.nama.charAt(charIdx);
          charIdx++;
          textTypingTimeout = setTimeout(jalankanEfekKetik, 60); // Kecepatan ketik ideal
        } else {
          targetNamaElement.classList.remove('typing-cursor');
          
          // Setelah nama selesai diketik, munculkan kotak cita-cita (Delay 400ms)
          wishBoxRevealTimeout = setTimeout(() => {
            wishBox.classList.add('fade-in-visible');
            
            // Setelah kotak cita-cita muncul, buka warna foto impian/cita-cita (Delay 600ms)
            imageRevealTimeout = setTimeout(() => {
              rightCol.classList.add('reveal-active');
              generateCitaCitaParticles();
            }, 600);

          }, 400);
        }
      }
      
      // Berikan delay awal 500ms sebelum teks nama mulai diketik
      setTimeout(jalankanEfekKetik, 500);
    }

    function nextStudent() {
      indeksSekarang = (indeksSekarang + 1) % daftarSiswa.length;
      tampilkanSiswaSecaraValid(indeksSekarang);
    }

    function prevStudent() {
      indeksSekarang = (indeksSekarang - 1 + daftarSiswa.length) % daftarSiswa.length;
      tampilkanSiswaSecaraValid(indeksSekarang);
    }

    /* ==========================================================================
       MANAJEMEN BACKSOUND MUSIK & AUDIO VISUALIZER
       ========================================================================== */
    function toggleMusicPlayback() {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          musicBtn.setAttribute('aria-label', 'Pause Musik');
        }).catch(err => console.log("Gagal memutar audio:", err));
      } else {
        bgMusic.pause();
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        musicBtn.setAttribute('aria-label', 'Putar Musik');
      }
    }

    function membangunBarVisualizerMuzik() {
      visualizerContainer.innerHTML = '';
      const jumlahBar = 15; // Jumlah batang visualizer proporsional
      const barElements = [];

      for (let i = 0; i < jumlahBar; i++) {
        const bar = document.createElement('div');
        bar.classList.add('visualizer-bar');
        visualizerContainer.appendChild(bar);
        barElements.push(bar);
      }

      function loopSimulasiVisualizer() {
        if (!bgMusic.paused) {
          barElements.forEach(bar => {
            // Membuat kalkulasi tinggi acak naik-turun agar terkesan real-time mengikuti irama
            const tinggiAcak = Math.floor(Math.random() * 20) + 4;
            bar.style.height = `${tinggiAcak}px`;
          });
        } else {
          barElements.forEach(bar => { bar.style.height = '2px'; });
        }
        requestAnimationFrame(loopSimulasiVisualizer);
      }
      loopSimulasiVisualizer();
    }

    /* ==========================================================================
       NAVIGASI KEYBOARD GLOBAL (Mendukung Remote Presentasi / Pointer IFP)
       ========================================================================== */
    window.addEventListener('keydown', (event) => {
      const openingContainerValid = document.getElementById('opening-container');
      
      // 1. KONDISI JIKA MASIH DI HALAMAN OPENING
      if (openingContainerValid) {
        if (startInterface.style.display === 'none') {
          switch(event.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case 'PageDown':
            case 'Enter':
              menujuGaleriUtama();
              break;
          }
        }
      } 
      // 2. KONDISI JIKA SUDAH MASUK KEDALAM GALERI UTAMA
      else if (mainGalleryContent.style.display === 'flex') {
        switch(event.key) {
          case 'ArrowRight':
          case 'ArrowDown':
          case 'PageDown':
          case ' ': // Spacebar / Tombol besar remote klik next
            nextStudent();
            break;
          case 'ArrowLeft':
          case 'ArrowUp':
          case 'PageUp':
            prevStudent();
            break;
        }
      }
    });
  </script>
</body>
</html>
