<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <audio id="bg-music" loop>
    <source src="musik-purnawiyata.mp3" type="audio/mpeg">
  </audio>

  <div id="music-overlay" onclick="startPresentation()">
    <div class="overlay-card">
      <h2>Selamat & Sukses</h2>
      <p>Purnawiyata Ke-III SMP Islam Az-Zahro</p>
      <button class="btn-start">Mulai Presentasi</button>
    </div>
  </div>

  <main class="main-container">
    <div class="purnawiyata-card" id="student-card">
      
      <div class="left-side">
        <div class="photo-frame">
          <img id="siswa-foto" src="" alt="Foto Siswa">
        </div>
      </div>

      <div class="right-side">
        <header class="header-title">SELAMAT & SUKSES</header>
        
        <div class="identity-box">
          <h1 id="siswa-nama" class="animate-text">-</h1>
          <p id="siswa-ttl" class="animate-text">-</p>
          
          <div class="sub-detail animate-text">
            <span id="siswa-ortu">-</span>
          </div>
          
          <div class="nis-box animate-text">
            <span>NIS: <strong id="siswa-nis">-</strong></span> | 
            <span>NISN: <strong id="siswa-nisn">-</strong></span>
          </div>
        </div>

        <footer class="footer-title">
          PURNAWIYATA KE-III<br>
          <span>SMP ISLAM AZ-ZAHRO</span>
        </footer>
      </div>

    </div>

    <div class="navigation-box">
      <button class="btn-nav" onclick="nextStudent()">Selanjutnya ❯</button>
    </div>
  </main>

  <script>
    let studentsData = [];
    let currentIndex = 0;
    const bgMusic = document.getElementById('bg-music');
    const overlay = document.getElementById('music-overlay');

    // Ambil data dari file JSON
    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);
        }
      } catch (error) {
        console.error("Gagal memuat data siswa:", error);
      }
    }

    // Fungsi menampilkan data ke elemen HTML beserta trigger animasi
    function renderStudent(index) {
      const card = document.getElementById('student-card');
      const student = studentsData[index];

      // Reset animasi dengan menghapus dan memicu ulang class
      card.classList.remove('active');
      void card.offsetWidth; // Trigger reflow untuk reset CSS animasi
      card.classList.add('active');

      // Manipulasi data teks & gambar
      document.getElementById('siswa-foto').src = student.foto_url;
      document.getElementById('siswa-nama').textPlain = student.nama; // Aman dari XSS
      document.getElementById('siswa-nama').innerText = student.nama;
      document.getElementById('siswa-ttl').innerText = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      document.getElementById('siswa-nis').innerText = student.nis;
      document.getElementById('siswa-nisn').innerText = student.nisn;

      // Logika Jenis Kelamin
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      document.getElementById('siswa-ortu').innerText = `${hubunganOrtu} ${student.orang_tua}`;
    }

    // Fungsi tombol selanjutnya
    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length; // Kembali ke awal jika data habis
      renderStudent(currentIndex);
    }

    // Fungsi memulai halaman dan memutar musik
    function startPresentation() {
      overlay.style.display = 'none';
      bgMusic.play().catch(error => console.log("Playback dicegah oleh browser:", error));
    }

    // Panggil fungsi muat data saat halaman siap
    window.addEventListener('DOMContentLoaded', loadStudentsData);
  </script>
</body>
</html>
