<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    /* ==========================================================================
       STYLE UMUM & STRUKTUR HALAMAN (OPTIMALISASI IFP 4K 75 INCI)
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c08; 
      background: linear-gradient(to right, #2b1f0d, #0f0c08, #2b1f0d);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #main-gallery-content {
      display: none;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      padding: 50px;
    }

    /* ==========================================================================
       STYLE OPENING
       ========================================================================== */
    #opening-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0f0c08;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #particle-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      display: none;
      pointer-events: none;
    }

    .video-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    #video-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      cursor: pointer;
    }

    .overlay-dark {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.35);
      z-index: 3;
      display: none;
      pointer-events: none;
    }

    .interface-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #fff;
    }

    .card-start {
      border: 3px solid #d4af37;
      padding: 60px 100px;
      background: rgba(26, 21, 14, 0.95);
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
    }

    .card-start h1 {
      color: #d4af37;
      margin-bottom: 15px;
      letter-spacing: 3px;
      font-size: 3.5rem;
    }

    .card-start p {
      color: #e0e0e0;
      margin-bottom: 35px;
      font-size: 1.8rem;
    }

    .btn-gold {
      padding: 20px 60px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      font-size: 1.6rem;
      cursor: pointer;
      border-radius: 40px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      color: #0f0c08;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-gold:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(243, 229, 171, 0.6);
    }

    .btn-skip {
      position: fixed;
      bottom: 50px;
      right: 50px;
      background: none;
      border: none;
      color: #f3e5ab;
      cursor: pointer;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      font-size: 5rem;
      font-weight: bold;
      opacity: 0.4;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
      user-select: none;
    }

    .btn-skip:hover {
      opacity: 0.95;
      color: #ffffff;
      transform: scale(1.15) translateX(5px);
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
    }

    /* ==========================================================================
       STYLE PROSESI SISWA (SISTEM GRID 3 KOLOM SEJAJAR ANTI-BENTROK)
       ========================================================================== */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212,175,55,0.6) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticles linear infinite;
      z-index: 1;
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity;
    }

    @keyframes floatParticles {
      0% { transform: translate3d(0, 105vh, 0) scale(0.3); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translate3d(0, -10vh, 0) scale(1.2); opacity: 0; }
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 3600px; /* Diperlebar penuh untuk resolusi mendatar 4K */
      height: 90vh; 
      z-index: 10;
      position: relative;
    }

    .purnawiyata-card {
      display: flex;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #16120b 0%, #282012 50%, #16120b 100%);
      border-radius: 30px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: translate3d(0, 30px, 0);
      will-change: transform, opacity;
    }

    /* Mengganti conic border putar yang bikin lag/glitch koordinat di layar lebar */
    .purnawiyata-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 4px solid #d4af37;
      border-radius: 30px;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.3), 0 0 30px rgba(212, 175, 55, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .card-content-wrapper {
      display: grid;
      /* Membagi presisi: Kiri 20%, Tengah 55%, Kanan 25% (Total 100% Mengunci Sempurna) */
      grid-template-columns: 20% 55% 25%; 
      width: 100%;
      height: 100%;
      background: inherit;
      overflow: hidden;
      z-index: 2;
    }

    /* --- KOLOM KIRI (FOTO PROFIL & NAVIGASI MUSIK) --- */
    .column-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(45deg, #d4af37, #aa7c11, #f3e5ab);
      padding: 50px 30px;
      position: relative;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
      z-index: 5;
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 3 / 4; /* Mengunci rasio foto standar panggung */
      border: 8px solid #fff;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      border-radius: 16px;
      overflow: hidden;
      background: #221c13;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 25%;
      background: linear-gradient(to top, rgba(15, 12, 8, 0.7) 0%, transparent 100%);
      pointer-events: none;
    }

    .absen-label {
      background: rgba(15, 12, 8, 0.9);
      color: #f3e5ab;
      padding: 14px 20px;
      border-radius: 40px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      text-align: center;
      width: 100%;
      text-transform: uppercase;
    }
    .absen-label span { color: #ffffff; }

    .music-control-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(15, 12, 8, 0.85);
      padding: 12px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      width: 100%;
      justify-content: center;
    }

    .btn-music-toggle {
      background: none;
      border: none;
      color: #f3e5ab;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .btn-music-toggle svg { width: 26px; height: 26px; }
    .btn-music-toggle:hover { color: #ffffff; transform: scale(1.1); }

    .audio-visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px; 
      flex: 1;
      height: 30px; 
      pointer-events: none;
    }

    .visualizer-bar {
      flex: 1;
      max-width: 4px; 
      background: linear-gradient(to top, #a67c1e, #f3e5ab, #ffffff);
      height: 4px;
      border-radius: 2px 2px 0 0;
      transition: height 0.04s ease;
      opacity: 0.85;
      will-change: height;
    }

    /* --- KOLOM TENGAH (BIODATA UTAMA SISWA) --- */
    .column-center {
      padding: 50px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      overflow: hidden;
      background: rgba(15, 12, 8, 0.15);
      z-index: 4;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .school-logo {
      width: 110px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.6));
    }

    .logo-ppss {
      width: 250px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.6));
    }

    .header-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
    }

    .identity-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; 
      margin: 30px 0;
      position: relative; 
    }

    /* Spotlight Stage Efek 2D ringkas agar terbebas dari rendering blink-glitch GPU */
    .spotlight-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .spotlight-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to right, transparent, #a67c1e, #f3e5ab, #a67c1e, transparent);
    }

    .spotlight {
      position: absolute;
      top: 0; width: 450px; height: 150%;
      background: radial-gradient(ellipse at top, rgba(255, 246, 212, 0.15) 0%, rgba(212, 175, 55, 0.02) 50%, transparent 75%);
      clip-path: polygon(48% 0, 52% 0, 100% 100%, 0 100%);
      transform-origin: top center;
      filter: blur(15px);
      transform: translate3d(0,0,0);
      will-change: transform;
    }

    .spotlight-1 { left: -10%; animation: stageSwing1 10s ease-in-out infinite alternate; }
    .spotlight-2 { left: 25%; animation: stageSwing2 12s ease-in-out infinite alternate; }
    .spotlight-3 { right: 25%; animation: stageSwing3 11s ease-in-out infinite alternate; }
    .spotlight-4 { right: -10%; animation: stageSwing4 9s ease-in-out infinite alternate; }

    @keyframes stageSwing1 { 0% { transform: rotate(-15deg); opacity: 0.3; } 100% { transform: rotate(5deg); opacity: 0.7; } }
    @keyframes stageSwing2 { 0% { transform: rotate(8deg); opacity: 0.6; } 100% { transform: rotate(-10deg); opacity: 0.3; } }
    @keyframes stageSwing3 { 0% { transform: rotate(-8deg); opacity: 0.3; } 100% { transform: rotate(12deg); opacity: 0.7; } }
    @keyframes stageSwing4 { 0% { transform: rotate(12deg); opacity: 0.7; } 100% { transform: rotate(-5deg); opacity: 0.3; } }

    .spotlight-dust {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 8px 3px #fff;
      pointer-events: none;
      animation: ambientDust linear infinite;
      opacity: 0;
      transform: translate3d(0,0,0);
      will-change: transform, opacity;
    }
    @keyframes ambientDust {
      0% { transform: translate3d(0, 400px, 0) scale(0.3); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.4; }
      100% { transform: translate3d(50px, -20px, 0) scale(1); opacity: 0; }
    }

    /* KONTROL AMBANG TRANSISI TEXT FADE-IN */
    .name-container, .ttl-container, .ortu-container, .nis-container, .wish-container {
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translate3d(0, 20px, 0);
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1), transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, opacity;
    }

    .fade-in-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .name-container {
      min-height: 150px;
      display: flex;
      align-items: center;
      padding-bottom: 20px;
    }

    #siswa-nama {
      font-size: 4.8rem; /* Ukuran Ekstra Besar Khusus Display IFP 75" */
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 12px;
      line-height: 1.2;
      white-space: pre-wrap;
      word-wrap: break-word;
      width: 100%;
      position: relative;
    }

    #siswa-nama::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 5px;
      background: linear-gradient(to right, #a67c1e 0%, #f3e5ab 25%, #d4af37 50%, #f3e5ab 75%, #a67c1e 100%);
      background-size: 200% auto;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.8);
      border-radius: 3px;
      animation: goldLineFlow 4s linear infinite;
    }

    @keyframes goldLineFlow { 0% { background-position: 0% center; } 100% { background-position: -200% center; } }

    .ttl-container { height: 50px; display: flex; align-items: center; margin-top: 20px; }
    #siswa-ttl { font-size: 2.5rem; color: #e5e5e5; font-weight: 500; }

    .ortu-container { height: 50px; display: flex; align-items: center; }
    .sub-detail { font-size: 2.6rem; font-style: italic; color: #f3e5ab; }

    .nis-container { height: 60px; display: flex; align-items: center; margin-top: 15px; }
    
    .nis-box { 
      font-size: 2rem; 
      color: #ffffff !important; 
      font-weight: 700; 
      letter-spacing: 1px;
      text-shadow: 0px 3px 6px rgba(0,0,0,0.8);
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 24px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    .wish-container { height: 100px; display: flex; align-items: center; margin-top: 30px; }
    
    .wish-box {
      font-size: 2.2rem;
      color: #ffffff;
      background: rgba(212, 175, 55, 0.15);
      padding: 18px 35px;
      border-left: 8px solid #d4af37;
      border-radius: 0 10px 10px 0;
      width: auto;
    }
    .wish-box span { color: #f3e5ab; font-weight: bold; }

    .footer-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1.4;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      padding-top: 25px;
      flex-shrink: 0;
    }
    .footer-title span { color: #d4af37; font-size: 2.6rem; font-weight: 800; }

    /* --- KOLOM KANAN (KOLASE VISUAL CITA-CITA) --- */
    .column-right {
      position: relative;
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
      background: #110d08;
      border-left: 1px solid rgba(212, 175, 55, 0.2);
      z-index: 3;
    }

    .column-right::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 35%;
      background: linear-gradient(to top, #16120b 10%, rgba(22, 18, 11, 0.6) 50%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .image-reveal-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .img-base-bw {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.6) contrast(1.1);
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      z-index: 2;
    }

    .img-reveal-color {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .reveal-active .img-reveal-color { opacity: 1; }

    .cc-particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255, 232, 156, 0.9) 0%, rgba(212, 175, 55, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 6; 
      animation: floatUpCC linear infinite;
      opacity: 0;
      transition: opacity 0.4s ease;
      transform: translate3d(0,0,0);
      will-change: transform, opacity;
    }

    .show-particles .cc-particle { opacity: 1; }

    @keyframes floatUpCC {
      0% { transform: translate3d(0, 105%, 0) scale(0.3); opacity: 0; }
      15% { opacity: 0.8; }
      50% { transform: translate3d(20px, 50%, 0) scale(0.7); }
      85% { opacity: 0.6; }
      100% { transform: translate3d(-20px, -10%, 0) scale(1.2); opacity: 0; }
    }

    /* NAVIGASI TOMBOL TOUCHSCREEN PANAH BESAR */
    .btn-nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 12, 8, 0.5);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      color: #d4af37;
      font-size: 4.5rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100px;
      height: 100px;
      transition: all 0.3s ease;
      user-select: none;
      z-index: 100;
      opacity: 0.6;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
    }

    .btn-nav-arrow[aria-label="Siswa Sebelumnya"] { left: 40px; padding-right: 10px; }
    .btn-nav-arrow[aria-label="Siswa Selanjutnya"] { right: 40px; padding-left: 10px; }

    .btn-nav-arrow:hover {
      color: #f3e5ab;
      opacity: 1;
      background: rgba(15, 12, 8, 0.9);
      border-color: #d4af37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
    }

    .purnawiyata-card.active {
      animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.98) translate3d(0, 30px, 0); }
      100% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
    }

    /* RESPONSIVE LAYOUT HP / TABLET */
    @media (max-width: 1200px) {
      body { overflow-y: auto; }
      #main-gallery-content { padding: 20px; height: auto; }
      .main-container { height: auto; padding-bottom: 100px; }
      .purnawiyata-card { height: auto; }
      .card-content-wrapper { grid-template-columns: 100%; }
      .column-left { width: 100%; padding: 40px; }
      .photo-frame { height: 400px; max-width: 320px; }
      .column-center { padding: 40px 30px; text-align: center; align-items: center; }
      .logo-wrapper { justify-content: center; }
      #siswa-nama { font-size: 2.8rem; }
      #siswa-nama::after { height: 3px; }
      #siswa-ttl { font-size: 1.6rem; }
      .sub-detail { font-size: 1.7rem; }
      .nis-box { font-size: 1.3rem; }
      .wish-box { font-size: 1.4rem; }
      .footer-title { font-size: 1.5rem; }
      .footer-title span { font-size: 1.8rem; }
      .column-right { height: 400px; width: 100%; border-left: none; border-top: 1px solid rgba(212, 175, 55, 0.2); }
      .btn-nav-arrow { width: 70px; height: 70px; font-size: 2.5rem; top: auto; bottom: 20px; transform: none; }
      .btn-nav-arrow[aria-label="Siswa Sebelumnya"] { left: 20px; }
      .btn-nav-arrow[aria-label="Siswa Selanjutnya"] { right: 20px; }
    }
  </style>
</head>
<body>

  <div id="opening-container">
    <canvas id="particle-canvas"></canvas>

    <div class="video-wrapper">
      <video id="video-bg" playsinline loop onclick="togglePlayPause()">
        <source src="https://azzahrolocare.github.io/data/purnawiyata/files/opening3.mp4" type="video/mp4">
        Browser tidak mendukung video HTML5.
      </video>
    </div>

    <div class="overlay-dark" id="overlay-dark"></div>

    <div class="interface-container" id="start-interface">
      <div class="card-start">
        <h1>SELAMAT & SUKSES</h1>
        <p>Purnawiyata Ke-III SMP Islam Az-Zahro</p>
        <button class="btn-gold" onclick="mulaiVideoSinematik()">Putar Video Pembuka</button>
      </div>
    </div>

    <button class="btn-skip" id="btn-skip" onclick="menujuGaleriUtama()" title="Masuk Ke Galeri Siswa">❯</button>
  </div>

  <audio id="bg-music" loop preload="auto" crossorigin="anonymous">
    <source src="https://azzahrolocare.github.io/data/purnawiyata/graduation-anthem.mp3" type="audio/mpeg">
  </audio>

  <div id="main-gallery-content">
    <main class="main-container">
      <div class="purnawiyata-card" id="student-card">
        
        <div class="card-content-wrapper">
          
          <div class="column-left">
            <div class="photo-frame">
              <img id="siswa-foto" src="" alt="Foto Profil Siswa">
            </div>

            <div class="absen-label" id="siswa-absen-box">
              No. Absen: <span id="num-absen">00</span> / <span id="total-absen">00</span> Siswa
            </div>

            <div class="music-control-container">
              <button class="btn-music-toggle" onclick="toggleMusic()" id="music-btn" aria-label="Pause Musik">
                <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h4z"/></svg>
                <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
              </button>

              <div class="audio-visualizer" id="visualizer">
                <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
              </div>
            </div>
          </div>

          <div class="column-center">
            <div class="brand-header">
              <div class="logo-wrapper">
                <img class="school-logo" src="https://github.com/masrahmat-id/absensi-barcode-online-smp-smk-azzahro/raw/main/logo-smp-azzahro.png" alt="Logo SMP Islam Az-Zahro">
                <img class="logo-ppss" src="https://azzahrolocare.github.io/media/logo/PPSS-Az-Zahro.png" alt="Logo PPSS Az-Zahro">
              </div>
              <header class="header-title">SELAMAT & SUKSES</header>
            </div>
            
            <div class="identity-box">
              <div class="spotlight-container" id="identity-spotlight-zone">
                <div class="spotlight spotlight-1"></div>
                <div class="spotlight spotlight-2"></div>
                <div class="spotlight spotlight-3"></div>
                <div class="spotlight spotlight-4"></div>
              </div>

              <div class="name-container" id="cont-nama">
                <h1 id="siswa-nama">-</h1>
              </div>
              
              <div class="ttl-container" id="cont-ttl">
                <p id="siswa-ttl"></p>
              </div>
              
              <div class="ortu-container" id="cont-ortu">
                <div class="sub-detail" id="siswa-ortu"></div>
              </div>
              
              <div class="nis-container" id="cont-nis">
                <div class="nis-box" id="siswa-nis-box"></div>
              </div>

              <div class="wish-container" id="cont-wish">
                <div class="wish-box" id="siswa-wish-box">
                  Cita-cita: <span id="siswa-citacita">-</span>
                </div>
              </div>
            </div>

            <footer class="footer-title">
              PURNAWIYATA KE-III<br>
              <span>SMP ISLAM AZ-ZAHRO</span><br>
              <small style="font-size: 1.4rem; letter-spacing: 1px; color: #e0e0e0; font-weight: 500; display: inline-block; margin-top: 6px;">Tahun Pelajaran 2025/2026</small>
            </footer>
          </div>

          <div class="column-right" id="column-cc">
            <div class="image-reveal-wrapper">
              <img id="foto-citacita-bw" class="img-base-bw" src="" alt="Cita-cita Hitam Putih">
              <img id="foto-citacita-color" class="img-reveal-color" src="" alt="Cita-cita Berwarna">
            </div>
          </div>

        </div>
      </div>

      <div class="nav-container">
        <button class="btn-nav-arrow" onclick="prevStudent()" aria-label="Siswa Sebelumnya">❮</button>
        <button class="btn-nav-arrow" onclick="nextStudent()" aria-label="Siswa Selanjutnya">❯</button>
      </div>
    </main>
  </div>

  <script>
    const video = document.getElementById('video-bg');
    const startInterface = document.getElementById('start-interface');
    const overlayDark = document.getElementById('overlay-dark');
    const btnSkip = document.getElementById('btn-skip');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const openingContainer = document.getElementById('opening-container');
    const mainGalleryContent = document.getElementById('main-gallery-content');

    let studentsData = [];
    let currentIndex = 0;
    let fadeTimeouts = []; 
    const bgMusic = document.getElementById('bg-music');
    
    let audioCtx, analyser, bufferLength, dataArray;
    let visualizerAnimationId;

    let particlesArray = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * -1 - 0.4; 
        this.alpha = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37';
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      resizeCanvas();
      particlesArray = [];
      for (let i = 0; i < 35; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    function mulaiVideoSinematik() {
      startInterface.style.display = 'none';
      video.style.display = 'block';
      overlayDark.style.display = 'block';
      btnSkip.style.display = 'flex'; 
      canvas.style.display = 'block';
      
      initParticles();
      animateParticles();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      }

      video.muted = false; 
      video.play().catch(error => {
        console.log("Gagal memutar video: ", error);
        menujuGaleriUtama();
      });

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      } catch(e) { console.log(e); }
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function menujuGaleriUtama() {
      video.pause();
      openingContainer.style.display = 'none';
      mainGalleryContent.style.display = 'flex';

      createGlobalParticles();
      createSpotlightDust(); 
      createCitaCitaParticles(); 
      
      loadStudentsData();
      initVisualizer();

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      bgMusic.play().catch(error => {
        console.log("Musik tertahan browser policy.", error);
      });
    }

    function padZero(num) {
      return num < 10 ? '0' + num : num;
    }

    function sequentialFadeIn(containers) {
      containers.forEach((item) => {
        let timer = setTimeout(() => {
          item.el.classList.add('fade-in-visible');
          if (item.callback) item.callback();
        }, item.delay);
        fadeTimeouts.push(timer);
      });
    }

    function createGlobalParticles() {
      const particleCount = 12; 
      for (let i = 0; i < particleCount; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        let size = Math.random() * 5 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + 'vw';
        let duration = Math.random() * 8 + 7;
        particle.style.animationDuration = duration + 's';
        let delay = Math.random() * 5;
        particle.style.animationDelay = delay + 's';
        document.body.appendChild(particle);
      }
    }

    function createSpotlightDust() {
      const zone = document.getElementById('identity-spotlight-zone');
      const dustCount = 5;
      for (let i = 0; i < dustCount; i++) {
        let dust = document.createElement('div');
        dust.className = 'spotlight-dust';
        let size = Math.random() * 3 + 1.5;
        dust.style.width = size + 'px';
        dust.style.height = size + 'px';
        dust.style.left = (Math.random() * 80 + 10) + '%';
        dust.style.animationDuration = (Math.random() * 4 + 5) + 's';
        dust.style.animationDelay = '-' + (Math.random() * 5) + 's';
        zone.appendChild(dust);
      }
    }

    function createCitaCitaParticles() {
      const ccContainer = document.getElementById('column-cc');
      const ccParticleCount = 6; 
      
      for (let i = 0; i < ccParticleCount; i++) {
        let p = document.createElement('div');
        p.className = 'cc-particle';
        let size = Math.random() * 4 + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        let duration = Math.random() * 3 + 5;
        p.style.animationDuration = duration + 's';
        let delay = Math.random() * 6;
        p.style.animationDelay = '-' + delay + 's';
        ccContainer.appendChild(p);
      }
    }

    async function loadStudentsData() {
      try {
        const response = await fetch('data-siswa.json');
        studentsData = await response.json();
        if(studentsData.length > 0) {
          renderStudent(0);
        }
      } catch (error) {
        console.error("Gagal memuat berkas data-siswa.json:", error);
      }
    }

    function renderStudent(index) {
      fadeTimeouts.forEach(clearTimeout);
      fadeTimeouts = [];

      const card = document.getElementById('student-card');
      const student = studentsData[index];
      
      const cNama = document.getElementById('cont-nama');
      const cTtl = document.getElementById('cont-ttl');
      const cOrtu = document.getElementById('cont-ortu');
      const cNis = document.getElementById('cont-nis');
      const cWish = document.getElementById('cont-wish');

      const elNama = document.getElementById('siswa-nama');
      const elTtl = document.getElementById('siswa-ttl');
      const elOrtu = document.getElementById('siswa-ortu');
      const elNisBox = document.getElementById('siswa-nis-box');
      const elCitaCita = document.getElementById('siswa-citacita');
      
      const elNumAbsen = document.getElementById('num-absen');
      const elTotalAbsen = document.getElementById('total-absen');

      const fotoElement = document.getElementById('siswa-foto');
      const fotoBw = document.getElementById('foto-citacita-bw');
      const fotoColor = document.getElementById('foto-citacita-color');
      const ccContainer = document.getElementById('column-cc');

      card.classList.remove('active');
      ccContainer.classList.remove('reveal-active', 'show-particles');
      
      cNama.classList.remove('fade-in-visible');
      cTtl.classList.remove('fade-in-visible');
      cOrtu.classList.remove('fade-in-visible');
      cNis.classList.remove('fade-in-visible');
      cWish.classList.remove('fade-in-visible');

      void card.offsetWidth; 
      card.classList.add('active');

      elNumAbsen.innerText = padZero(index + 1);
      elTotalAbsen.innerText = padZero(studentsData.length);

      const textNama = student.nama;
      const textTtl = `${student.tempat_lahir}, ${student.tanggal_lahir}`;
      const hubunganOrtu = student.jk.toUpperCase() === 'P' ? 'Putri dari' : 'Putra dari';
      const textOrtu = `${hubunganOrtu} ${student.orang_tua}`;

      elNama.textContent = textNama;
      elTtl.textContent = textTtl;
      elOrtu.textContent = textOrtu;
      elNisBox.textContent = `NIS: ${student.nis} | NISN: ${student.nisn}`;
      elCitaCita.innerText = student.cita_cita || "-";

      fotoElement.style.opacity = '0';
      fotoElement.src = student.foto_profil_url;
      fotoElement.onload = () => fotoElement.style.opacity = '1';

      fotoBw.style.opacity = '0';
      const finalCCUrl = student.foto_cita_cita_url || student.foto_profil_url;
      
      fotoBw.src = finalCCUrl;
      fotoColor.src = finalCCUrl;
      fotoBw.onload = () => { fotoBw.style.opacity = '1'; };

      sequentialFadeIn([
        { el: cNama, delay: 100 },
        { el: cTtl, delay: 300 },
        { el: cOrtu, delay: 500 },
        { el: cNis, delay: 700 },
        { 
          el: cWish, 
          delay: 900, 
          callback: () => {
            ccContainer.classList.add('reveal-active');
            ccContainer.classList.add('show-particles');
          }
        }
      ]);
    }

    function nextStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex + 1) % studentsData.length;
      if (!bgMusic.paused) { bgMusic.currentTime = 0; }
      renderStudent(currentIndex);
    }

    function prevStudent() {
      if (studentsData.length === 0) return;
      currentIndex = (currentIndex - 1 + studentsData.length) % studentsData.length;
      if (!bgMusic.paused) { bgMusic.currentTime = 0; }
      renderStudent(currentIndex);
    }

    function initVisualizer() {
      if (audioCtx && analyser) return; 
      
      if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      analyser = audioCtx.createAnalyser();
      
      const source = audioCtx.createMediaElementSource(bgMusic);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      
      analyser.fftSize = 64; 
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      
      animateVisualizer();
    }

    function animateVisualizer() {
      visualizerAnimationId = requestAnimationFrame(animateVisualizer);
      const bars = document.querySelectorAll('.visualizer-bar');
      
      if (bgMusic.paused) {
        bars.forEach(bar => { bar.style.height = '4px'; });
        return;
      }
      
      analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < bars.length; i++) {
        let dataIndex = Math.floor(i * (bufferLength / bars.length));
        let value = dataArray[dataIndex];
        let percent = value / 255;
        let height = (percent * 24) + 4; 
        bars[i].style.height = height + 'px';
      }
    }

    function toggleMusic() {
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const musicBtn = document.getElementById('music-btn');
      
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          musicBtn.setAttribute('aria-label', 'Pause Musik');
        }).catch(error => console.log("Gagal memutar musik:", error));
      } else {
        bgMusic.pause();
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        musicBtn.setAttribute('aria-label', 'Putar Musik');
      }
    }

    window.addEventListener('keydown', (event) => {
      if (openingContainer.style.display !== 'none') {
        if (startInterface.style.display === 'none') {
          switch(event.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case 'PageDown':
            case 'Enter': 
              menujuGaleriUtama();
              break;
          }
        }
      } 
      else if (mainGalleryContent.style.display === 'flex') {
        switch(event.key) {
          case 'ArrowRight':
          case 'PageDown':
            nextStudent();
            break;
          case 'ArrowLeft':
          case 'PageUp':
            prevStudent();
            break;
        }
      }
    });
  </script>
</body>
</html>
