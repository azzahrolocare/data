<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Purnawiyata Ke-III SMP Islam Az-Zahro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0c08;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Canvas untuk Partikel Gold */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: none; /* Muncul setelah tombol start diklik */
      pointer-events: none; /* Agar tidak menghalangi klik pada video */
    }

    /* Container Utama Pembungkus Video */
    .video-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* Video Player - Mengikuti ukuran asli tanpa nge-zoom */
    #video-bg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain; /* Memastikan video tidak terpotong/ngezoom */
      display: none;
      cursor: pointer;
    }

    /* Overlay gelap tipis di atas video */
    .overlay-dark {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 8, 0.35);
      z-index: 3;
      display: none;
      pointer-events: none; /* Agar klik tembus ke video di bawahnya */
    }

    /* Kontainer Tombol Start */
    .interface-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #fff;
    }

    .card-start {
      border: 2px solid #d4af37;
      padding: 40px;
      background: rgba(26, 21, 14, 0.95);
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    }

    .card-start h1 {
      color: #d4af37;
      margin-bottom: 10px;
      letter-spacing: 2px;
      font-size: 2rem;
    }

    .card-start p {
      color: #e0e0e0;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }

    .btn-gold {
      padding: 15px 40px;
      background: linear-gradient(45deg, #a67c1e, #f3e5ab, #a67c1e);
      border: none;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      color: #0f0c08;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-gold:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(243, 229, 171, 0.6);
    }

    /* Tombol Navigasi Panah Samar (Minimalis) */
    .btn-skip {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: rgba(212, 175, 55, 0.15); /* Sangat samar */
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: rgba(243, 229, 171, 0.6);
      cursor: pointer;
      border-radius: 50%;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      transition: all 0.3s ease;
      font-size: 1.5rem;
    }

    .btn-skip:hover {
      background: rgba(212, 175, 55, 0.4);
      color: #fff;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="video-wrapper">
    <video id="video-bg" playsinline loop onclick="togglePlayPause()">
      <source src="https://azzahrolocare.github.io/data/purnawiyata/files/opening3.mp4" type="video/mp4">
      Browser tidak mendukung video HTML5.
    </video>
  </div>

  <div class="overlay-dark" id="overlay-dark"></div>

  <div class="interface-container" id="start-interface">
    <div class="card-start">
      <h1>SELAMAT & SUKSES</h1>
      <p>Purnawiyata Ke-III SMP Islam Az-Zahro</p>
      <button class="btn-gold" onclick="mulaiVideoSinematik()">Putar Video Pembuka</button>
    </div>
  </div>

  <button class="btn-skip" id="btn-skip" onclick="menujuGaleriUtama()" title="Masuk Ke Galeri Siswa">❯</button>

  <script>
    const video = document.getElementById('video-bg');
    const startInterface = document.getElementById('start-interface');
    const overlayDark = document.getElementById('overlay-dark');
    const btnSkip = document.getElementById('btn-skip');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    // Pengaturan Sistem Partikel Gold
    let particlesArray = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * -1 - 0.5; // Bergerak perlahan ke atas
        this.alpha = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        // Warna Gradasi Emas Luxury
        ctx.fillStyle = '#d4af37';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#f3e5ab';
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      resizeCanvas();
      particlesArray = [];
      for (let i = 0; i < 70; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    // Fungsi memutar video pertama kali
    function mulaiVideoSinematik() {
      startInterface.style.display = 'none';
      video.style.display = 'block';
      overlayDark.style.display = 'block';
      btnSkip.style.display = 'flex'; // Menggunakan flex untuk center icon panah
      canvas.style.display = 'block';
      
      // Jalankan animasi partikel di sisa ruang kosong
      initParticles();
      animateParticles();

      // Otomatis Layar Penuh (Fullscreen)
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      }

      video.muted = false; 
      video.play().catch(error => {
        console.log("Gagal memutar video: ", error);
        menujuGaleriUtama();
      });
    }

    // Fungsi Klik Layar untuk Play dan Pause (Tanpa memunculkan logo kontrol bawaan browser)
    function togglePlayPause() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function menujuGaleriUtama() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
