name: PWA to APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build APK
      run: |
        # Membuat folder output terpisah
        mkdir -p output_apk
        cd output_apk
        
        # Inisialisasi proyek Android menggunakan manifest.json dari website Anda
        bubblewrap init --manifest="https://azzahro.web.id" --yes
        
        # Proses compile otomatis menjadi APK asli
        bubblewrap build --yes

    - name: Upload APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Penilaian-APK
        path: output_apk/*.apk

