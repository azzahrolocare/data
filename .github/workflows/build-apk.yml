name: Build Cordova APK (Direct Link Wrapper)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4 (Fix Compatibility)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install Cordova Global
        run: npm install -g cordova

      - name: Generate Cordova Project Architecture
        run: |
          # 1. Membuat project cordova baru bernama cbt-live-app
          cordova create cbt-live-app id.web.azzahro.cbt "SmartGrader Az-Zahro"
          cd cbt-live-app

          # 2. Setup config.xml langsung mengarah ke link login utama
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="id.web.azzahro.cbt" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>SmartGrader Az-Zahro</name>
              <description>Aplikasi CBT Az-Zahro Direct Link Wrapper</description>
              <author email="admin@azzahro.web.id" href="https://azzahro.web.id">Rahmattullah</author>
              
              <!-- Mengunci langsung ke link login utama -->
              <content src="https://azzahro.web.id/cbt/login" />
              
              <!-- Izinkan akses penuh ke domain dan seluruh jalurnya -->
              <access origin="https://azzahro.web.id/*" />
              <allow-navigation href="https://azzahro.web.id/*" />
              <allow-intent href="https://azzahro.web.id/*" />
              
              <preference name="LogLevel" value="DEBUG" />
              <preference name="Fullscreen" value="true" />
              <preference name="Orientation" value="portrait" />
          </widget>
          EOF

          # 3. Buat file dummy internal agar build tidak error
          cat << 'EOF' > www/index.html
          <!DOCTYPE html><html><head><meta charset="utf-8"></head><body>Loading...</body></html>
          EOF

      - name: Add Android Platform and Build APK
        run: |
          cd cbt-live-app
          cordova platform add android@12.0.0 --save
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-AzZahro-Live-APK
          path: cbt-live-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
