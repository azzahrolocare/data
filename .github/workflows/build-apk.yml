name: Build APK with Splash Screen and Fullscreen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Environment (Node.js, JDK, SDK)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. Install Cordova
    - name: Install Cordova
      run: npm install -g cordova

    # 4. Buat Proyek dan Konfigurasi Lengkap
    - name: Create Cordova App with All Settings
      run: |
        cordova create apk-project com.azzahro.penilaian "Penilaian Az-Zahro"
        cd apk-project
        
        # Tambahkan platform Android
        cordova platform add android
        
        # --- INSTALASI PLUGIN ---
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-inappbrowser
        
        # --- KONFIGURASI URL & NAVIGASI PANDUAN KETAT ---
        sed -i 's|<content src="index.html" />|<content src="https://azzahro.web.id/data/penilaian/" />|' config.xml
        
        # Membuka gerbang navigasi internal sedalam mungkin
        sed -i 's|<allow-intent href="http://\*//\*" />|<allow-navigation href="https://azzahro.web.id/*" /><allow-navigation href="https://azzahro.web.id/data/penilaian/*" /><allow-intent href="https://azzahro.web.id/*" />\n    <preference name="StayInApp" value="true" />\n    <preference name="InAppBrowserStorageEnabled" value="true" />|' config.xml

        # --- JINAKKAN WINDOW.OPEN JAVASCRIPT SECARA OTOMATIS ---
        # Trik Injeksi JavaScript: Mengganti window.open(..., '_blank') menjadi window.open(..., '_self') secara paksa pada runtime WebView
        mkdir -p www
        echo 'document.addEventListener("deviceready", onDeviceReady, false);' > www/index.js
        echo 'function onDeviceReady() {' >> www/index.js
        echo '    var originalOpen = window.open;' >> www/index.js
        echo '    window.open = function(url, target, features) {' >> www/index.js
        echo '        if (target === "_blank") {' >> www/index.js
        echo '            target = "_self";' >> www/index.js
        echo '        }' >> www/index.js
        echo '        return originalOpen(url, target, features);' >> www/index.js
        echo '    };' >> www/index.js
        echo '}' >> www/index.js

        # Mengintegrasikan skrip penjinak tersebut ke dalam sistem injeksi Cordova
        sed -i '/<\/widget>/i \    <platform name="android">\n        <hooks>\n            <hook type="after_prepare" src="www/index.js" />\n        </hooks>\n    </platform>' config.xml

        # --- KONFIGURASI TOTAL FULLSCREEN ---
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" />\n    <preference name="StatusBarOverlaysWebView" value="true" />' config.xml

        # --- UNDUH & ATUR IKON + SPLASH SCREEN ---
        mkdir -p res/icon/android
        mkdir -p res/screen/android
        curl -L -o res/icon/android/icon.png https://azzahro.web.id/data/penilaian/icon-penilaian.png
        cp res/icon/android/icon.png res/screen/android/splash.png
        
        # Konfigurasi Splash Screen
        sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="3000" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="FadeSplashScreen" value="true" />\n    <preference name="FadeSplashScreenDuration" value="500" />\n    <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />' config.xml
        
        # Masukkan aset ke platform android
        sed -i '/<\/widget>/i \    <platform name="android">\n        <icon src="res/icon/android/icon.png" />\n        <splash src="res/screen/android/splash.png" />\n    </platform>' config.xml

    # 5. Proses Build menjadi APK
    - name: Build Android APK
      run: |
        cd apk-project
        cordova build android --debug

    # 6. Upload Hasil APK ke GitHub Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AzZahro-Penilaian-Lengkap-APK
        path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
