name: Build APK with Splash Screen and Fullscreen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Environment (Node.js, JDK, SDK)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. Install Cordova
    - name: Install Cordova
      run: npm install -g cordova

    # 4. Buat Proyek dan Konfigurasi Total Bebas Navigasi
    - name: Create Cordova App with Open Whitelist
      run: |
        cordova create apk-project com.azzahro.penilaian "Penilaian Az-Zahro"
        cd apk-project
        
        # Tambahkan platform Android
        cordova platform add android
        
        # --- INSTALASI PLUGIN ---
        cordova plugin add cordova-plugin-statusbar
        
        # --- KONFIGURASI URL UTAMA ---
        sed -i 's|<content src="index.html" />|<content src="https://azzahro.web.id/data/penilaian/" />|' config.xml
        
        # --- SOLUSI TOTAL: IZINKAN SEMUA NAVIGASI TANPA BATAS ---
        # Kita menghapus semua aturan bawaan yang membatasi navigasi, lalu memaksa mengizinkan segalanya (*)
        sed -i '/<allow-intent href="http:\/\/\\*\/\\*" \/>/d' config.xml
        sed -i '/<allow-intent href="https:\/\/\\*\/\\*" \/>/d' config.xml
        
        # Menyisipkan izin navigasi bebas dan setelan agar tetap di dalam aplikasi sebelum tag </widget>
        sed -i '/<\/widget>/i \    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="StayInApp" value="true" />' config.xml

        # --- KONFIGURASI TOTAL FULLSCREEN ---
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" />\n    <preference name="StatusBarOverlaysWebView" value="true" />' config.xml

        # --- UNDUH & ATUR IKON + SPLASH SCREEN ---
        mkdir -p res/icon/android
        mkdir -p res/screen/android
        curl -L -o res/icon/android/icon.png https://azzahro.web.id/data/penilaian/icon-penilaian.png
        cp res/icon/android/icon.png res/screen/android/splash.png
        
        # Konfigurasi Splash Screen
        sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="3000" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="FadeSplashScreen" value="true" />\n    <preference name="FadeSplashScreenDuration" value="500" />\n    <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />' config.xml
        
        # Masukkan aset ke platform android
        sed -i '/<\/widget>/i \    <platform name="android">\n        <icon src="res/icon/android/icon.png" />\n        <splash src="res/screen/android/splash.png" />\n    </platform>' config.xml

    # 5. Proses Build menjadi APK
    - name: Build Android APK
      run: |
        cd apk-project
        cordova build android --debug

    # 6. Upload Hasil APK ke GitHub Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AzZahro-Penilaian-Final-APK
        path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
