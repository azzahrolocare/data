name: Build APK with Splash Screen and Fullscreen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Environment (Node.js, JDK, SDK)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. Install Cordova
    - name: Install Cordova
      run: npm install -g cordova

    # 4. Buat Proyek dan Konfigurasi (Nama Aplikasi, URL, Whitelist, Ikon, Splash)
    - name: Create Cordova App with SmartGrader Settings
      run: |
        # Inisialisasi proyek dengan nama aplikasi baru
        cordova create apk-project com.azzahro.penilaian "SmartGrader Az-Zahro"
        cd apk-project
        
        # Tambahkan platform Android bawaan
        cordova platform add android
        
        # --- INSTALASI PLUGIN ---
        cordova plugin add cordova-plugin-statusbar
        
        # --- KONFIGURASI URL & PANDUAN NAVIGASI AMAN ---
        sed -i 's|<content src="index.html" />|<content src="https://azzahro.web.id/data/penilaian/" />|' config.xml
        sed -i '/<allow-intent href="http:\/\/\\*\/\\*" \/>/d' config.xml
        sed -i '/<allow-intent href="https:\/\/\\*\/\\*" \/>/d' config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="StayInApp" value="true" />' config.xml

        # --- KONFIGURASI IMMERSIVE FULLSCREEN ---
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" />\n    <preference name="StatusBarOverlaysWebView" value="true" />' config.xml

        # --- MANAJEMEN ASET IKON & SPLASH SCREEN ---
        mkdir -p res/icon/android
        mkdir -p res/screen/android
        
        # Unduh berkas ikon utama SmartGrader
        curl -L -o res/icon/android/icon.png https://azzahro.web.id/data/penilaian/icon-smartgrader.png
        
        # Pemotongan radius sudut melengkung pada ikon splash screen via ImageMagick
        convert res/icon/android/icon.png \
          \( +clone -alpha extract \
             -draw 'fill black polygon 0,0 0,15 15,0 fill white circle 15,15 15,0' \
             -transverse -draw 'fill black polygon 0,0 0,15 15,0 fill white circle 15,15 15,0' \
             -flip -draw 'fill black polygon 0,0 0,15 15,0 fill white circle 15,15 15,0' \
             -transverse -draw 'fill black polygon 0,0 0,15 15,0 fill white circle 15,15 15,0' \
          \) -alpha off -compose CopyOpacity -composite res/screen/android/splash.png
        
        # --- OPTIMALISASI PARAMETER SPLASH SCREEN ---
        # Mengatur durasi tampilan, animasi fade-out, serta efek penutupan otomatis yang mulus
        sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="3000" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="FadeSplashScreen" value="true" />\n    <preference name="FadeSplashScreenDuration" value="500" />\n    <preference name="SplashShowOnlyFirstTime" value="false" />' config.xml
        
        # Menyelaraskan warna latar belakang splash screen dengan tema sistem aktif perangkat (?android:attr/colorBackground)
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="?android:attr/colorBackground" />' config.xml
        
        # Daftarkan penempatan aset ke dalam tag platform Android
        sed -i '/<\/widget>/i \    <platform name="android">\n        <icon src="res/icon/android/icon.png" />\n        <splash src="res/screen/android/splash.png" />\n    </platform>' config.xml

    # 5. Proses Kompilasi Menjadi Android APK
    - name: Build Android APK
      run: |
        cd apk-project
        cordova build android --debug

    # 6. Unggah Hasil Kompilasi ke GitHub Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartGrader-AzZahro-Lengkap-APK
        path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
