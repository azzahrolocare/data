name: Build APK from Domain

on:
  push:
    branches:
      - main
  workflow_dispatch: # Biar bisa di-klik tombol "Run workflow" manual dari GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 2. Setup Java Development Kit (JDK)
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Install Cordova secara global
    - name: Install Cordova
      run: npm install -g cordova

    # 5. Buat Proyek dan Arahkan Langsung ke Domain Anda
    - name: Create Cordova App Pointing to Domain
      run: |
        cordova create apk-project com.azzahro.penilaian "Penilaian Az-Zahro"
        cd apk-project
        cordova platform add android
        
        # Mengubah file config.xml agar aplikasi langsung membuka domain web Anda, bukan file lokal
        sed -i 's|<content src="index.html" />|<content src="https://azzahro.web.id/penilaian/" />|' config.xml
        
        # Memberikan izin akses navigasi ke domain agar tidak terlempar ke browser bawaan HP
        sed -i 's|<allow-intent href="http://\*//\*" />|<allow-navigation href="https://azzahro.web.id/*" />|' config.xml

    # 6. Proses Build menjadi APK
    - name: Build Android APK
      run: |
        cd apk-project
        cordova build android --debug

    # 7. Upload Hasil APK ke GitHub Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AzZahro-Penilaian-APK
        path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
